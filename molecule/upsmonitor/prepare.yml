---
- name: Wait for the provisioned Debian guest
  ansible.builtin.import_playbook: ../shared/prepare.yml
- name: Refresh package metadata in the fresh Debian container disk
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Refresh apt metadata before the production baseline installs packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
