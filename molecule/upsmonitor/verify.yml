---
- name: Verify NUT configuration and exporter software after reboot
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Read the installed NUT packages
      ansible.builtin.package_facts:
        manager: auto
    - name: Require the NUT packages to be installed
      ansible.builtin.assert:
        that:
          - "'nut-server' in ansible_facts.packages"
          - "'nut-client' in ansible_facts.packages"
    - name: Check the NUT server configuration files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nut/nut.conf
        - /etc/nut/upsd.conf
        - /etc/nut/upsd.users
      register: molecule_nut_config
    - name: Require private NUT configuration files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.mode == '0640'
      loop: "{{ molecule_nut_config.results }}"
    - name: Require exporter services to be running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - nut_exporter.service
        - node_exporter.service
      changed_when: false
    - name: Require the exporter listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9199
        timeout: 30
    - name: Scrape host metrics
      ansible.builtin.include_tasks: ../shared/tasks/http_metrics.yml
      vars:
        molecule_metrics_endpoint: node-metrics
        molecule_metrics_required:
          - node_uname_info
