---
- name: Verify the smoke-test guest
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Require the requested CentOS Stream release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'CentOS'
          - ansible_facts.distribution_major_version == '10'
    - name: Exercise the cloud-init user's privileged access
      ansible.builtin.command: id -u
      become: true
      changed_when: false
      register: molecule_smoke_uid
    - name: Require usable root access for installation tasks
      ansible.builtin.assert:
        that: molecule_smoke_uid.stdout == '0'
- name: Preserve snapshot input and retention regression coverage
  ansible.builtin.import_playbook: checks/snapshot_inputs.yml
