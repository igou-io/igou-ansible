---
all:
  children:
    molecule:
      children:
        armbian_builders:
          hosts:
            netboot-builder:
              mp:
                kubevirt:
                  memory: 8Gi
                  cpu:
                    cores: 4
                  boot_source:
                    type: data_volume_url
                    url: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2
                    size: 100Gi
                    storage_class: lvms-casval
        netboot_server:
          hosts:
            netboot-server:
              mp:
                kubevirt:
                  data_disks:
                    - name: exports
                      size: 16Gi
                      storage_class: lvms-casval
        boards:
          hosts:
            netboot-board-a:
              lab_address: 192.0.2.21
              armbian_board_mac: "52:54:00:aa:00:21"
              mp:
                kubevirt:
                  data_disks: "{{ lab_board_disks }}"
                  extra_interfaces:
                    - name: lab
                      bridge: {}
                      macAddress: "{{ armbian_board_mac }}"
            netboot-board-b:
              lab_address: 192.0.2.22
              armbian_board_mac: "52:54:00:aa:00:22"
              mp:
                kubevirt:
                  data_disks: "{{ lab_board_disks }}"
                  extra_interfaces:
                    - name: lab
                      bridge: {}
                      macAddress: "{{ armbian_board_mac }}"
        routeros_netboot:
          hosts:
            netboot-router:
              mp:
                kubevirt:
                  memory: 512Mi
                  ssh_user: admin
                  interfaces:
                    - name: default
                      model: e1000
                      masquerade: {}
                  extra_interfaces:
                    - name: lab
                      model: e1000
                      bridge: {}
                  cloud_init:
                    enabled: false
                  boot_source:
                    type: data_volume_url
                    url: "http://{{ lab_network }}.{{ lab_namespace }}.svc.cluster.local:8080/chr-7.23.8.img"
                    size: 1Gi
                    storage_class: lvms-casval
    linux_guests:
      children:
        armbian_builders: {}
        netboot_server: {}
        boards: {}
    routeros_router:
      children:
        routeros_netboot: {}
    build_targets:
      hosts:
        netboot-board-a: {}
