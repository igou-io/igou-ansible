---
- name: Seed a publication-retention fixture
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Create the published and unmanaged fixture directories
      ansible.builtin.file:
        path: "{{ armbian_nfs_assets_export }}/images/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - retention-fixture
        - unmanaged-fixture
    - name: Publish a manifest selecting the retained image
      ansible.builtin.copy:
        dest: "{{ armbian_nfs_assets_export }}/images/retention-fixture/manifest.json"
        content: "{{ lab_retained_manifest | to_json }}\n"
        mode: "0644"
      vars:
        lab_retained_manifest:
          image_filename: current.img.xz
    - name: Seed current, stale, and unmanaged image paths
      ansible.builtin.copy:
        dest: "{{ armbian_nfs_assets_export }}/images/{{ item }}"
        content: "retention fixture\n"
        mode: "0644"
      loop:
        - retention-fixture/current.img.xz
        - retention-fixture/current.img.xz.sha
        - retention-fixture/stale.img.xz
        - retention-fixture/stale.img.xz.sha
        - unmanaged-fixture/unmanaged.img.xz
- name: Prune through the actual collection entry point
  ansible.builtin.import_playbook: david_igou.armbian.cleanup_boot_files
- name: Verify which published URLs remain available
  hosts: boards
  gather_facts: false
  tasks:
    - name: Request each publication after retention cleanup
      ansible.builtin.uri:
        url: "{{ armbian_assets_base_url }}/images/{{ item.path }}"
        status_code: "{{ item.status }}"
      loop:
        - path: retention-fixture/current.img.xz
          status: 200
        - path: retention-fixture/current.img.xz.sha
          status: 200
        - path: retention-fixture/stale.img.xz
          status: 404
        - path: retention-fixture/stale.img.xz.sha
          status: 404
        - path: unmanaged-fixture/unmanaged.img.xz
          status: 200
