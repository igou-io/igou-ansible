---
- name: Exercise image-build reuse and publication
  ansible.builtin.import_playbook: build.yml
- name: Configure the RouterOS transport
  ansible.builtin.import_playbook: router_transport.yml
- name: Stage both hosts through the collection workflow
  ansible.builtin.import_playbook: david_igou.armbian.stage_netboot_assets
- name: Stage the router through the collection workflow
  ansible.builtin.import_playbook: david_igou.armbian.stage_router
- name: Converge the declared boot mode through the collection workflow
  ansible.builtin.import_playbook: david_igou.armbian.converge_boot_mode
- name: Exercise the storage and bootstrap contracts
  ansible.builtin.import_playbook: storage.yml
