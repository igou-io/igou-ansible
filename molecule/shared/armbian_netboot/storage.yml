---
- name: Exercise imaging and provisioning against real disposable disks
  hosts: boards
  become: true
  gather_facts: true
  tasks:
    - name: Mount this board's staged NFS rootfs
      ansible.posix.mount:
        path: /mnt/netboot-source
        src: "{{ lab_server_address }}:{{ armbian_nfs_rootfs_path }}/{{ inventory_hostname }}"
        fstype: nfs
        opts: vers=3,rw,nolock
        state: ephemeral
    - name: Read the NFS-exported application payload
      ansible.builtin.command: cat /mnt/netboot-source/root/payload
      register: lab_payload
      changed_when: false
    - name: Require the expected payload from the staged image
      ansible.builtin.assert:
        that: lab_payload.stdout == 'fixture payload'
    - name: Download the compressed image to exercise local and HTTP sources
      ansible.builtin.get_url:
        url: "{{ armbian_rootfs_src }}"
        dest: /var/tmp/fixture.img.xz
        mode: "0644"
    - name: Decompress the local raw-image fixture
      ansible.builtin.command: xz -dkf /var/tmp/fixture.img.xz
      changed_when: true
    - name: Exercise all four disk-image source paths
      ansible.builtin.include_tasks: tasks/image_disk.yml
      loop:
        - /var/tmp/fixture.img
        - /var/tmp/fixture.img.xz
        - "http://{{ lab_server_address }}:8080/fixture.img"
        - "{{ armbian_rootfs_src }}"
      loop_control:
        loop_var: lab_image_source
    - name: Provision local storage from the staged rootfs
      ansible.builtin.include_role:
        name: david_igou.armbian.disk_provision
      vars:
        disk_provision_source: /mnt/netboot-source
        disk_provision_disk_binding: "{{ lab_disk_binding }}"
    - name: Bootstrap the automation user with a fresh generated key
      ansible.builtin.include_role:
        name: david_igou.armbian.bootstrap_armbian
    - name: Activate the bootstrap SSH configuration
      ansible.builtin.meta: flush_handlers
