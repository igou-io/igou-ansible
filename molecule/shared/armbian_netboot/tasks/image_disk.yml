---
- name: Write the image through the selected source path
  ansible.builtin.include_role:
    name: david_igou.armbian.disk_image
  vars:
    disk_image_target_device: /dev/vdc
    disk_image_source: "{{ lab_image_source }}"
- name: Compare this source path's disk contents with the raw image
  ansible.builtin.shell: cmp -n "$(stat -c %s /var/tmp/fixture.img)" /var/tmp/fixture.img /dev/vdc
  args:
    executable: /bin/bash
  changed_when: false
