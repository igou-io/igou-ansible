---
- name: Verify guest placement and resource ownership
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check the cluster and identity before verification
      ansible.builtin.include_tasks: tasks/cluster_identity.yml
    - name: Inspect this run's virtual machines
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        namespace: "{{ lab_namespace }}"
        label_selectors:
          - "molecule-provisioners.igou.io/run-id={{ lab_state.id }}"
      register: lab_vmis
    - name: Require all five guests to run on casval
      ansible.builtin.assert:
        that:
          - lab_vmis.resources | length == 5
          - lab_vmis.resources | map(attribute='status.nodeName') | unique | list == [lab_node]
- name: Verify actual network delivery, storage, and authentication
  hosts: boards
  become: true
  gather_facts: false
  tasks:
    - name: Mount the staged rootfs after management-image reboots
      ansible.posix.mount:
        path: /mnt/netboot-source
        src: "{{ lab_server_address }}:{{ armbian_nfs_rootfs_path }}/{{ inventory_hostname }}"
        fstype: nfs
        opts: vers=3,rw,nolock
        state: ephemeral
    - name: Verify the excluded disk remains byte-identical
      ansible.builtin.command: sha256sum --check /var/tmp/armbian-untouched.sha256
      changed_when: false
    - name: Release any previous local-root verification mount
      ansible.posix.mount:
        path: /mnt/netboot-local
        state: unmounted
    - name: Mount the provisioned local root
      ansible.posix.mount:
        path: /mnt/netboot-local
        src: LABEL=armbi_root_local
        fstype: ext4
        state: ephemeral
    - name: Read the payload from the provisioned filesystem
      ansible.builtin.command: cat /mnt/netboot-local/root/payload
      register: lab_local_payload
      changed_when: false
    - name: Require usable data on the target filesystem
      ansible.builtin.assert:
        that: lab_local_payload.stdout == 'fixture payload'
    - name: Parse the generated mount table with the system parser
      ansible.builtin.command: findmnt --fstab --json --tab-file /mnt/netboot-local/etc/fstab
      changed_when: false
    - name: Release the local-root verification mount
      ansible.posix.mount:
        path: /mnt/netboot-local
        state: unmounted
    - name: Fetch actual kernel bytes from the test router
      throttle: 1
      ansible.builtin.command:
        argv:
          - timeout
          - "300"
          - tftp
          - -m
          - binary
          - "{{ lab_router_address }}"
          - -c
          - get
          - "armbian/{{ inventory_hostname }}/vmlinuz"
          - /var/tmp/router-vmlinuz
      changed_when: false
    - name: Compare the TFTP response to the staged NFS kernel
      ansible.builtin.shell: cmp /var/tmp/router-vmlinuz /mnt/netboot-source/boot/vmlinuz-*
      changed_when: false
    - name: Fetch the actual per-MAC boot configuration
      ansible.builtin.command:
        argv:
          - timeout
          - "60"
          - tftp
          - "{{ lab_router_address }}"
          - -c
          - get
          - "pxelinux.cfg/01-{{ armbian_board_mac | lower | replace(':', '-') }}"
          - /var/tmp/router-pxelinux
      changed_when: false
    - name: Read the configuration that a boot client receives
      ansible.builtin.slurp:
        src: /var/tmp/router-pxelinux
      register: lab_received_pxe
    - name: Require this host's mode, NFS root and assets in the custom boot format
      ansible.builtin.assert:
        that:
          - "('default ' ~ armbian_boot_mode) in (lab_received_pxe.content | b64decode)"
          - "('rootfs/' ~ inventory_hostname) in (lab_received_pxe.content | b64decode)"
          - "('armbian/' ~ inventory_hostname ~ '/vmlinuz') in (lab_received_pxe.content | b64decode)"
    - name: Verify automation-user authentication and passwordless privilege escalation
      ansible.builtin.command: sudo -n id -u
      become: false
      vars:
        ansible_user: "{{ armbian_bootstrap_user }}"
      register: lab_sudo
      changed_when: false
    - name: Require root privileges through the newly bootstrapped account
      ansible.builtin.assert:
        that: lab_sudo.stdout == '0'
    - name: Query sshd's effective password-authentication setting
      ansible.builtin.command: sshd -T
      register: lab_password_authentication
      changed_when: false
    - name: Require password authentication to be disabled
      ansible.builtin.assert:
        that: "'passwordauthentication no' in lab_password_authentication.stdout_lines"
    - name: Fetch the manifest published through the builder and controller
      ansible.builtin.uri:
        url: "{{ armbian_assets_base_url }}/images/{{ inventory_hostname }}/manifest.json"
        return_content: true
      register: lab_published_manifest
      when: inventory_hostname in groups['build_targets']
    - name: Require the cached build to retain its original manifest
      ansible.builtin.assert:
        that: lab_published_manifest.json.built_at == 'lab-cache-seed'
      when:
        - inventory_hostname in groups['build_targets']
        - not lab_real_build | bool
    - name: Hash the original fixture for publication verification
      ansible.builtin.stat:
        path: /var/tmp/fixture.img.xz
        checksum_algorithm: sha256
      register: lab_fixture_digest
      when: inventory_hostname in groups['build_targets']
    - name: Download the published image and verify its cached-mode checksum
      ansible.builtin.get_url:
        url: "{{ armbian_assets_base_url }}/images/{{ inventory_hostname }}/{{ lab_published_manifest.json.image_filename }}"
        dest: /var/tmp/published.img.xz
        checksum: "{{ omit if lab_real_build else 'sha256:' ~ lab_fixture_digest.stat.checksum }}"
        mode: "0644"
      when: inventory_hostname in groups['build_targets']
    - name: Validate the published compressed image
      ansible.builtin.command: xz -t /var/tmp/published.img.xz
      changed_when: false
      when: inventory_hostname in groups['build_targets']
- name: Verify per-host identities and shared-download behavior
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Read each staged public host-key fingerprint
      ansible.builtin.command: "ssh-keygen -lf {{ armbian_nfs_rootfs_path }}/{{ item }}/etc/ssh/ssh_host_ed25519_key.pub"
      loop: "{{ groups['boards'] }}"
      register: lab_fingerprints
      changed_when: false
    - name: Require different SSH identities for hosts sharing the same image
      ansible.builtin.assert:
        that: lab_fingerprints.results | map(attribute='stdout') | unique | list | length == 2
    - name: Count HTTP image-download requests
      ansible.builtin.command: cat /var/log/nginx/armbian-access.log
      register: lab_http_log
      changed_when: false
    - name: Require the shared staging download to have happened
      ansible.builtin.assert:
        that: >-
          lab_http_log.stdout | regex_findall('(?m)^192\.0\.2\.10 .*"GET /fixture\.img\.xz ')
          | length > 0
