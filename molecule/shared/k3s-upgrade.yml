---
- name: Upgrade the disposable cluster to the next patch
  ansible.builtin.import_playbook: ../../playbooks/kubernetes/upgrade-k3s.yaml
  vars:
    k3s_release_version: v1.36.6+k3s1

- name: Record service invocation IDs after the upgrade
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Read the current service invocation ID
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - k3s.service
          - --property=InvocationID
          - --value
      register: molecule_k3s_invocation
      changed_when: false

- name: Repeat the upgrade against the same desired release
  ansible.builtin.import_playbook: ../../playbooks/kubernetes/upgrade-k3s.yaml
  vars:
    k3s_release_version: v1.36.6+k3s1

- name: Require the repeated run to preserve service invocations
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Read the service invocation ID after the repeated run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - k3s.service
          - --property=InvocationID
          - --value
      register: molecule_k3s_invocation_after
      changed_when: false

    - name: Require a real running service without a repeat restart
      ansible.builtin.assert:
        that:
          - molecule_k3s_invocation.stdout | length > 0
          - molecule_k3s_invocation_after.stdout == molecule_k3s_invocation.stdout

- name: Verify that the recovery archive contains a usable SQLite database
  hosts: k3s_upgrade_servers
  become: true
  gather_facts: false
  tasks:
    - name: Allocate a private recovery test directory
      ansible.builtin.tempfile:
        state: directory
        prefix: k3s-recovery-test-
      register: molecule_k3s_recovery

    - name: Check the saved database without logging recovery material
      no_log: true
      block:
        - name: Extract the recovery archive in the disposable guest
          ansible.builtin.unarchive:
            src: /var/backups/k3s/v1.36.6+k3s1/recovery.tgz
            dest: "{{ molecule_k3s_recovery.path }}"
            remote_src: true

        - name: Check the backed-up SQLite database integrity
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - >-
                import sqlite3, sys;
                db = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True);
                assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok';
                assert db.execute('SELECT count(*) FROM kine').fetchone()[0] > 0
              - "{{ molecule_k3s_recovery.path }}/var/lib/rancher/k3s/server/db/state.db"
          changed_when: false
      always:
        - name: Remove the extracted recovery material
          ansible.builtin.file:
            path: "{{ molecule_k3s_recovery.path }}"
            state: absent
