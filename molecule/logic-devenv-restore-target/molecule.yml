---
# No instances or restore: exercise host selection and the confirmation gate locally.
prerun: false
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
  playbooks:
    verify: verify.yml
scenario:
  name: logic-devenv-restore-target
  # Read-only checks; there is no convergence or idempotence operation.
  test_sequence:
    - verify
verifier:
  name: ansible
