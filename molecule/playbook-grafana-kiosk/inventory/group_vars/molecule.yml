---
mp_backend: kubevirt
# Match the Pi Zero 2 W's physical memory envelope; the play configures zram.
mp_kubevirt_wait_timeout: 600
mp_defaults:
  kubevirt:
    boot_source:
      type: container_disk
      image: quay.io/containerdisks/debian:12
    ssh_user: debian
    cpu:
      cores: 2
    memory: 512Mi
