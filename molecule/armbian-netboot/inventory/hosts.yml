---
all:
  # Five disposable amd64 VMs on casval. No production inventory is loaded.
  # enp1s0: KubeVirt management DHCP/SSH; enp2s0: isolated CHR DHCP/PXE/NFS LAN.
  # The board payload is Debian 13 (trixie), seeded from 2026-08-01 and later
  # updated from the current trixie repositories. It is not Rockchip firmware.
  children:
    molecule:
      children:
        armbian_builders:
          hosts:
            netboot-builder:
              # Debian 13 genericcloud, build 20261103-2651; Armbian build cache
              # fixture by default, uefi-x86/current v26.8.0-trunk.180 optionally.
              mp:
                kubevirt:
                  memory: 8Gi
                  cpu:
                    cores: 4
                  boot_source:
                    type: data_volume_url
                    url: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2
                    size: 100Gi
                    storage_class: lvms-casval
        netboot_server:
          hosts:
            netboot-server:
              # Debian 13 containerdisk pinned below; NFSv3 roots + HTTP images.
              # Serves the Debian snapshot fixture and Syslinux 6.04 PXE loader.
              lab_os:
                distribution: Debian
                release: "13"
                image: quay.io/containerdisks/debian:13@sha256:ddc9a3fc809b7e89f78862e267a5b246dfddeba0e878f8be74424f8cb9dfbb90
              mp:
                kubevirt:
                  boot_source:
                    type: container_disk
                    image: "{{ lab_os.image }}"
                  data_disks:
                    - name: exports
                      size: 16Gi
                      storage_class: lvms-casval
        boards:
          hosts:
            netboot-board-a:
              # Debian 13 x86 board substitute; BIOS PXE -> CHR's per-MAC pin.
              # NFS/SD/local modes load the frozen snapshot kernel over TFTP.
              # local_kernel loads the apt-managed kernel from /dev/vdd via GRUB.
              # k3s v1.36.5+k3s1 control plane; worker is netboot-board-b.
              lab_os:
                distribution: Debian
                release: "13"
                fixture_snapshot: 20260801T000000Z
                management_image: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2
                k3s: v1.36.5+k3s1
              k3s_control_node: true
              lab_address: 192.0.2.21
              armbian_board_mac: "52:54:00:aa:00:21"
              mp:
                kubevirt:
                  memory: 4Gi
                  boot_source:
                    type: data_volume_url
                    url: "{{ lab_os.management_image }}"
                    size: 8Gi
                    storage_class: lvms-casval
                  boot_disk:
                    boot_order: 2
                  data_disks: "{{ lab_board_disks }}"
                  extra_interfaces:
                    - name: lab
                      bridge: {}
                      macAddress: "{{ armbian_board_mac }}"
                      bootOrder: 1
            netboot-board-b:
              # Same Debian snapshot/kernel/image and PXE path as board-a.
              # k3s v1.36.5+k3s1 worker; SD=/dev/vdc, local=/dev/vdd,
              # /dev/vde is excluded and its original checksum must survive.
              lab_os:
                distribution: Debian
                release: "13"
                fixture_snapshot: 20260801T000000Z
                management_image: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2
                k3s: v1.36.5+k3s1
              k3s_control_node: false
              lab_address: 192.0.2.22
              armbian_board_mac: "52:54:00:aa:00:22"
              mp:
                kubevirt:
                  memory: 4Gi
                  boot_source:
                    type: data_volume_url
                    url: "{{ lab_os.management_image }}"
                    size: 8Gi
                    storage_class: lvms-casval
                  boot_disk:
                    boot_order: 2
                  data_disks: "{{ lab_board_disks }}"
                  extra_interfaces:
                    - name: lab
                      bridge: {}
                      macAddress: "{{ armbian_board_mac }}"
                      bootOrder: 1
        routeros_netboot:
          hosts:
            netboot-router:
              # MikroTik CHR 7.23.8 amd64 from the vendor's public mirror.
              # create/prepare adapt this ZIP into a raw CDI import; the
              # temporary internal HTTP endpoint is generated, not the source.
              lab_os:
                distribution: RouterOS CHR
                release: 7.23.8
                archive_sha256: ac01ec7c092f4cab8136212e8ebfd613e0a37844c406317fa228d1ad446ce62c
              mp:
                kubevirt:
                  memory: 512Mi
                  ssh_user: admin
                  interfaces:
                    - name: default
                      model: e1000
                      masquerade: {}
                  extra_interfaces:
                    - name: lab
                      model: e1000
                      bridge: {}
                  cloud_init:
                    enabled: false
                  boot_source:
                    type: data_volume_url
                    url: https://download.mikrotik.com/routeros/7.23.8/chr-7.23.8.img.zip
                    size: 1Gi
                    storage_class: lvms-casval
    linux_guests:
      children:
        armbian_builders: {}
        netboot_server: {}
        boards: {}
    routeros_router:
      children:
        routeros_netboot: {}
    build_targets:
      hosts:
        netboot-board-a: {}
    rk8s:
      children:
        rk8s_control_plane:
          hosts:
            netboot-board-a: {}
        rk8s_workers:
          hosts:
            netboot-board-b: {}
