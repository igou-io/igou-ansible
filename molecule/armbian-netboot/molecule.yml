---
dependency:
  command: bash ${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/armbian_netboot/dependency.sh
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/inventory/
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/molecule/shared/armbian_netboot/inventory/
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
        - --extra-vars=@${MOLECULE_SCENARIO_DIRECTORY}/overrides.yml
  playbooks:
    create: ../shared/armbian_netboot/create.yml
    prepare: ../shared/armbian_netboot/prepare.yml
    destroy: ../shared/armbian_netboot/destroy.yml
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - side_effect
    - verify
    - destroy
