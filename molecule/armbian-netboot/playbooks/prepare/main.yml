---
# Prepare fixtures and baselines before invoking the workflows under test.
- name: Wait for Linux management connections
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.prepare
  vars:
    ansible_connection: "{{ 'local' if inventory_hostname == 'netboot-router' else 'ssh' }}"
- name: Configure the private Linux guest interfaces and packages
  hosts: linux_guests
  become: true
  gather_facts: true
  tasks:
    - name: Configure the Linux fixture guests
      ansible.builtin.import_tasks: ../../tasks/prepare/linux.yml
- name: Prepare the netboot server
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Prepare the NFS and HTTP server
      ansible.builtin.import_tasks: ../../tasks/prepare/server.yml
- name: Bootstrap RouterOS without a POSIX guest interpreter
  hosts: routeros_netboot
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
  tasks:
    - name: Bootstrap the RouterOS fixture
      ansible.builtin.import_tasks: ../../tasks/prepare/router.yml
- name: Configure the isolated DHCP and PXE service
  ansible.builtin.import_playbook: pxe.yml
- name: Prepare disposable board data and capture excluded-disk evidence
  hosts: boards
  become: true
  gather_facts: false
  tasks:
    - name: Prepare the board disks and baseline
      ansible.builtin.import_tasks: ../../tasks/prepare/boards.yml
- name: Prepare the cached or real image builder
  ansible.builtin.import_playbook: builder.yml
