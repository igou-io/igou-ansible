---
- name: Resolve the cached-build fixture inputs through the production resolvers
  hosts: build_targets
  gather_facts: false
  tasks:
    - name: Resolve board metadata
      ansible.builtin.include_tasks: ../../../../playbooks/armbian/tasks/_resolve_board_config.yml
    - name: Resolve build metadata
      ansible.builtin.include_tasks: ../../../../playbooks/armbian/tasks/_resolve_build_profile.yml
- name: Prepare the cached or real image builder
  hosts: armbian_builders
  become: true
  gather_facts: true
  tasks:
    - name: Prepare the image builder and cached artifacts
      ansible.builtin.import_tasks: ../../tasks/prepare/builder.yml
