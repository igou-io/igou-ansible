---
- name: Activate DHCP on the private board interface
  ansible.builtin.systemd_service:
    name: systemd-networkd
    state: restarted
    enabled: true
- name: Wait for the CHR reservation to supply the private address
  ansible.builtin.command: ip -4 -o address show dev enp2s0
  register: lab_dhcp_address
  changed_when: false
  until: (lab_address ~ '/24') in lab_dhcp_address.stdout
  retries: 30
  delay: 2
- name: Confirm all test disks exist
  ansible.builtin.command: lsblk -nro NAME,SIZE,TYPE
  register: lab_disks
  changed_when: false
- name: Require the expected disposable device set
  ansible.builtin.assert:
    that:
      - "'vdc' in lab_disks.stdout"
      - "'vdd' in lab_disks.stdout"
      - "'vde' in lab_disks.stdout"
- name: Create an existing filesystem on the excluded data disk
  community.general.filesystem:
    dev: /dev/vde
    fstype: ext4
    opts: -L lab_excluded
    state: present
- name: Mount the excluded filesystem to seed application data
  ansible.posix.mount:
    path: /mnt/lab-excluded
    src: /dev/vde
    fstype: ext4
    opts: nodev,nosuid,noexec
    state: ephemeral
- name: Seed nonzero data that disk operations must preserve
  ansible.builtin.copy:
    dest: /mnt/lab-excluded/application-state
    content: "Existing application data on {{ inventory_hostname }}\n"
    mode: "0644"
- name: Unmount the excluded filesystem before recording its byte baseline
  ansible.posix.mount:
    path: /mnt/lab-excluded
    state: unmounted
- name: Record the excluded disk checksum
  ansible.builtin.command: sha256sum /dev/vde
  register: lab_untouched_checksum
  changed_when: false
- name: Retain the excluded-disk baseline across root filesystem changes
  ansible.builtin.copy:
    dest: "{{ lab_ephemeral_directory }}/{{ inventory_hostname }}-untouched.sha256"
    content: "{{ lab_untouched_checksum.stdout }}\n"
    mode: "0644"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
