---
armbian_bootstrap_user: lab-automation
armbian_bootstrap_ssh_keys:
  - "{{ lookup('ansible.builtin.file', lab_ephemeral_directory ~ '/identity_file.pub') }}"
armbian_default_password: "{{ lab_bootstrap_password_lookup }}"
full_reimage_k3s_cleanup: true
armbian_poe_cycle_tasks_file: "{{ lab_scenario_directory }}/tasks/boot_mode.yml"
