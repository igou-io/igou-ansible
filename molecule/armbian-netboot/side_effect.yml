---
- name: Configure the RouterOS transport for the repeated lab workflows
  ansible.builtin.import_playbook: router_transport.yml
- name: Exercise data preservation through repeated lab reprovisioning
  ansible.builtin.import_playbook: preserve.yml
- name: Exercise all boot modes through the lab's mode and cycle entry points
  ansible.builtin.import_playbook: boot.yml
- name: Exercise the complete lab reimage workflow on one virtual canary
  ansible.builtin.import_playbook: ../../playbooks/armbian/full_reimage.yaml
  vars:
    target_hosts: netboot-board-a
