---
- name: Wait for Windows connections
  ansible.builtin.import_playbook: ../shared/prepare.yml
- name: Prepare — seed the to-be-removed user
  hosts: windows
  gather_facts: false
  tasks:
    - name: Create the doomed user so converge's absent case is a real change
      ansible.windows.win_user:
        name: molgone
        password: "{{ molecule_windows_password_lookup }}"
        state: present
      no_log: true
- name: Prepare — seed the doomed rule and the 7778 TCP listener
  hosts: windows
  gather_facts: false
  tasks:
    - name: Create the doomed rule so converge's absent case is a real change
      community.windows.win_firewall_rule:
        name: Remove legacy molecule TCP 7779
        direction: in
        action: allow
        protocol: tcp
        localport: '7779'
        state: present
        enabled: true
    - name: Register the SYSTEM TCP listener accept-loop as a scheduled task
      community.windows.win_scheduled_task:
        name: molecule-fwprobe-listener
        path: \Ansible
        description: Molecule firewall-probe listener — a PowerShell TcpListener accept-loop on 0.0.0.0:7778 so verify's negative external probe tests the firewall, not a missing listener. Torn down in verify's always block.
        actions:
          - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
            arguments: -ExecutionPolicy Bypass -WindowStyle Hidden -NonInteractive -Command "$l = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Any, 7778); $l.Start(); while ($true) { $c = $l.AcceptTcpClient(); $c.Close() }"
        triggers:
          - type: boot
        username: SYSTEM
        run_level: highest
        state: present
        enabled: true
    - name: Start the listener task now (do not wait for the boot trigger)
      ansible.windows.win_shell: Start-ScheduledTask -TaskPath \Ansible\ -TaskName molecule-fwprobe-listener
      changed_when: false
