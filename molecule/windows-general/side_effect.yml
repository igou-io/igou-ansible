---
- name: Reboot the client and server before final verification
  hosts: windows
  gather_facts: false
  tasks:
    - name: Reboot Windows
      ansible.windows.win_reboot:
        reboot_timeout: 1500
- name: Verify console auto-logon survived the reboot before reconverging
  ansible.builtin.import_playbook: checks/autologon.yml
