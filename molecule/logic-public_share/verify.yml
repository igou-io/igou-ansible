---
- name: Verify public-sharing endpoint naming without infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    public_share_test_backend:
      service: web-public
      tailnet_fqdn: ocp-public-web.example.ts.net
      ports:
        HTTP: 8080
        TCP: 9000
        UDP: 9000
    public_share_test_protocols:
      - HTTP
      - TCP
      - UDP
    public_share_test_expiry: '2026-10-30T17:00:00Z'
    public_share_test_gateway:
      spec:
        listeners:
          - name: https
            protocol: HTTPS
            port: 443
          - name: tcp-27010
            protocol: TCP
            port: 27010
          - name: udp-27018
            protocol: UDP
            port: 27018
  tasks:
    - name: Render endpoints with a custom subdomain
      ansible.builtin.set_fact:
        public_share_test_objects: >-
          {{ public_share_test_backend | public_share_render('ps-123', 'aap-user-7',
               public_share_test_expiry, public_share_test_protocols, 27010, 27018, 'demo') }}

    - name: Verify names are usable and ownership is still bound to the job
      vars:
        public_share_test_summary: "{{ (public_share_test_objects | public_share_summary)[0] }}"
        public_share_test_http: "{{ public_share_test_objects | selectattr('kind', 'equalto', 'HTTPRoute') | first }}"
      ansible.builtin.assert:
        that:
          - public_share_test_http.spec.hostnames == ['demo.igou.io']
          - public_share_test_summary.id == 'ps-123'
          - public_share_test_summary.owner == 'aap-user-7'
          - "'https://demo.igou.io' in public_share_test_summary.endpoints"
          - "'tcp://demo.igou.io:27010' in public_share_test_summary.endpoints"
          - "'udp://demo.igou.io:27018' in public_share_test_summary.endpoints"
          - public_share_test_objects | public_share_check_routes([], public_share_test_gateway)

    - name: Verify blank input preserves the generated hostname
      vars:
        public_share_test_default: >-
          {{ public_share_test_backend | public_share_render('ps-456', 'aap-user-7',
               public_share_test_expiry, ['HTTP']) }}
      ansible.builtin.assert:
        that:
          - "'https://ps-456.igou.io' in (public_share_test_default | public_share_summary)[0].endpoints"

    - name: Verify invalid and reserved labels fail before resource creation
      ansible.builtin.include_tasks: tasks/invalid-label.yml
      loop:
        - www
        - gotify
        - ps-456
        - Demo
        - demo.example
        - '-demo'
        - 'demo-'
        - '*'
        - "{{ 'a' * 64 }}"
        - 123
      loop_control:
        loop_var: public_share_test_invalid_label

    - name: Reject a name already held by another owner's share
      block:
        - name: Check a duplicate hostname with a different job and owner
          vars:
            public_share_test_other: >-
              {{ public_share_test_backend | public_share_render('ps-789', 'aap-user-8',
                   public_share_test_expiry, ['HTTP'], 0, 0, 'demo') }}
          ansible.builtin.set_fact:
            public_share_test_collision: "{{ public_share_test_objects | public_share_check_routes(public_share_test_other, public_share_test_gateway) }}"
        - name: Fail when duplicate hostname was accepted
          ansible.builtin.fail:
            msg: Duplicate hostname was accepted.
      rescue:
        - name: Require the production collision check to reject the name
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check a duplicate hostname with a different job and owner'
              - "'already in use' in ansible_failed_result.msg"

    - name: Reject wildcard and catch-all HTTP route conflicts
      ansible.builtin.include_tasks: tasks/hostname-conflict.yml
      loop:
        - '*'
        - '*.igou.io'
      loop_control:
        loop_var: public_share_test_host_pattern
