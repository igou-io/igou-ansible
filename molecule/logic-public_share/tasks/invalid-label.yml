---
- name: Reject an invalid endpoint label
  block:
    - name: Render the invalid endpoint label
      ansible.builtin.set_fact:
        public_share_test_rejected: >-
          {{ public_share_test_backend | public_share_render('ps-123', 'aap-user-7',
               public_share_test_expiry, ['HTTP'], 0, 0, public_share_test_invalid_label) }}
    - name: Fail when an invalid label was accepted
      ansible.builtin.fail:
        msg: Invalid endpoint label was accepted.
  rescue:
    - name: Require the production renderer to reject the label
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Render the invalid endpoint label'
          - "'Subdomain' in ansible_failed_result.msg or 'reserved' in ansible_failed_result.msg"
