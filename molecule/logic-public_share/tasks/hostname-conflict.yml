---
- name: Reject an existing route covering the endpoint
  block:
    - name: Check an existing wildcard hostname
      vars:
        public_share_test_existing:
          - kind: HTTPRoute
            metadata:
              name: another-route
              namespace: public-services
            spec:
              hostnames:
                - "{{ public_share_test_host_pattern }}"
              parentRefs:
                - name: public
                  namespace: nginx-gateway
                  sectionName: https
      ansible.builtin.set_fact:
        public_share_test_collision: "{{ public_share_test_objects | public_share_check_routes(public_share_test_existing, public_share_test_gateway) }}"
    - name: Fail when a wildcard hostname was accepted
      ansible.builtin.fail:
        msg: Wildcard hostname conflict was accepted.
  rescue:
    - name: Require the production collision check to reject the name
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Check an existing wildcard hostname'
          - "'already in use' in ansible_failed_result.msg"
