---
- name: Refresh the guest connection before Docker group use
  hosts: devenv
  gather_facts: false
  tasks:
    - name: Record the boot ID before bootstrap
      ansible.builtin.command:
        cmd: cat /proc/sys/kernel/random/boot_id
      register: molecule_devenv_boot_before
      changed_when: false
    - name: Open a fresh login session
      ansible.builtin.meta: reset_connection
    - name: Provide the checkout path required by the devcontainer's skill linker
      ansible.builtin.file:
        path: /home/igou/workspace/igou-skills
        state: directory
        mode: '0755'
- name: Deploy the production devenv
  ansible.builtin.import_playbook: ../../playbooks/devenv/bootstrap.yml
- name: Wait for the devcontainer's editor to finish starting
  hosts: devenv
  gather_facts: false
  tasks:
    - name: Read the boot ID after bootstrap
      ansible.builtin.command:
        cmd: cat /proc/sys/kernel/random/boot_id
      register: molecule_devenv_boot_after
      changed_when: false
    - name: Require a reboot only when OS preparation requested one
      ansible.builtin.assert:
        that:
          - >-
            (molecule_devenv_boot_before.stdout != molecule_devenv_boot_after.stdout)
            == (devenv_os_reboot.changed | default(false))
    - name: Require code-server to answer locally
      ansible.builtin.uri:
        url: https://localhost:8080/
        validate_certs: false
        status_code: 200
      register: molecule_devenv_editor
      retries: 24
      delay: 5
      until: molecule_devenv_editor.status == 200
