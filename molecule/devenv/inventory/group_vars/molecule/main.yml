---
mp_kubevirt_wait_timeout: 600
devenv_bootstrap_op_connect_host: "{{ lookup('ansible.builtin.env', 'MOLECULE_OP_CONNECT_HOST') }}"
devenv_bootstrap_op_connect_token: "{{ lookup('ansible.builtin.env', 'MOLECULE_OP_CONNECT_TOKEN') }}"
devenv_bootstrap_op_sa_token: "{{ lookup('ansible.builtin.env', 'MOLECULE_OP_SERVICE_ACCOUNT_TOKEN') }}"
devenv_bootstrap_op_connect_enabled: |-
  {{ (devenv_bootstrap_op_connect_host | length > 0)
     and (devenv_bootstrap_op_connect_token | length > 0) }}
devenv_bootstrap_op_sa_enabled: "{{ devenv_bootstrap_op_sa_token | length > 0 }}"
devenv_bootstrap_op_enabled: |-
  {{ (devenv_bootstrap_op_connect_enabled | bool)
     or (devenv_bootstrap_op_sa_enabled | bool) }}
