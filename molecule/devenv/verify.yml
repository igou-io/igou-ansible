---
- name: Smoke-test the restored devenv deployment
  hosts: devenv
  gather_facts: false
  vars:
    molecule_devenv_editor_policy_directory: /home/igou/.local/share/igou-devenv/editor-policy
  tasks:
    - name: Install the editor policy behavioral checks
      ansible.builtin.copy:
        src: files/test_editor_policy.mjs
        dest: "{{ molecule_devenv_editor_policy_directory }}/test_editor_policy.mjs"
        mode: "0600"
    - name: Verify release rejection, safe merging and Claude removal
      ansible.builtin.command:
        argv:
          - node
          - --test
          - "{{ molecule_devenv_editor_policy_directory }}/test_editor_policy.mjs"
      environment:
        EDITOR_POLICY_PROGRAM: "{{ molecule_devenv_editor_policy_directory }}/editor_policy.mjs"
        EDITOR_POLICY_VALIDATOR: "{{ molecule_devenv_editor_policy_directory }}/source/.github/scripts/vscode-extension-releases.mjs"
      changed_when: false
    - name: Read the running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: molecule_devenv_kernel
      changed_when: false
    - name: Read the kernel selected for boot
      ansible.builtin.command:
        cmd: grubby --default-kernel
      become: true
      register: molecule_devenv_default_kernel
      changed_when: false
    - name: Require the selected kernel to be running
      ansible.builtin.assert:
        that:
          - "molecule_devenv_default_kernel.stdout | basename == 'vmlinuz-' ~ molecule_devenv_kernel.stdout"
    - name: Resolve Docker's modules for the running kernel
      ansible.builtin.command:
        argv:
          - modinfo
          - --filename
          - "{{ item }}"
      loop:
        - xt_addrtype
        - iptable_nat
        - br_netfilter
      register: molecule_devenv_module_paths
      changed_when: false
    - name: Require modules built for the running kernel
      ansible.builtin.assert:
        that:
          - "'/modules/' ~ molecule_devenv_kernel.stdout ~ '/' in item.stdout"
      loop: "{{ molecule_devenv_module_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Require Docker and the devcontainer unit to be active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - docker.service
        - igou-devenv.service
      changed_when: false
    - name: Require the devcontainer to be running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format={{ '{{' }}.State.Running{{ '}}' }}
          - igou-devenv
      register: molecule_devenv_container
      changed_when: false
    - name: Require the running container state
      ansible.builtin.assert:
        that:
          - molecule_devenv_container.stdout == 'true'
    - name: Request the externally reachable editor login page
      ansible.builtin.uri:
        url: https://{{ mp_kubevirt_endpoints['code-server'].host }}:{{ mp_kubevirt_endpoints['code-server'].port }}/
        validate_certs: false
        return_content: true
      delegate_to: localhost
      register: molecule_devenv_editor
    - name: Require authenticated editor access
      ansible.builtin.assert:
        that:
          - "'code-server login' in molecule_devenv_editor.content"
          - "'name=\"password\"' in molecule_devenv_editor.content"
    - name: Require the T3 service to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:3773/
        status_code: 200
      register: molecule_devenv_t3
      retries: 12
      delay: 5
      until: molecule_devenv_t3.status == 200
    - name: Scrape the host metrics service
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: molecule_devenv_metrics
    - name: Require actual host metrics
      ansible.builtin.assert:
        that:
          - "'node_uname_info' in molecule_devenv_metrics.content"
