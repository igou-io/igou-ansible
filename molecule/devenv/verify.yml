---
- name: Smoke-test the restored devenv deployment
  hosts: devenv
  gather_facts: false
  tasks:
    - name: Read the running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: molecule_devenv_kernel
      changed_when: false
    - name: Read the kernel selected for boot
      ansible.builtin.command:
        cmd: grubby --default-kernel
      become: true
      register: molecule_devenv_default_kernel
      changed_when: false
    - name: Require the selected kernel to be running
      ansible.builtin.assert:
        that:
          - "molecule_devenv_default_kernel.stdout | basename == 'vmlinuz-' ~ molecule_devenv_kernel.stdout"
    - name: Resolve Docker's modules for the running kernel
      ansible.builtin.command:
        argv:
          - modinfo
          - --filename
          - "{{ item }}"
      loop:
        - xt_addrtype
        - iptable_nat
        - br_netfilter
      register: molecule_devenv_module_paths
      changed_when: false
    - name: Require modules built for the running kernel
      ansible.builtin.assert:
        that:
          - "'/modules/' ~ molecule_devenv_kernel.stdout ~ '/' in item.stdout"
      loop: "{{ molecule_devenv_module_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Require Docker and the devcontainer unit to be active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - docker.service
        - igou-devenv.service
      changed_when: false
    - name: Require the devcontainer to be running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format={{ '{{' }}.State.Running{{ '}}' }}
          - igou-devenv
      register: molecule_devenv_container
      changed_when: false
    - name: Require the running container state
      ansible.builtin.assert:
        that:
          - molecule_devenv_container.stdout == 'true'
    - name: Inspect the running devcontainer release
      community.docker.docker_container_info:
        name: igou-devenv
      register: molecule_devenv_release
    - name: Require the pinned release and expected source revision
      ansible.builtin.assert:
        that:
          - molecule_devenv_release.container.Config.Image == devenv_image
          - molecule_devenv_release.container.Config.Labels['org.opencontainers.image.revision'] == devenv_expected_image_revision
        fail_msg: The running devcontainer does not match the pinned devenv release.
    - name: Read the devcontainer's github.com credential helper
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - igou-devenv
          - git
          - config
          - --system
          - --get
          - credential.https://github.com.helper
      register: molecule_devenv_git_helper
      changed_when: false
    - name: Require the shared gh CLI login wiring
      ansible.builtin.assert:
        that:
          - molecule_devenv_git_helper.stdout == '!/usr/local/bin/gh auth git-credential'
          - >-
            molecule_devenv_release.container.Mounts
            | selectattr('Destination', 'equalto', '/home/igou/.config/gh')
            | list | length == 1
        fail_msg: The devcontainer is not wired to the host's gh CLI login.
    - name: Request the externally reachable T3 service
      ansible.builtin.uri:
        url: http://{{ mp_kubevirt_endpoints['t3'].host }}:{{ mp_kubevirt_endpoints['t3'].port }}/
        status_code: 200
      delegate_to: localhost
    - name: Require the T3 service to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:3773/
        status_code: 200
      register: molecule_devenv_t3
      retries: 12
      delay: 5
      until: molecule_devenv_t3.status == 200
    - name: Scrape the host metrics service
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: molecule_devenv_metrics
    - name: Require actual host metrics
      ansible.builtin.assert:
        that:
          - "'node_uname_info' in molecule_devenv_metrics.content"
