---
- name: Configure the GitHub App client
  hosts: ghapp-client
  gather_facts: true
  vars:
    ghapp_client_enabled: true
    ghapp_client_user: cloud-user
    ghapp_client_id: "{{ ghapp_test_client_id_lookup }}"
    ghapp_client_app_slug: igou-dev
    ghapp_client_installations: "{{ ghapp_test_installations_lookup }}"
    ghapp_client_private_key_content: "{{ ghapp_test_private_key_lookup }}"
  roles:
    - role: david_igou.devhost.ghapp
- name: Configure the GitHub App broker
  hosts: ghapp-broker
  gather_facts: true
  become: true
  vars:
    ghapp_test_user: ghapp_test
    ghapp_test_policy:
      allowed_repos:
        - igou-io/igou-infrastructure
      max_permissions:
        contents: write
        pull_requests: write
        issues: write
      default_permissions:
        contents: read
  tasks:
    - name: Create the broker test user
      ansible.builtin.user:
        name: "{{ ghapp_test_user }}"
        shell: /bin/bash
        state: present
    - name: Install podman for the broker container smoke test
      ansible.builtin.package:
        name: podman
        state: present
    - name: Enable lingering for the rootless broker client
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ ghapp_test_user }}
      args:
        creates: /var/lib/systemd/linger/{{ ghapp_test_user }}
    - name: Deploy the ghapp GitHub App token broker
      ansible.builtin.include_role:
        name: david_igou.devhost.ghapp
      vars:
        ghapp_broker_enabled: true
        ghapp_broker_socket_group: "{{ ghapp_test_user }}"
        ghapp_broker_client_id: "{{ ghapp_test_client_id_lookup }}"
        ghapp_broker_app_slug: igou-dev
        ghapp_broker_installations: "{{ ghapp_test_installations_lookup }}"
        ghapp_broker_private_key_content: "{{ ghapp_test_private_key_lookup }}"
        ghapp_broker_policy: "{{ ghapp_test_policy }}"
