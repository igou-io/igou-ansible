---
- name: Verify lease renewal and notification routing
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    casval_cases:
      - name: Shorter renewal preserves the existing owner
        expiry: 87400
        duration: 7200
        replicas: 1
        owner: previous
        retained: true
      - name: Longer renewal acquires a fresh lease
        expiry: 8200
        duration: 86400
        replicas: 1
        owner: previous
        retained: false
      - name: Equal deadline preserves the existing timer
        expiry: 8200
        duration: 7200
        replicas: 1
        owner: previous
        retained: true
      - name: Expired lease can be replaced
        expiry: 900
        duration: 7200
        replicas: 1
        owner: previous
        retained: false
      - name: Powered-down node does not preserve stale lease metadata
        expiry: 87400
        duration: 7200
        replicas: 0
        owner: previous
        retained: false
      - name: Repeated dispatch by the same execution still starts its timer
        expiry: 87400
        duration: 7200
        replicas: 1
        owner: current
        retained: false
      - name: Manual unbounded scale-up remains supported
        expiry: 87400
        duration: 0
        replicas: 1
        owner: previous
        retained: false
  tasks:
    - name: Exercise the production renewal policy
      ansible.builtin.include_tasks: tasks/check_case.yml
      loop: "{{ casval_cases }}"
      loop_control:
        loop_var: casval_case
        label: "{{ casval_case.name }}"

    - name: Read the generated workflow
      ansible.builtin.set_fact:
        casval_workflow: "{{ lookup('ansible.builtin.file', '../../playbooks/openshift/casval-orchestrator-workflow.yml') | from_yaml }}"

    - name: Verify each selected duration includes its warning window
      ansible.builtin.assert:
        that:
          - item.parameters.duration | int + 600 == durations[item.id]
        fail_msg: "{{ item.id }} adds the warning window on top of the requested lease."
      vars:
        durations:
          hold_2h: 7200
          hold_4h: 14400
          hold_8h: 28800
          hold_12h: 43200
          hold_24h: 86400
          hold_fb: 14400
      loop: "{{ casval_workflow.nodes | selectattr('id', 'match', '^hold_') | list }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Verify notifications cannot gate the release timer
      ansible.builtin.assert:
        that:
          - casval_workflow.edges | selectattr('from', 'match', '^notify_') | list | length == 0
          - casval_workflow.edges | selectattr('from', 'equalto', 'grace') | map(attribute='to') | list == ['scale_down']
          - casval_workflow.edges | selectattr('to', 'equalto', 'notify_done') | map(attribute='from') | list == ['released']
          - casval_workflow.edges | selectattr('to', 'equalto', 'notify_warn') | map(attribute='from') | list == ['still_owner']
        fail_msg: Notification or ownership routing no longer protects the timer and suppresses superseded notices.
