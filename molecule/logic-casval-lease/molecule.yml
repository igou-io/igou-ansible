prerun: false
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=localhost,
  playbooks:
    converge: verify.yml
    verify: verify.yml
scenario:
  name: logic-casval-lease
  test_sequence:
    - syntax
    - converge
    - idempotence
    - verify
