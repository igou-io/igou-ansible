---
- name: Verify the maintained administrator can log in and elevate after reboot
  hosts: molecule
  gather_facts: false
  vars:
    ansible_user: igou
    ansible_become: false
  tasks:
    - name: Establish a fresh administrator connection
      ansible.builtin.meta: reset_connection
    - name: Execute with the installed package as the administrator
      ansible.builtin.command: curl --version  # noqa: command-instead-of-module -- execute the installed CLI, not fetch a URL
      changed_when: false
    - name: Exercise passwordless sudo
      ansible.builtin.command: sudo -n id -u
      register: molecule_sudo_identity
      changed_when: false
    - name: Create a user namespace without administrator privileges
      ansible.builtin.command:
        argv:
          - unshare
          - --user
          - --map-root-user
          - "true"
      changed_when: false
    - name: Require root elevation
      ansible.builtin.assert:
        that:
          - molecule_sudo_identity.stdout == '0'
    - name: Read the effective SSH access policy
      ansible.builtin.command: sudo -n sshd -T
      register: molecule_sshd_policy
      changed_when: false
    - name: Require hardened root and password access
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in molecule_sshd_policy.stdout_lines"
          - "'passwordauthentication no' in molecule_sshd_policy.stdout_lines"
    - name: Require node exporter host metrics after reboot
      ansible.builtin.include_tasks: ../shared/tasks/http_metrics.yml
      vars:
        molecule_metrics_endpoint: metrics
        molecule_metrics_required:
          - node_uname_info
          - node_cpu_seconds_total
          - node_memory_MemTotal_bytes
