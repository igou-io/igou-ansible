---
- name: Verify refusal of an unsafe deletion target
  block:
    - name: Attempt production cleanup of a rejected device
      ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/remove_tailnet.yml
      vars:
        codex_desktop_cleanup_device_id: "{{ codex_desktop_rejected_id }}"
    - name: Fail if an unsafe target was accepted
      ansible.builtin.fail:
        msg: Cleanup unexpectedly accepted an unsafe device.
  rescue:
    - name: Require rejection at an identity guard
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name == 'Require an exact Tailscale device identifier'
            or ansible_failed_task.name == 'Require the expected desktop identity and tag before deletion'
        fail_msg: Cleanup failed outside its intended identity guard.
