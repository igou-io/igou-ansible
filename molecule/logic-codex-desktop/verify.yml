---
- name: Verify desktop provisioning decisions without a cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    codex_desktop_image_arch: x86_64
    codex_desktop_release_metadata:
      - version: '101 Beta'
        variant: Cloud
        subvariant: Cloud_Base
        arch: x86_64
        link: https://download.fedoraproject.org/pub/fedora/linux/releases/101/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-101-1.1.x86_64.qcow2
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - version: '99'
        variant: Cloud
        subvariant: Cloud_Base
        arch: x86_64
        link: https://download.fedoraproject.org/pub/fedora/linux/releases/99/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-99-1.1.x86_64.qcow2
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - version: '100'
        variant: Cloud
        subvariant: Cloud_Base
        arch: x86_64
        link: https://download.fedoraproject.org/pub/fedora/linux/releases/100/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-100-1.2.x86_64.qcow2
        sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - version: '101'
        variant: Cloud
        subvariant: Cloud_Base
        arch: aarch64
        link: https://download.fedoraproject.org/pub/fedora/linux/releases/101/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-101-1.1.aarch64.qcow2
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - version: '101'
        variant: Cloud
        subvariant: Cloud_Base
        arch: x86_64
        link: https://download.fedoraproject.org/pub/fedora/linux/releases/101/Cloud/x86_64/images/Fedora-Cloud-Base-UEFI-UKI-101-1.1.x86_64.qcow2
        sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  tasks:
    - name: Run the production image selector
      ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/select_image.yml
    - name: Require numeric latest-release selection and the matching checksum document
      ansible.builtin.assert:
        that:
          - codex_desktop_image_release == '100'
          - codex_desktop_image_filename == 'Fedora-Cloud-Base-Generic-100-1.2.x86_64.qcow2'
          - codex_desktop_checksum_filename == 'Fedora-Cloud-100-1.2-x86_64-CHECKSUM'
          - codex_desktop_image.sha256 == 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
    - name: Verify metadata without a stable image fails closed
      block:
        - name: Select from only preview releases
          ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/select_image.yml
          vars:
            codex_desktop_release_metadata:
              - version: '101 Beta'
                variant: Cloud
                subvariant: Cloud_Base
                arch: x86_64
                link: https://download.fedoraproject.org/pub/fedora/linux/releases/101/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-101-1.1.x86_64.qcow2
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      rescue:
        - name: Remember rejection of preview-only metadata
          ansible.builtin.set_fact:
            codex_desktop_preview_rejected: true
    - name: Require preview-only metadata to be rejected
      ansible.builtin.assert:
        that: codex_desktop_preview_rejected | default(false)
    - name: Verify an occupied casval node cannot be released
      block:
        - name: Run the production VMI release guard
          ansible.builtin.include_tasks: ../../playbooks/openshift/tasks/casval_vmi_guard.yml
          vars:
            casval_nodes_before:
              resources:
                - metadata:
                    name: casval.igou.systems
            casval_virtualmachine_instances:
              resources:
                - metadata:
                    name: codex-desktop
                  status:
                    nodeName: casval.igou.systems
      rescue:
        - name: Remember the blocked capacity release
          ansible.builtin.set_fact:
            codex_desktop_busy_casval_rejected: true
    - name: Require an occupied casval node to be protected
      ansible.builtin.assert:
        that: codex_desktop_busy_casval_rejected | default(false)
    - name: Allow casval release when all VM instances are elsewhere
      ansible.builtin.include_tasks: ../../playbooks/openshift/tasks/casval_vmi_guard.yml
      vars:
        casval_nodes_before:
          resources:
            - metadata:
                name: casval.igou.systems
        casval_virtualmachine_instances:
          resources:
            - status:
                nodeName: p330.igou.systems
    - name: Preserve a longer active capacity reservation when the desktop reuses it
      vars:
        casval_now_epoch: 1000
        casval_expiry_before: 10000
        casval_lease_seconds: 3600
        casval_replicas_before: 1
        casval_lease_owner_before: existing-owner
        casval_lease_owner: existing-owner
      block:
        - name: Evaluate the desktop's capacity reuse policy
          ansible.builtin.include_tasks: ../../playbooks/openshift/tasks/casval_lease_decision.yml
          vars:
            casval_preserve_active_lease: true
        - name: Require preservation of the longer reused reservation
          ansible.builtin.assert:
            that: casval_retain_lease
        - name: Evaluate the existing direct renewal policy
          ansible.builtin.include_tasks: ../../playbooks/openshift/tasks/casval_lease_decision.yml
        - name: Require explicit direct same-owner renewals to retain their behavior
          ansible.builtin.assert:
            that: not casval_retain_lease
