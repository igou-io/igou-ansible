---
- name: Verify ephemeral enrollment and restart recovery without live credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    codex_desktop_name: codex-desktop
    codex_desktop_tailscale_credentials:
      client_id_lookup: molecule-client
      client_secret_lookup: molecule-dummy
    codex_desktop_test_fresh_client:
      BackendState: NeedsLogin
      Self: null
      joins: 0
      serves: 0
    fedora_desktop_tailscale_key_dir: "{{ codex_desktop_test_dir.path }}"
  tasks:
    - name: Allocate isolated fixture state
      ansible.builtin.tempfile:
        state: directory
        prefix: codex-desktop-tailnet-test-
      register: codex_desktop_test_dir

    - name: Exercise production enrollment against isolated fixtures
      block:
        - name: Start the local tailnet API fixture
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/mock_tailnet.py"
              - --port-file
              - "{{ codex_desktop_test_dir.path }}/port"
          async: 300
          poll: 0
          changed_when: false
          register: codex_desktop_test_server
        - name: Wait for fixture startup
          ansible.builtin.wait_for:
            path: "{{ codex_desktop_test_dir.path }}/port"
            timeout: 15
        - name: Read the dynamically allocated fixture port
          ansible.builtin.slurp:
            src: "{{ codex_desktop_test_dir.path }}/port"
          register: codex_desktop_test_port
        - name: Select the isolated API endpoint
          ansible.builtin.set_fact:
            codex_desktop_test_url: "http://127.0.0.1:{{ codex_desktop_test_port.content | b64decode }}"
            codex_desktop_tailscale_api_url: "http://127.0.0.1:{{ codex_desktop_test_port.content | b64decode }}/api/v2"
            fedora_desktop_t3_port: "{{ codex_desktop_test_port.content | b64decode | int }}"
        - name: Install the isolated client fixture
          ansible.builtin.copy:
            src: tailscale
            dest: "{{ codex_desktop_test_dir.path }}/tailscale"
            mode: '0755'
        - name: Model a newly started in-memory daemon
          ansible.builtin.copy:
            content: "{{ codex_desktop_test_fresh_client | to_json }}"
            dest: "{{ codex_desktop_test_dir.path }}/client-state"
            mode: '0600'

        - name: Exercise enrollment and Serve through production tasks
          environment:
            PATH: "{{ codex_desktop_test_dir.path }}:{{ lookup('env', 'PATH') }}"
            MOLECULE_TAILNET_STATE: "{{ codex_desktop_test_dir.path }}/client-state"
          block:
            - name: Enroll a fresh ephemeral daemon and expose T3
              ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
            - name: Read the resulting client and Serve state
              ansible.builtin.command: tailscale status --json
              changed_when: false
              register: codex_desktop_test_client_status
            - name: Require enrollment and the hostname-based T3 endpoint
              ansible.builtin.assert:
                that:
                  - (codex_desktop_test_client_status.stdout | from_json).Self.ID == 'nEphemeral1'
                  - (codex_desktop_test_client_status.stdout | from_json).joins == 1
                  - (codex_desktop_test_client_status.stdout | from_json).serves == 1
                  - "('127.0.0.1:' ~ fedora_desktop_t3_port) in codex_desktop_test_client_status.stdout"
                  - (codex_desktop_test_client_status.stdout | from_json).Self.DNSName == 'codex-desktop.fixture.ts.net.'
            - name: Repeat setup without replacing a healthy enrollment
              ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
            - name: Inspect API issuance after the healthy rerun
              ansible.builtin.uri:
                url: "{{ codex_desktop_test_url }}/audit"
              register: codex_desktop_test_audit
            - name: Require no extra credential issuance on a healthy rerun
              ansible.builtin.assert:
                that:
                  - codex_desktop_test_audit.json.join_keys == 1
                  - codex_desktop_test_audit.json.oauth_tokens == 1

            - name: Model an explicitly disconnected enrolled client
              ansible.builtin.copy:
                content: "{{ (codex_desktop_test_client_status.stdout | from_json) | combine({'BackendState': 'Stopped'}) | to_json }}"
                dest: "{{ codex_desktop_test_dir.path }}/client-state"
                mode: '0600'
            - name: Resume the existing daemon without a fresh join key
              ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
            - name: Inspect the resumed device
              ansible.builtin.command: tailscale status --json
              changed_when: false
              register: codex_desktop_test_client_status
            - name: Require the existing identity and one resume
              ansible.builtin.assert:
                that:
                  - (codex_desktop_test_client_status.stdout | from_json).Self.ID == 'nEphemeral1'
                  - (codex_desktop_test_client_status.stdout | from_json).resumes == 1
                  - (codex_desktop_test_client_status.stdout | from_json).serves == 1

            - name: Discard daemon memory to model a VM restart
              ansible.builtin.copy:
                content: "{{ codex_desktop_test_fresh_client | to_json }}"
                dest: "{{ codex_desktop_test_dir.path }}/client-state"
                mode: '0600'
            - name: Enroll the restarted daemon and restore Serve
              ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
            - name: Inspect the new enrollment
              ansible.builtin.command: tailscale status --json
              changed_when: false
              register: codex_desktop_test_client_status
            - name: Require a new device with the same requested DNS endpoint
              ansible.builtin.assert:
                that:
                  - (codex_desktop_test_client_status.stdout | from_json).Self.ID == 'nEphemeral2'
                  - (codex_desktop_test_client_status.stdout | from_json).Self.DNSName == 'codex-desktop.fixture.ts.net.'
                  - (codex_desktop_test_client_status.stdout | from_json).serves == 1

            - name: Model a conflicting desktop DNS name
              ansible.builtin.copy:
                content: >-
                  {{ (codex_desktop_test_client_status.stdout | from_json)
                     | combine({'Self': {'ID': 'nCollision', 'HostName': 'codex-desktop',
                         'DNSName': 'codex-desktop-1.fixture.ts.net.', 'Tags': ['tag:codex']}})
                     | to_json }}
                dest: "{{ codex_desktop_test_dir.path }}/client-state"
                mode: '0600'
            - name: Reject a suffixed hostname before publishing the desktop endpoint
              block:
                - name: Attempt setup with an occupied DNS name
                  ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
                - name: Fail if a conflicting DNS name was accepted
                  ansible.builtin.fail:
                    msg: Enrollment unexpectedly accepted the wrong desktop DNS endpoint.
              rescue:
                - name: Require rejection at the hostname guard
                  ansible.builtin.assert:
                    that:
                      - ansible_failed_task.name == 'Require the requested hostname before exposing the desktop'

            - name: Model a fresh daemon for authentication failure
              ansible.builtin.copy:
                content: "{{ codex_desktop_test_fresh_client | to_json }}"
                dest: "{{ codex_desktop_test_dir.path }}/client-state"
                mode: '0600'
            - name: Propagate a denied enrollment scope
              block:
                - name: Attempt enrollment with an unauthorized OAuth client
                  ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
                  vars:
                    codex_desktop_tailscale_credentials:
                      client_id_lookup: unauthorized-client
                      client_secret_lookup: molecule-dummy
                - name: Fail if denied authentication succeeded
                  ansible.builtin.fail:
                    msg: Enrollment unexpectedly accepted an unauthorized OAuth client.
              rescue:
                - name: Require failure at OAuth authentication
                  ansible.builtin.assert:
                    that:
                      - ansible_failed_task.name == 'Mint an OAuth access token on the controller'

            - name: Model a CLI join failure
              ansible.builtin.copy:
                content: "{{ codex_desktop_test_fresh_client | combine({'fail_join': true}) | to_json }}"
                dest: "{{ codex_desktop_test_dir.path }}/client-state"
                mode: '0600'
            - name: Require CLI failures to propagate while cleaning the join key
              block:
                - name: Attempt enrollment during a client failure
                  ansible.builtin.include_tasks: ../../playbooks/codex_desktop/tasks/tailnet.yml
                - name: Fail if an unsuccessful join was accepted
                  ansible.builtin.fail:
                    msg: Enrollment unexpectedly succeeded during a CLI failure.
              rescue:
                - name: Require failure at the guest join command
                  ansible.builtin.assert:
                    that:
                      - ansible_failed_task.name == 'Fedora desktop | Join the tailnet'
            - name: Find credentials left by successful or failed joins
              ansible.builtin.find:
                paths: "{{ codex_desktop_test_dir.path }}"
                patterns: codex-desktop-tailnet-*
              register: codex_desktop_test_leftover_keys
            - name: Require all temporary join keys to have been removed
              ansible.builtin.assert:
                that:
                  - codex_desktop_test_leftover_keys.matched == 0
            - name: Inspect the complete enrollment API audit
              ansible.builtin.uri:
                url: "{{ codex_desktop_test_url }}/audit"
              register: codex_desktop_test_audit
            - name: Require only enrollment API access and single-use ephemeral keys
              ansible.builtin.assert:
                that:
                  - codex_desktop_test_audit.json.join_keys == 3
                  - codex_desktop_test_audit.json.oauth_tokens == 3
                  - codex_desktop_test_audit.json.requests | unique | length == 2
                  - "'/api/v2/oauth/token' in codex_desktop_test_audit.json.requests"
                  - "'/api/v2/tailnet/-/keys' in codex_desktop_test_audit.json.requests"
      always:
        - name: Shut down the API fixture
          ansible.builtin.uri:
            url: "{{ codex_desktop_test_url }}/shutdown"
            method: POST
          when: codex_desktop_test_url is defined
        - name: Remove the completed asynchronous fixture record
          ansible.builtin.async_status:
            jid: "{{ codex_desktop_test_server.ansible_job_id }}"
            mode: cleanup
          when: codex_desktop_test_server.ansible_job_id is defined
        - name: Remove isolated test state
          ansible.builtin.file:
            path: "{{ codex_desktop_test_dir.path }}"
            state: absent
