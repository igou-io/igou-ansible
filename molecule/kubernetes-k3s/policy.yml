---
- name: Exercise k3s upgrade policy without infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Accept unchanged releases, patches, build revisions, and adjacent minors
      ansible.builtin.include_tasks: _policy-accepted.yml
      loop:
        - current: v1.36.5+k3s1
          target: v1.36.5+k3s1
        - current: v1.36.5+k3s1
          target: v1.36.6+k3s1
        - current: v1.36.5+k3s1
          target: v1.36.5+k3s2
        - current: v1.36.5+k3s1
          target: v1.37.2+k3s1
      loop_control:
        loop_var: policy_case

    - name: Reject downgrades, skipped minors, major jumps, and unpinned releases
      ansible.builtin.include_tasks: _policy-rejected.yml
      loop:
        - current: v1.36.5+k3s1
          target: v1.36.4+k3s1
        - current: v1.36.5+k3s2
          target: v1.36.5+k3s1
        - current: v1.36.5+k3s1
          target: v1.38.0+k3s1
        - current: v1.36.5+k3s1
          target: v2.36.5+k3s1
        - current: v1.36.5+k3s1
          target: stable
      loop_control:
        loop_var: policy_case
