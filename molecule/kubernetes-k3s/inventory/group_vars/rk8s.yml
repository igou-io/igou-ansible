---
cluster_name: molecule-k3s
k3s_publish_kubeconfig: false
k3s_become: true
k3s_become_for_all: true
k3s_release_version: v1.36.5+k3s1
k3s_upgrade_delete_emptydir_data: true
k3s_server:
  node-name: "{{ inventory_hostname }}"
  cluster-cidr: 10.72.0.0/16
  service-cidr: 10.73.0.0/16
  write-kubeconfig-mode: "600"
  disable:
    - traefik
    - servicelb
k3s_agent:
  node-name: "{{ inventory_hostname }}"
