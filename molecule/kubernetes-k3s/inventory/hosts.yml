---
all:
  children:
    molecule:
      children:
        rk8s:
          children:
            rk8s_control_plane:
              hosts:
                k3s-control:
                  k3s_control_node: true
                  mp:
                    kubevirt: "{{ molecule_guest_profiles.debian | combine(k3s_test_control_overrides) }}"
            rk8s_workers:
              hosts:
                k3s-worker:
                  k3s_control_node: false
                  mp:
                    kubevirt: "{{ molecule_guest_profiles.debian }}"
