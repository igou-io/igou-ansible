---
all:
  children:
    molecule:
      hosts:
        windc01:
          mp:
            kubevirt:
              boot_source:
                type: data_volume_pvc
                source:
                  name: win2k25
                  namespace: openshift-virtualization-os-images
                size: 50Gi
              preference: windows.2k25
              admin_user: Administrator
              sysprep_secret: "{{ inventory_hostname }}-sysprep-{{ molecule_consumer_run_id }}"
              namespace: molecule
        winmem01:
          mp:
            kubevirt:
              boot_source:
                type: data_volume_pvc
                source:
                  name: win2k25
                  namespace: openshift-virtualization-os-images
                size: 50Gi
              instancetype: u1.medium
              preference: windows.2k25
              admin_user: Administrator
              sysprep_secret: "{{ inventory_hostname }}-sysprep-{{ molecule_consumer_run_id }}"
              namespace: molecule
    windows:
      hosts:
        winmem01: {}
    windows_guests:
      hosts:
        windc01: {}
        winmem01: {}
