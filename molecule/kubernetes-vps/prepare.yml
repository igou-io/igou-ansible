---
- name: Prepare the shared disposable guest
  ansible.builtin.import_playbook: ../shared/prepare.yml
- name: Seed an enabled legacy host exporter unit for the migration check
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Create a harmless legacy service fixture
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Legacy node-exporter lifecycle fixture
          [Service]
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Start and enable the legacy service fixture
      ansible.builtin.systemd_service:
        name: node_exporter.service
        daemon_reload: true
        state: started
        enabled: true
