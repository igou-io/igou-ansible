---
cluster_name: vps
vps_manage_tailscale: false
vps_tailscale_authkey_lookup: ""
vps_public_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
k3s_control_node: true
k3s_become: true
k3s_become_for_all: true
k3s_build_cluster: false
k3s_etcd_datastore: false
k3s_release_version: v1.36.5+k3s1
k3s_service_requires:
  - vps-guard.service
k3s_service_after:
  - vps-guard.service
k3s_server:
  node-name: vps-bootstrap-test
  write-kubeconfig-mode: "600"
  secrets-encryption: true
  disable:
    - traefik
    - servicelb
    - metrics-server
  kubelet-arg:
    - fail-swap-on=false
vps_test_manifest_directory: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/../igou-kubernetes/clusters/vps"
vps_bootstrap_manifest_lookup: "{{ lookup('kubernetes.core.kustomize', dir=vps_test_manifest_directory ~ '/seed') }}"
