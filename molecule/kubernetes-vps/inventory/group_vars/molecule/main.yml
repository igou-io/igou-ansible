---
cluster_name: vps
vps_manage_tailscale: false
vps_tailscale_authkey_lookup: ""
vps_public_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
node_exporter_listen_address: 127.0.0.1:9100
k3s_control_node: true
k3s_become: true
k3s_become_for_all: true
k3s_build_cluster: false
k3s_etcd_datastore: false
k3s_release_version: v1.36.5+k3s1
k3s_service_requires:
  - vps-guard.service
k3s_service_after:
  - vps-guard.service
k3s_server:
  node-name: vps-bootstrap-test
  write-kubeconfig-mode: "600"
  secrets-encryption: true
  disable:
    - traefik
    - servicelb
    - metrics-server
  kubelet-arg:
    - fail-swap-on=false
