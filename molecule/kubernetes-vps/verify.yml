---
- name: Verify the installed VPS Kubernetes API
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Inspect the native administrator kubeconfig
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: vps_kubeconfig
    - name: Collect service facts
      ansible.builtin.service_facts:
    - name: Require a running k3s service and its kubeconfig
      ansible.builtin.assert:
        that:
          - vps_kubeconfig.stat.isreg | default(false)
          - ansible_facts.services['k3s.service'].state == 'running'
    - name: Request API readiness with the native administrator kubeconfig
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - get
          - --raw=/readyz
      register: vps_api_ready
      changed_when: false
      retries: 20
      delay: 5
      until: vps_api_ready.rc == 0 and vps_api_ready.stdout | trim == 'ok'
    - name: Read Kubernetes node status
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - get
          - nodes
          - -o
          - json
      register: vps_nodes
      changed_when: false
    - name: Require the VPS node to be Ready
      ansible.builtin.assert:
        that:
          - (vps_nodes.stdout | from_json)['items'] | length == 1
          - >-
            (vps_nodes.stdout | from_json)['items'][0].status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length == 1
