---
- name: Verify the configured desktop after reboot
  hosts: codex_desktop_guest
  become: true
  gather_facts: false
  tasks:
    - name: Require the desktop and guest agent services
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - gdm.service
        - qemu-guest-agent.service
      changed_when: false
    - name: Require the desktop user's GNOME session
      ansible.builtin.command: pgrep -u 1100 -x gnome-shell
      register: molecule_codex_gnome
      changed_when: false
      retries: 12
      delay: 10
      until: molecule_codex_gnome.rc == 0
    - name: Require the desktop app in that session
      ansible.builtin.command: pgrep -u 1100 -x ChatGPT
      register: molecule_codex_app
      changed_when: false
      retries: 12
      delay: 10
      until: molecule_codex_app.rc == 0
    - name: Require the T3 endpoint to respond
      ansible.builtin.uri:
        url: http://127.0.0.1:3773
        status_code: 200
      register: molecule_codex_t3_http
      retries: 12
      delay: 5
      until: molecule_codex_t3_http.status == 200
    - name: Run the installed Codex CLI
      ansible.builtin.command: /usr/local/bin/codex --version
      register: molecule_codex_cli
      changed_when: false
    - name: Run the installed T3 CLI
      ansible.builtin.command: /usr/local/bin/t3 --version
      register: molecule_codex_t3_cli
      changed_when: false
    - name: Require working CLI versions
      ansible.builtin.assert:
        that:
          - molecule_codex_cli.stdout is match('^codex-cli ')
          - molecule_codex_t3_cli.stdout is match('^t3 v')
    - name: Require retained workspace state after the reboot
      ansible.builtin.command:
        argv:
          - cat
          - /home/codex/workspaces/molecule-state.txt
      register: molecule_codex_state
      changed_when: false
    - name: Require the saved marker
      ansible.builtin.assert:
        that:
          - molecule_codex_state.stdout == 'desktop state survived reboot'
    - name: Require the workspace to use the retained state mount
      ansible.builtin.command: findmnt -n -o TARGET -T /home/codex/workspaces
      register: molecule_codex_mount
      changed_when: false
    - name: Require the retained home bind mount
      ansible.builtin.assert:
        that:
          - molecule_codex_mount.stdout == '/home/codex'
    - name: Scrape the host metrics endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: molecule_codex_metrics
    - name: Require guest OS metrics
      ansible.builtin.assert:
        that:
          - "'node_uname_info' in molecule_codex_metrics.content"
    - name: Require SELinux enforcement
      ansible.builtin.command: getenforce
      register: molecule_codex_selinux
      changed_when: false
    - name: Require the enforced security policy
      ansible.builtin.assert:
        that:
          - molecule_codex_selinux.stdout == 'Enforcing'
