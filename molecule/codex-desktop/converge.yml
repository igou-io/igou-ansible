---
- name: Provide the operation context normally prepared by the desktop orchestrator
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Mark this disposable operation as externally owned
      ansible.builtin.set_fact:
        codex_desktop_operation_id: molecule
        codex_desktop_operation_owned: false
- name: Configure the guest through the production playbook
  ansible.builtin.import_playbook: ../../playbooks/codex_desktop/configure.yaml
