---
- name: Seed retained workspace data before replacing the OS
  hosts: molecule
  become: true
  become_user: codex
  gather_facts: false
  tasks:
    - name: Write a non-secret retained workspace marker
      ansible.builtin.copy:
        content: retained-across-root-replacement
        dest: /home/codex/workspaces/retention.txt
        mode: '0600'

- name: Seed protected tailnet storage without enrolling a real device
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Write a non-secret marker through the live Tailscale state mount
      ansible.builtin.copy:
        content: protected-state-retained
        dest: /var/lib/tailscale/retention.txt
        mode: '0600'

- name: Shut down cleanly before the provisioner removes the disposable OS
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    # Match the production graceful-stop path; killing QEMU loses guest writeback.
    - name: Flush guest filesystems through a normal shutdown
      community.general.shutdown:
    - name: Wait for the disposable VM's SSH forward to close
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port }}"
        state: stopped
        timeout: 120
      delegate_to: localhost
      become: false

- name: Destroy the disposable OS while keeping the separate state disk
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.destroy

- name: Recreate the guest from current upstream feedstock
  ansible.builtin.import_playbook: create.yml

- name: Prepare the replacement OS
  ansible.builtin.import_playbook: prepare.yml

- name: Configure the replacement OS around retained state
  ansible.builtin.import_playbook: converge.yml

- name: Record that the OS replacement completed
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Mark the following verification as a state retention check
      ansible.builtin.copy:
        content: rebuilt
        dest: "{{ molecule_ephemeral_directory }}/root-rebuilt"
        mode: '0600'
