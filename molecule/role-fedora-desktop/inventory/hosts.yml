---
all:
  children:
    molecule:
      hosts:
        fedora-desktop-test:
          mp:
            qemu:
              # create.yml resolves concrete values before the provisioner runs.
              image: resolved-by-create
              ssh_user: igou
              cpus: 4
              memory: 8192
              disk_size: 50G
              extra_args:
                - -drive
                - "file={{ molecule_ephemeral_directory }}/codex-state.qcow2,if=none,format=qcow2,id=codex-state"
                - -device
                - virtio-blk-pci,drive=codex-state,serial=codex-state
                - -chardev
                - "socket,path={{ molecule_ephemeral_directory }}/qga.sock,server=on,wait=off,id=qga0"
                - -device
                - virtio-serial
                - -device
                - virtserialport,chardev=qga0,name=org.qemu.guest_agent.0
