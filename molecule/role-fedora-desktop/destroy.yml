---
- name: Destroy the disposable VM through the KubeVirt provisioner
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.destroy

- name: Verify the scenario's cluster resources were removed
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Wait for each test resource to disappear
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: molecule
      loop:
        - api_version: kubevirt.io/v1
          kind: VirtualMachine
          name: fedora-desktop-test
        - api_version: kubevirt.io/v1
          kind: VirtualMachineInstance
          name: fedora-desktop-test
        - api_version: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          name: fedora-desktop-test-boot
        - api_version: v1
          kind: PersistentVolumeClaim
          name: fedora-desktop-test-boot
        - api_version: v1
          kind: Service
          name: fedora-desktop-test
      register: codex_desktop_test_removed
      until: codex_desktop_test_removed.resources | length == 0
      retries: 60
      delay: 2
