---
- name: Verify a usable desktop and retained workspace
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Request the real T3 endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:3773
        status_code: 200
    - name: Read installed desktop packages
      ansible.builtin.package_facts:
        manager: auto
    - name: Require the installed desktop RPM
      ansible.builtin.assert:
        that: "'chatgpt' in ansible_facts['packages']"
    - name: Require actual node exporter metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
        return_content: true
      register: codex_desktop_test_metrics
    - name: Require guest OS metrics
      ansible.builtin.assert:
        that: "'node_uname_info' in codex_desktop_test_metrics.content"
    - name: Run the installed Codex CLI
      ansible.builtin.command: /usr/local/bin/codex --version
      register: codex_desktop_test_cli
      changed_when: false
    - name: Require the expected Codex CLI
      ansible.builtin.assert:
        that: "'0.160.1' in codex_desktop_test_cli.stdout"
    - name: Require a running GNOME session for the unprivileged desktop user
      ansible.builtin.command: pgrep -u 1100 -x gnome-shell
      changed_when: false
      retries: 12
      delay: 10
      register: codex_desktop_test_gnome
      until: codex_desktop_test_gnome.rc == 0
    - name: Require the desktop app to autostart in the user session
      ansible.builtin.command: pgrep -u 1100 -x ChatGPT
      changed_when: false
      retries: 12
      delay: 10
      register: codex_desktop_test_app
      until: codex_desktop_test_app.rc == 0
    - name: Resolve the desktop user's HTTPS browser
      ansible.builtin.command: xdg-mime query default x-scheme-handler/https
      become: true
      become_user: codex
      changed_when: false
      register: codex_desktop_test_browser
    - name: Require Firefox to handle desktop links
      ansible.builtin.assert:
        that: codex_desktop_test_browser.stdout == 'org.mozilla.firefox.desktop'
    - name: Require a functioning guest agent
      # Read health without starting or repairing the service during verification.
      ansible.builtin.command: systemctl is-active qemu-guest-agent # noqa command-instead-of-module
      changed_when: false
    - name: Read SELinux enforcement
      ansible.builtin.command: getenforce
      changed_when: false
      register: codex_desktop_test_selinux
    - name: Require SELinux to remain enforced
      ansible.builtin.assert:
        that: codex_desktop_test_selinux.stdout == 'Enforcing'
    - name: Read the workspace retained through OS replacement
      ansible.builtin.command: cat /home/codex/workspaces/retention.txt
      become: true
      become_user: codex
      changed_when: false
      register: codex_desktop_test_retention
      when: (lookup('ansible.builtin.file', molecule_ephemeral_directory ~ '/root-rebuilt', errors='ignore') | default('', true)) == 'rebuilt'
    - name: Require retained workspace contents to survive a fresh OS
      ansible.builtin.assert:
        that: codex_desktop_test_retention.stdout == 'retained-across-root-replacement'
      when: codex_desktop_test_retention.stdout is defined
    - name: Verify the daemon ignores persistent identity storage
      block:
        - name: Put deliberately invalid state at the vendor's default disk path
          ansible.builtin.copy:
            content: invalid-persistent-state-must-not-be-loaded
            dest: /var/lib/tailscale/tailscaled.state
            mode: '0600'
        - name: Restart the real Tailscale daemon without a join key
          ansible.builtin.systemd_service:
            name: tailscaled
            state: restarted
        - name: Read the real daemon's fresh login state
          ansible.builtin.command: tailscale status --json
          changed_when: false
          register: codex_desktop_test_tailnet
          failed_when: codex_desktop_test_tailnet.rc not in [0, 1]
          retries: 15
          delay: 2
          until: >-
            (codex_desktop_test_tailnet.stdout | from_json).BackendState == 'NeedsLogin'
        - name: Require disposable enrollment despite invalid disk state
          ansible.builtin.assert:
            that:
              - "not ((codex_desktop_test_tailnet.stdout | from_json).Self | default({}, true)).get('ID', '')"
      always:
        - name: Remove the invalid fixture state
          ansible.builtin.file:
            path: /var/lib/tailscale/tailscaled.state
            state: absent
