---
- name: Load fixture TLS inputs for the runtime playbook
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Read the disposable certificate
      ansible.builtin.slurp:
        src: /home/containers/molecule-tls.pem
      register: molecule_tls_cert
      no_log: true
    - name: Read the disposable key
      ansible.builtin.slurp:
        src: /home/containers/molecule-tls.key
      register: molecule_tls_key
      no_log: true
    - name: Read the disposable proxy password verifier
      ansible.builtin.slurp:
        src: /home/containers/molecule-auth.htpasswd
      register: molecule_proxy_auth
      no_log: true
    - name: Pass fixture material as declared podman secrets
      ansible.builtin.set_fact:
        linux_podman_secrets:
          - name: igou-tls-fullchain
            data: "{{ molecule_tls_cert.content | b64decode }}"
          - name: igou-tls-key
            data: "{{ molecule_tls_key.content | b64decode }}"
          - name: molecule-proxy-auth
            data: "{{ molecule_proxy_auth.content | b64decode }}"
      no_log: true
