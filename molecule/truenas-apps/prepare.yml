---
- name: Wait for the KubeVirt guest
  ansible.builtin.import_playbook: ../shared/prepare.yml
- name: Prepare the mock TrueNAS host
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Create the mock pool mountpoint
      ansible.builtin.file:
        path: /mnt/tank
        state: directory
        mode: '0755'
    - name: Install the midclt stub
      ansible.builtin.copy:
        src: files/midclt.py
        dest: /usr/bin/midclt
        mode: '0755'
    - name: Start from a clean stub state
      ansible.builtin.file:
        path: /var/lib/molecule-midclt
        state: absent
