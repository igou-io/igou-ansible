---
all:
  children:
    molecule:
      children:
        rk8s:
          children:
            rk8s_control_plane:
              hosts:
                kubeadm-control:
                  kubernetes_role: control_plane
                  mp:
                    kubevirt: "{{ molecule_guest_profiles.debian | combine(dict(boot_source=kubeadm_test_boot_source)) | combine(kubeadm_test_control_overrides) }}"
            rk8s_workers:
              hosts:
                kubeadm-worker:
                  kubernetes_role: node
                  mp:
                    kubevirt: "{{ molecule_guest_profiles.debian | combine(dict(boot_source=kubeadm_test_boot_source)) }}"
