---
# Four guests on the run's private Layer2 network: a RouterOS CHR
# (DHCP, TFTP, NAT) standing in for rb5009, a Debian server standing in for
# the NAS (NFS rootfs, HTTP staging) and two BIOS "boards". The boards'
# logical hosts are separate from their VMs: the controller reaches them only
# through the router's port forwards, which the provisioner cannot express
# as a VM's own connection. Each VM repeats its board's MAC and IP: the
# provisioner reads mp through hostvars, where hostvars is not defined.
all:
  children:
    molecule:
      hosts:
        router:
          mp:
            kubevirt: "{{ armbian_test_router_vm }}"
        server:
          mp:
            kubevirt: "{{ armbian_test_server_vm }}"
        board-a-vm:
          armbian_test_mac: "52:54:00:aa:00:21"
          armbian_test_ip: 192.0.2.21
          mp:
            kubevirt: "{{ armbian_test_board_vm }}"
        board-b-vm:
          armbian_test_mac: "52:54:00:aa:00:22"
          armbian_test_ip: 192.0.2.22
          mp:
            kubevirt: "{{ armbian_test_control_plane_vm }}"
    routeros:
      hosts:
        router:
    netboot_server:
      hosts:
        server:
    boards:
      children:
        x86_family:
          children:
            x86_kubevirt:
              hosts:
                board-a:
                  armbian_board_mac: "52:54:00:aa:00:21"
                  armbian_test_ip: 192.0.2.21
                  armbian_test_vm: board-a-vm
                  armbian_test_forward: board-a
                  k3s_control_node: false
                # Stands in for cm3588-nas-01 (igou-inventory inventory.yaml):
                # the control plane, rebooted over SSH, with the k3s
                # datastore on a ZFS pool of striped mirrors.
                board-b:
                  # Upper case, as most production boards are written.
                  armbian_board_mac: "52:54:00:AA:00:22"
                  armbian_test_ip: 192.0.2.22
                  armbian_test_vm: board-b-vm
                  armbian_test_forward: board-b
                  armbian_power_cycle_tasks: transport/power_cycle_warm_reboot.yml
                  k3s_control_node: true
                  k3s_service_requires:
                    - var-lib-rancher-k3s.mount
                  k3s_service_after:
                    - var-lib-rancher-k3s.mount
                  zfs_pool_name: rk8s
                  zfs_pool_vdev_type: mirror
                  zfs_pool_vdev_width: 2
                  zfs_pool_devices:
                    - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-ua-pool-a
                    - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-ua-pool-b
                    - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-ua-pool-c
                    - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-ua-pool-d
                  zfs_pool_properties:
                    ashift: "12"
                    autotrim: "on"
                  zfs_pool_root_properties:
                    compression: lz4
                    atime: "off"
                    relatime: "on"
                    xattr: sa
                    acltype: posixacl
                    dnodesize: auto
                    canmount: "off"
                    mountpoint: none
                  zfs_pool_datasets:
                    - name: rk8s/k3s
                      properties:
                        mountpoint: legacy
                      mount:
                        where: /var/lib/rancher/k3s
                        before:
                          - k3s.service
                    - name: rk8s/k3s/server-db
                      properties:
                        mountpoint: legacy
                        recordsize: 16K
                        logbias: throughput
                      mount:
                        where: /var/lib/rancher/k3s/server/db
                  # An eighth of the memory, as in production.
                  zfs_pool_arc_max_bytes: 536870912
    # Production's cluster groups.
    rk8s:
      children:
        rk8s_control_plane:
          hosts:
            board-b:
        rk8s_workers:
          hosts:
            board-a:
