---
# A KubeVirt BIOS guest: no device tree; its local disk is the fourth virtio
# disk (provisioner boot disk, cloud-init, carrier, local).
board_config_model:
  armbian_board_name: uefi-x86
  local_kernel:
    # Partition 1: the real boards' U-Boot loads the kernel from partition 1.
    verify_match: ^/dev/vdd1$
