---
# Power-cycle hook for boards without switchable power
# (armbian_power_cycle_tasks): reboot the running OS over SSH as the
# inventory user, then wait for sshd to go away so board_boot_wait only
# sees the board once it is back. ansible.builtin.reboot is not used: it
# waits to log in again, and after a reimage the rebooted image may not
# have the automation user yet. The board must be up and reachable.

# Only when the board boots this root again. In nfs and sd mode it boots
# another root, and a reimage (nfs) is how a board with a broken module gets
# fixed.
- name: Refuse to reboot into a kernel that lacks a DKMS module
  ansible.builtin.include_tasks:
    file: ../../tasks/assert_dkms_built.yml
  when: armbian_boot_mode in ['local_kernel', 'local']

- name: Reboot the running OS
  ansible.builtin.command:
    argv:
      - systemctl
      - reboot
  become: true
  # Fire and forget: the reboot drops the SSH session under the task.
  async: 30
  poll: 0
  changed_when: true

- name: Wait for the board to go down
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ ansible_port | default(22) }}"
    state: stopped
    timeout: 120
  delegate_to: localhost
  become: false
