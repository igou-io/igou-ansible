---
# Power-cycle each targeted board through its armbian_power_cycle_tasks hook,
# wait for it, and verify the booted root matches armbian_boot_mode. Run
# pin_boot_mode.yaml first so the router pin matches the mode.
#
#   ansible-playbook playbooks/armbian/cycle_board.yaml \
#     -i igou-inventory/inventory.yaml -e target_hosts=opi5pro-01.igou.systems
- name: Power-cycle the board and verify its boot mode
  hosts: "{{ target_hosts | mandatory('target_hosts is required: pass -e target_hosts=<board or group>') }}:&boards"
  gather_facts: false
  vars:
    # reimage.yaml sets this for the first boot of a fresh image, which has
    # no automation user yet: wait for sshd only and skip the verify login.
    __cycle_board_fresh_image: false
  tasks:
    - name: Resolve the board configuration
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config

    - name: Power-cycle the board and wait for it
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_wait
      vars:
        board_boot_wait_power_cycle_tasks: "{{ playbook_dir }}/{{ armbian_power_cycle_tasks }}"
        board_boot_wait_ssh: "{{ not __cycle_board_fresh_image }}"
        # A fresh image regenerates host keys and resizes on first boot.
        board_boot_wait_port_timeout: >-
          {{ armbian_boot_wait_timeouts.fresh_port if __cycle_board_fresh_image
             else armbian_boot_wait_timeouts.port }}
        board_boot_wait_ssh_timeout: "{{ armbian_boot_wait_timeouts.ssh }}"

    - name: Verify the root filesystem matches the boot mode
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_verify
      vars:
        board_boot_verify_mode: "{{ armbian_boot_mode }}"
        # local_kernel boards whose root is not NVMe (cm3588-nas: eMMC)
        # declare local_kernel.verify_match; other modes keep the role default.
        board_boot_verify_root_match: >-
          {{ board_config.local_kernel.verify_match | default('')
             if armbian_boot_mode == 'local_kernel' else '' }}
      when: not __cycle_board_fresh_image
