function post_config_uboot_target__999_cm3588_legacy_net_for_pxe() {
    [[ "${BOARD}" != "cm3588-nas" ]] && return 0
    display_alert "${BOARD}" "legacy NET + PXE bootmeth (upstream lwIP build has no pxe bootflow)" "info"
    run_host_command_logged scripts/config --disable CONFIG_NET_LWIP
    run_host_command_logged scripts/config --enable CONFIG_NET
    run_host_command_logged scripts/config --enable CONFIG_CMD_DHCP
    run_host_command_logged scripts/config --enable CONFIG_CMD_PXE
    run_host_command_logged scripts/config --enable CONFIG_CMD_TFTPBOOT
    run_host_command_logged scripts/config --enable CONFIG_BOOTMETH_EXTLINUX_PXE
}

# Linux's r8169 powers the RTL8125B PHY down at shutdown when
# WoL is disabled, and u-boot's minimal 8125B driver never
# powers it back up — warm reboots then can't PXE (BOOTP into
# a dead link) and silently fall back to the SD rootfs. Ship
# the WoL udev rule in every image so re-provisioned rootfs
# copies (NFS extract, eMMC/NVMe disk_provision) keep the PHY
# powered through reboots. Cold power-ons don't need it.
function post_family_tweaks__999_cm3588_rtl8125_wol_udev() {
    [[ "${BOARD}" != "cm3588-nas" ]] && return 0
    display_alert "${BOARD}" "shipping rtl8125 WoL udev rule (PHY stays powered for warm-reboot PXE)" "info"
    mkdir -p "${SDCARD}/etc/udev/rules.d"
    echo 'ACTION=="add", SUBSYSTEM=="net", KERNEL=="eth0", RUN+="/usr/sbin/ethtool -s eth0 wol g"' \
        > "${SDCARD}/etc/udev/rules.d/81-rtl8125-wol.rules"
}

# ZFS DKMS builds on-board against the exact kernel this image
# ships, so the headers package must land in the image.
# Belt-and-braces over the INSTALL_HEADERS=yes compile_arg: the
# family-layer extension_finish_config__999_no_bcmdhd_for_netboot
# hook forces INSTALL_HEADERS=no when BCMDHD_TYPE is set.
# cm3588-nas.csc sets no BCMDHD_TYPE (verified at v26.5.1) so
# that hook returns early, but a silently-dropped headers
# package only surfaces after a full build AND reimage —
# re-assert here (999_zz_ sorts after 999_).
function extension_finish_config__999_zz_cm3588_install_headers_for_zfs() {
    [[ "${BOARD}" != "cm3588-nas" ]] && return 0
    display_alert "${BOARD}" "forcing INSTALL_HEADERS=yes for on-board ZFS DKMS" "info"
    declare -g INSTALL_HEADERS="yes"
}
