---
# Bootstrap a freshly imaged board: log in as root with the image's default
# password, create the automation user (armbian_bootstrap_user, keys from
# armbian_bootstrap_ssh_keys) with passwordless sudo, disable SSH password
# and root login, and lock the root password. Later plays connect as the
# automation user.
#
#   ansible-playbook playbooks/armbian/bootstrap.yaml \
#     -i igou-inventory/inventory.yaml -e target_hosts=opi5pro-01.igou.systems
- name: Bootstrap the automation user
  hosts: "{{ target_hosts | mandatory('target_hosts is required: pass -e target_hosts=<board or group>') }}:&boards"
  gather_facts: false
  # Connection overrides for the first-boot root session only. The fresh
  # image regenerated its host keys, so known_hosts is bypassed.
  vars:
    ansible_user: root
    ansible_password: "{{ armbian_default_password }}"
    ansible_become: false
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Create the automation user and lock root
      ansible.builtin.include_role:
        name: david_igou.armbian.bootstrap_armbian
      vars:
        bootstrap_armbian_user: "{{ armbian_bootstrap_user }}"
        bootstrap_armbian_ssh_keys: "{{ armbian_bootstrap_ssh_keys }}"
        bootstrap_armbian_lock_root: true
