---
# Build a custom Armbian image for each targeted board that defines a build
# layer (board_config_build_family/_model/_host), stage the results on the
# controller and publish them to the netboot server's images/<board>/.
#
#   ansible-playbook playbooks/armbian/build_and_publish.yaml \
#     -i igou-inventory/inventory.yaml -e target_hosts=opi5pro-01.igou.systems
#
# Add -e armbian_build_force=true to rebuild an image whose inputs are
# unchanged.
- name: Resolve each board's build profile
  hosts: "{{ target_hosts | mandatory('target_hosts is required: pass -e target_hosts=<board or group>') }}:&boards"
  gather_facts: false
  tasks:
    - name: Resolve the board configuration
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config

    - name: Resolve the build profile
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config
        tasks_from: build

- name: Build each board's image and stage it on the controller
  hosts: armbian_builders
  gather_facts: false
  vars:
    __build_boards: >-
      {{ query('inventory_hostnames', target_hosts ~ ':&boards')
         | map('extract', hostvars) | selectattr('board_config_build_enabled')
         | map(attribute='inventory_hostname') | list }}
  tasks:
    - name: Build the image
      ansible.builtin.include_role:
        name: david_igou.armbian.image_build
      vars:
        image_build_board: "{{ hostvars[__board].board_config.armbian_board_name }}"
        image_build_name: "{{ __board }}"
        image_build_cache_dir: "{{ armbian_build_cache_dir }}"
        image_build_output_dir: "{{ armbian_build_output_dir }}"
        image_build_branch: "{{ hostvars[__board].board_config_build.branch }}"
        image_build_release: "{{ hostvars[__board].board_config_build.release }}"
        image_build_ref: "{{ hostvars[__board].board_config_build.ref }}"
        image_build_userpatches: "{{ hostvars[__board].board_config_build.userpatches }}"
        image_build_compile_args: "{{ hostvars[__board].board_config_build.compile_args }}"
        image_build_timeout: "{{ hostvars[__board].board_config_build.timeout }}"
        image_build_min_free_gb: "{{ hostvars[__board].board_config_build.min_free_gb }}"
        image_build_force: "{{ armbian_build_force | default(false) }}"
      loop: "{{ __build_boards }}"
      loop_control:
        loop_var: __board

    # hostvars[inventory_hostname] on purpose: under delegate_to, bare
    # ansible_host/ansible_user resolve from the delegate (localhost), which
    # in an AAP EE rendered igou@localhost:22. No IdentityAgent=none either:
    # the EE's only key is the runner ssh-agent one from the machine
    # credential.
    - name: Stage each board's build directory on the controller
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --compress
          - --delete
          - --mkpath
          - --itemize-changes
          - --rsh
          - "ssh -p {{ hostvars[inventory_hostname].ansible_port | default(22) }} -o StrictHostKeyChecking=accept-new"
          - "{{ hostvars[inventory_hostname].ansible_user }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ armbian_build_output_dir }}/{{ item }}/"
          - "{{ armbian_publish_staging_dir }}/{{ item }}/"
      delegate_to: localhost
      connection: local
      register: __build_stage
      changed_when: __build_stage.stdout | length > 0
      loop: "{{ __build_boards }}"

- name: Publish each board's staged image to the netboot server
  hosts: netboot_server
  gather_facts: false
  vars:
    __build_boards: >-
      {{ query('inventory_hostnames', target_hosts ~ ':&boards')
         | map('extract', hostvars) | selectattr('board_config_build_enabled')
         | map(attribute='inventory_hostname') | list }}
  tasks:
    # Same delegation rule as the staging task: user and port come from the
    # netboot server's own hostvars, the key from the runner agent.
    - name: Push each staged image and manifest (sudo on receive)
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --compress
          - --mkpath
          - --itemize-changes
          - --rsync-path=sudo rsync
          - --rsh
          - "ssh -p {{ hostvars[inventory_hostname].ansible_port | default(22) }} -o StrictHostKeyChecking=accept-new"
          - "{{ armbian_publish_staging_dir }}/{{ item }}/"
          - "{{ hostvars[inventory_hostname].ansible_user }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ armbian_nfs_assets_export }}/images/{{ item }}/"
      delegate_to: localhost
      connection: local
      register: __build_publish
      changed_when: __build_publish.stdout | length > 0
      loop: "{{ __build_boards }}"
