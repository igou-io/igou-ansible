---
# Stage the targeted boards' netboot assets: provision each board's NFS
# rootfs and TFTP kernel/initrd/dtb on the netboot server from its published
# image, then copy the TFTP files to the router's flash.
#
#   ansible-playbook playbooks/armbian/stage_netboot_assets.yaml \
#     -i igou-inventory/inventory.yaml -e target_hosts=opi5pro-01.igou.systems
#
# Add -e armbian_rootfs_force=true to re-extract a rootfs whose image is
# unchanged.
- name: Resolve each board's rootfs source
  hosts: "{{ target_hosts | mandatory('target_hosts is required: pass -e target_hosts=<board or group>') }}:&boards"
  gather_facts: false
  tasks:
    - name: Resolve the board configuration
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config

    - name: Resolve the rootfs source from the published manifest
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config
        tasks_from: rootfs_src
      vars:
        board_config_assets_base_url: "{{ armbian_assets_base_url }}"

- name: Provision each board's NFS rootfs and TFTP files
  hosts: netboot_server
  become: true
  gather_facts: false
  vars:
    __stage_boards: "{{ query('inventory_hostnames', target_hosts ~ ':&boards') }}"
  tasks:
    - name: Provision the rootfs
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_provision
      vars:
        rootfs_provision_src: "{{ hostvars[__board].board_config_rootfs_src }}"
        rootfs_provision_checksum: "{{ hostvars[__board].board_config_rootfs_checksum }}"
        rootfs_provision_hostname: "{{ __board }}"
        rootfs_provision_dtb: "{{ hostvars[__board].board_config.dtb | default('') }}"
        rootfs_provision_target_dir: "{{ armbian_nfs_rootfs_path }}/{{ __board }}"
        rootfs_provision_tftp_dir: "{{ armbian_image_cache }}/sbc-tftp/{{ __board }}"
        rootfs_provision_cache_dir: "{{ armbian_image_cache }}/downloads"
        rootfs_provision_force: "{{ armbian_rootfs_force | default(false) }}"
      loop: "{{ __stage_boards }}"
      loop_control:
        loop_var: __board

- name: Fetch each board's TFTP files to the controller
  hosts: netboot_server
  become: true
  gather_facts: false
  vars:
    __stage_boards: "{{ query('inventory_hostnames', target_hosts ~ ':&boards') }}"
    __stage_assets:
      - vmlinuz
      - initrd.img
      - board.dtb
  tasks:
    - name: Ensure the controller cache directory exists per board
      ansible.builtin.file:
        path: "{{ armbian_tftp_cache_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      # A real local connection: inventory localhost is an SSH build host
      # whose sshd has PrivateTmp, so an SSH-delegated mkdir would create
      # a private /tmp the fetch below cannot see.
      vars:
        ansible_connection: local
      become: false
      loop: "{{ __stage_boards }}"

    - name: Fetch each board's TFTP files
      ansible.builtin.fetch:
        src: "{{ armbian_image_cache }}/sbc-tftp/{{ item.0 }}/{{ item.1 }}"
        dest: "{{ armbian_tftp_cache_dir }}/{{ item.0 }}/{{ item.1 }}"
        flat: true
      loop: "{{ __stage_boards | product(__stage_assets) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"

- name: Upload each board's TFTP files to the router
  hosts: "{{ target_hosts }}:&boards"
  gather_facts: false
  # One board at a time: every upload delegates to the same router, and
  # parallel net_put bursts flake RouterOS's SSH server.
  serial: 1
  vars:
    __stage_assets:
      - vmlinuz
      - initrd.img
      - board.dtb
  tasks:
    - name: Upload the TFTP files to the router
      delegate_to: "{{ armbian_router }}"
      block:
        - name: Ensure the base armbian directory exists on router flash
          community.routeros.command:
            commands:
              - >-
                :if ([/file find name="{{ armbian_tftp_flash_dir }}/armbian" type=directory] = "")
                do={/file add name="{{ armbian_tftp_flash_dir }}/armbian" type=directory}
          register: __stage_basedir
          retries: 3
          delay: 5
          until: __stage_basedir is succeeded
          changed_when: false

        - name: Ensure the board's directory exists on router flash
          community.routeros.command:
            commands:
              - >-
                :if ([/file find name="{{ armbian_tftp_flash_dir }}/armbian/{{ inventory_hostname }}" type=directory] = "")
                do={/file add name="{{ armbian_tftp_flash_dir }}/armbian/{{ inventory_hostname }}" type=directory}
          register: __stage_hostdir
          retries: 3
          delay: 5
          until: __stage_hostdir is succeeded
          changed_when: false

        # The upload primitive is size-gated, and a same-size stale
        # vmlinuz once left the router serving an old kernel whose modules
        # no longer matched the rootfs. Remove first so every run pushes.
        - name: Remove the board's router-side TFTP files
          community.routeros.command:
            commands:
              - >-
                /file remove
                [find name="{{ armbian_tftp_flash_dir }}/armbian/{{ inventory_hostname }}/{{ item }}"]
          register: __stage_preremove
          retries: 3
          delay: 5
          until: __stage_preremove is succeeded
          changed_when: false
          loop: "{{ __stage_assets }}"

        - name: Upload each TFTP file
          ansible.builtin.include_tasks: transport/upload_file.yml
          vars:
            _upload_local_src: "{{ armbian_tftp_cache_dir }}/{{ inventory_hostname }}/{{ item }}"
            _upload_remote_path: "{{ armbian_tftp_flash_dir }}/armbian/{{ inventory_hostname }}/{{ item }}"
            _upload_req_filename: "armbian/{{ inventory_hostname }}/{{ item }}"
            _upload_req_filename_is_regex: false
          loop: "{{ __stage_assets }}"

        - name: Verify the /ip tftp rows landed
          ansible.builtin.include_tasks: transport/plumbing_check.yml
