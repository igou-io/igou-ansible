---
# Stage the targeted boards' netboot assets: provision each board's NFS
# rootfs on the netboot server from its published image, with the TFTP
# kernel/initrd/dtb in the netboot server's HTTP staging directory, then
# have the router pull the files it does not already hold.
#
#   ansible-playbook playbooks/armbian/stage_netboot_assets.yaml \
#     -i igou-inventory/inventory.yaml -e target_hosts=opi5pro-01.igou.systems
#
# Add -e armbian_rootfs_force=true to re-extract a rootfs whose image is
# unchanged.
- name: Resolve each board's rootfs source
  hosts: "{{ target_hosts | mandatory('target_hosts is required: pass -e target_hosts=<board or group>') }}:&boards"
  gather_facts: false
  tasks:
    - name: Resolve the board configuration
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config

    - name: Resolve the rootfs source from the published manifest
      ansible.builtin.include_role:
        name: david_igou.armbian.board_config
        tasks_from: rootfs_src
      vars:
        board_config_assets_base_url: "{{ armbian_assets_base_url }}"

- name: Provision each board's NFS rootfs and TFTP files
  hosts: netboot_server
  become: true
  gather_facts: false
  vars:
    __stage_boards: "{{ query('inventory_hostnames', target_hosts ~ ':&boards') }}"
  tasks:
    - name: Provision the rootfs
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_provision
      vars:
        rootfs_provision_src: "{{ hostvars[__board].board_config_rootfs_src }}"
        rootfs_provision_checksum: "{{ hostvars[__board].board_config_rootfs_checksum }}"
        rootfs_provision_hostname: "{{ __board }}"
        rootfs_provision_dtb: "{{ hostvars[__board].board_config.dtb | default('') }}"
        rootfs_provision_target_dir: "{{ armbian_nfs_rootfs_path }}/{{ __board }}"
        rootfs_provision_tftp_dir: "{{ armbian_tftp_staging_dir }}/{{ __board }}"
        rootfs_provision_cache_dir: "{{ armbian_image_cache }}/downloads"
        rootfs_provision_force: "{{ armbian_rootfs_force | default(false) }}"
      loop: "{{ __stage_boards }}"
      loop_control:
        loop_var: __board

- name: Pull each board's TFTP files onto the router
  hosts: "{{ target_hosts }}:&boards"
  gather_facts: false
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ __armbian_router_api.hostname }}"
      port: "{{ __armbian_router_api.port }}"
      tls: "{{ __armbian_router_api.tls }}"
      validate_certs: "{{ __armbian_router_api.validate_certs }}"
      username: "{{ __armbian_router_api.username }}"
      password: "{{ __armbian_router_api.password }}"
  vars:
    __stage_files: "{{ ['vmlinuz', 'initrd.img'] + (['board.dtb'] if board_config.dtb | default('') | length > 0 else []) }}"
    __stage_router_dir: "{{ armbian_tftp_flash_dir }}/armbian/{{ inventory_hostname }}"
    __stage_router_names: "{{ __stage_router_query.msg | map(attribute='name') | list }}"
    __stage_router_sums: >-
      {{ __stage_router_query.msg | selectattr('name', 'search', '[.]sha256$')
         | items2dict(key_name='name', value_name='contents') }}
  tasks:
    # The credentials are 1Password lookups in production; resolve them once
    # instead of once per API task.
    - name: Resolve the router API connection once
      ansible.builtin.set_fact:
        __armbian_router_api: >-
          {{ hostvars[armbian_router].routeros_api_connection
             | combine(hostvars[armbian_router].routeros_api_credentials) }}
      no_log: true

    - name: Hash the staged files on the netboot server
      ansible.builtin.stat:
        path: "{{ armbian_tftp_staging_dir }}/{{ inventory_hostname }}/{{ item }}"
        checksum_algorithm: sha256
      delegate_to: "{{ groups['netboot_server'] | first }}"
      register: __stage_staged
      failed_when: not __stage_staged.stat.exists
      loop: "{{ __stage_files }}"

    # RouterOS reports no file checksums: each file has a <name>.sha256
    # sidecar recording what was fetched. The router pulls over HTTP because
    # pushing through its API or SSH is slow and unreliable for 100 MB files.
    - name: Bring the router's copies up to date
      delegate_to: localhost
      vars:
        ansible_connection: local
      become: false
      block:
        - name: Read the router's copies and their checksum sidecars
          community.routeros.api:
            path: file
            extended_query:
              attributes:
                - name
                - contents
              where:
                - attribute: name
                  is: in
                  value: >-
                    {{ __stage_files | product(['', '.sha256']) | map('join')
                       | map('regex_replace', '^', __stage_router_dir ~ '/') | list }}
          register: __stage_router_query

        - name: Pull each changed or missing file from the staging directory
          community.routeros.api:
            path: tool
            cmd: >-
              fetch url={{ armbian_tftp_staging_url }}/{{ inventory_hostname }}/{{ item.item }}
              dst-path={{ __stage_router_dir }}/{{ item.item }}
          loop: "{{ __stage_staged.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: >-
            (__stage_router_dir ~ '/' ~ item.item) not in __stage_router_names
            or __stage_router_sums[__stage_router_dir ~ '/' ~ item.item ~ '.sha256'] | default('') != item.stat.checksum
          changed_when: true

        - name: Record each file's checksum in its sidecar
          ansible.builtin.include_tasks: transport/router_ensure.yml
          vars:
            __armbian_router_path: file
            __armbian_router_key: name
            __armbian_router_entries:
              - name: "{{ __stage_router_dir }}/{{ item.item }}.sha256"
                contents: "{{ item.stat.checksum }}"
          loop: "{{ __stage_staged.results }}"
          loop_control:
            label: "{{ item.item }}"

        # A directory real-filename serves <dir>/<requested path>. The
        # initrd outgrows 65535 blocks, hence allow-rollover.
        - name: Serve armbian/ from the router's flash directory
          ansible.builtin.include_tasks: transport/router_ensure.yml
          vars:
            __armbian_router_path: ip tftp
            __armbian_router_key: req-filename
            __armbian_router_entries:
              - req-filename: armbian/.*
                real-filename: "{{ armbian_tftp_flash_dir }}"
                allow: true
                read-only: true
                allow-rollover: true
