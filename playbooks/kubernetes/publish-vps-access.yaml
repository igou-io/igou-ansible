---
- name: Seed VPS namespaces and Argo identity and publish controller access
  hosts: "{{ ansible_limit | default('none') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Require the intended standalone VPS and management credential inputs
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == ['igou.io']
          - cluster_name == 'vps'
          - vps_connect_host_lookup | length > 0
          - vps_connect_token_lookup | length > 0
        fail_msg: Select igou.io and provide controller-side Connect credentials.
      no_log: true

    - name: Seed only namespaces and the Argo access identity
      ansible.builtin.include_tasks: tasks/seed-vps-access.yml

    - name: Read the generated Argo service-account credential through the API
      kubernetes.core.k8s_info:
        kubeconfig: "{{ vps_admin_kubeconfig }}"
        api_version: v1
        kind: Secret
        name: argocd-manager-token
        namespace: argocd
      register: vps_argocd_access
      until:
        - vps_argocd_access.resources | length == 1
        - vps_argocd_access.resources[0].get('data', {}).get('token', '') | length > 0
      retries: 15
      delay: 2
      no_log: true

    - name: Resolve the management vault ID
      ansible.builtin.uri:
        url: "{{ vps_connect_host_lookup }}/v1/vaults"
        headers:
          Authorization: "Bearer {{ vps_connect_token_lookup }}"
        return_content: true
      delegate_to: localhost
      become: false
      register: vps_access_vaults
      no_log: true

    - name: Select the exact management vault
      ansible.builtin.set_fact:
        vps_access_vault_id: "{{ (vps_access_vaults.json | selectattr('name', 'equalto', 'lab_agents') | list | first).id }}"
      no_log: true

    - name: Find an existing VPS access item without revealing contents
      ansible.builtin.uri:
        url: "{{ vps_connect_host_lookup }}/v1/vaults/{{ vps_access_vault_id }}/items"
        headers:
          Authorization: "Bearer {{ vps_connect_token_lookup }}"
        return_content: true
      delegate_to: localhost
      become: false
      register: vps_access_items
      no_log: true

    - name: Require an unambiguous access item
      ansible.builtin.assert:
        that:
          - vps_access_items.json | selectattr('title', 'equalto', 'vps-k3s') | list | length <= 1
        fail_msg: Multiple vps-k3s items exist; do not overwrite an ambiguous credential.
      no_log: true

    - name: Read the existing management item privately
      ansible.builtin.uri:
        url: "{{ vps_connect_host_lookup }}/v1/vaults/{{ vps_access_vault_id }}/items/{{ (vps_access_items.json | selectattr('title', 'equalto', 'vps-k3s') | first).id }}"
        headers:
          Authorization: "Bearer {{ vps_connect_token_lookup }}"
        return_content: true
      delegate_to: localhost
      become: false
      register: vps_access_existing_item
      when: vps_access_items.json | selectattr('title', 'equalto', 'vps-k3s') | list | length == 1
      no_log: true

    - name: Prepare the generated management credential fields privately
      ansible.builtin.set_fact:
        vps_access_fields:
          - id: argocd_token
            label: argocd_token
            type: CONCEALED
            value: "{{ vps_argocd_access.resources[0]['data']['token'] | b64decode }}"
          # k8s_info redacts returned CA data when it matches its input kubeconfig.
          - id: ca_data
            label: ca_data
            type: CONCEALED
            value: "{{ vps_admin_kubeconfig.clusters[0].cluster['certificate-authority-data'] }}"
          - id: kubeconfig
            label: kubeconfig
            type: CONCEALED
            value: >-
              {{ (vps_admin_access.content | b64decode |
                  replace('https://127.0.0.1:6443', 'https://' ~ vps_tailnet_fqdn ~ ':6443')) | b64encode }}
      no_log: true

    - name: Create or update changed management credentials through Connect
      ansible.builtin.uri:
        url: >-
          {{ vps_connect_host_lookup }}/v1/vaults/{{ vps_access_vault_id }}/items{{
             '/' ~ vps_access_existing_item.json.id if vps_access_existing_item.json is defined else '' }}
        method: "{{ 'PUT' if vps_access_existing_item.json is defined else 'POST' }}"
        headers:
          Authorization: "Bearer {{ vps_connect_token_lookup }}"
        body_format: json
        body: >-
          {{ (vps_access_existing_item.json | default({})) | combine({
               'vault': {'id': vps_access_vault_id},
               'title': 'vps-k3s',
               'category': 'API_CREDENTIAL',
               'fields': (vps_access_existing_item.json.fields | default([]) |
                 rejectattr('label', 'in', vps_access_fields | map(attribute='label') | list) | list) + vps_access_fields}) }}
        status_code:
          - 200
          - 201
      delegate_to: localhost
      become: false
      when: >-
        (vps_access_existing_item.json.fields | default([]) |
          selectattr('label', 'in', vps_access_fields | map(attribute='label') | list) |
          items2dict(key_name='label', value_name='value')) !=
        (vps_access_fields | items2dict(key_name='label', value_name='value'))
      changed_when: true
      no_log: true
