---
- name: Manage temporary public forwarding through the VPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    public_share_action: list-available
    public_share_id: ''
    public_share_expires_at: ''
    public_share_protocols: HTTP
    public_share_tcp_port: 0
    public_share_udp_port: 0
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ public_share_vps_connection }}"
  tasks:
    - name: Validate the requested operation and authenticated caller
      ansible.builtin.assert:
        that:
          - public_share_action in ['create', 'extend', 'remove', 'list-active', 'list-available', 'cleanup']
          - public_share_action == 'cleanup' or awx_user_id is defined
          - public_share_action not in ['extend', 'remove'] or public_share_id is match('^ps-[a-z0-9-]{1,30}$')
        fail_msg: Use the AAP survey and an authenticated launching user.

    - name: List approved backends and Create inputs
      when: public_share_action == 'list-available'
      block:
        - name: Build the available backend listing
          ansible.builtin.set_fact:
            public_share_available_backends: "{{ public_share_backends | default({}) | public_share_available }}"
            public_share_create_options:
              public_ports:
                HTTP: 443
                TCP: 27010-27017
                UDP: 27018-27025
              expiration: UTC YYYY-MM-DDTHH:MM:SSZ; blank defaults to two hours
              max_lease_hours: "{{ public_share_max_lease_hours | default(72) }}"
              max_active: "{{ public_share_max_active | default(8) }}"
              max_active_per_owner: "{{ public_share_max_active_per_owner | default(3) }}"
              port_selection: Examples use the first pool port. Create checks whether the chosen port is free.

        - name: Show available backends and copyable Create inputs
          ansible.builtin.debug:
            msg:
              options: "{{ public_share_create_options }}"
              backends: "{{ public_share_available_backends }}"

        - name: Return the available backend listing as job artifacts
          ansible.builtin.set_stats:
            data:
              public_share_available_backends: "{{ public_share_available_backends }}"
              public_share_create_options: "{{ public_share_create_options }}"

        - name: Finish the catalog listing
          ansible.builtin.meta: end_play

    - name: Resolve controller-side credentials once without logging them
      ansible.builtin.set_fact:
        public_share_vps_connection: "{{ public_share_vps_kubeconfig_lookup }}"
      no_log: true

    - name: Set the owner and a single UTC observation for this run
      ansible.builtin.set_fact:
        public_share_owner: "{{ 'aap-user-' ~ awx_user_id if awx_user_id is defined else '' }}"
        public_share_now: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        public_share_scopes: "{{ '' | public_share_scopes }}"
        public_share_objects: []

    - name: Read only reviewed resource kinds and namespaces
      no_log: true
      kubernetes.core.k8s_info:
        api_version: "{{ public_share_scope.api_version }}"
        kind: "{{ public_share_scope.kind }}"
        namespace: "{{ public_share_scope.namespace }}"
      loop: "{{ public_share_scopes }}"
      loop_control:
        loop_var: public_share_scope
        label: "{{ public_share_scope.namespace }}/{{ public_share_scope.kind }}"
      register: public_share_discovery

    - name: Gather managed objects across the allowed scopes
      ansible.builtin.set_fact:
        public_share_objects: "{{ public_share_objects + public_share_result.resources }}"
      loop: "{{ public_share_discovery.results }}"
      loop_control:
        loop_var: public_share_result
        label: "{{ public_share_result.public_share_scope.kind }}"

    - name: Select the caller's objects or all objects for scheduled cleanup
      ansible.builtin.set_fact:
        public_share_selected: >-
          {{ public_share_objects | public_share_selected(
               public_share_id, '' if public_share_action == 'cleanup' else public_share_owner) }}

    - name: Require an existing owned share before mutation
      ansible.builtin.assert:
        that: public_share_selected | length > 0
        fail_msg: No objects exist for this share and caller.
      when: public_share_action == 'extend'

    - name: Create the selected forwarding path
      ansible.builtin.include_tasks: tasks/public-share/create.yml
      when: public_share_action == 'create'

    - name: Validate the new expiration before updating any object
      ansible.builtin.set_fact:
        public_share_new_expiry: "{{ public_share_expires_at | public_share_expiry(public_share_now, public_share_max_lease_hours | default(72)) }}"
      when: public_share_action == 'extend'

    - name: Update or delete each selected object with concurrency checks
      ansible.builtin.include_tasks: tasks/public-share/mutate.yml
      loop: "{{ public_share_selected }}"
      loop_control:
        loop_var: public_share_object
        label: "{{ public_share_object.kind }}/{{ public_share_object.metadata.name }}"
      when: public_share_action in ['extend', 'remove', 'cleanup']

    - name: Report malformed dates and cleanup failures after processing all objects
      ansible.builtin.assert:
        that:
          - not (public_share_cleanup_failed | default(false))
          - public_share_selected | public_share_invalid_expiries | length == 0
        fail_msg: Some objects need attention; valid expired objects were still processed.
      when: public_share_action == 'cleanup'

    - name: Show the caller's active shares
      ansible.builtin.debug:
        msg: "{{ public_share_selected | public_share_summary }}"
      when: public_share_action == 'list-active'

    - name: Return resource references without credentials
      ansible.builtin.set_stats:
        data:
          public_share_resources: >-
            {{ public_share_selected | public_share_summary }}
          public_share_expiration: "{{ public_share_new_expiry | default('') }}"
          public_share_created_id: "{{ public_share_created_id | default('') }}"
