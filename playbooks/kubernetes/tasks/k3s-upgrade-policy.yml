---
- name: Require full installed and desired k3s release tags
  ansible.builtin.assert:
    that:
      - k3s_upgrade_current | default('') is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - k3s_release_version | default('') is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')

- name: Parse numeric releases including the k3s build
  ansible.builtin.set_fact:
    k3s_upgrade_current_parts: "{{ k3s_upgrade_current | replace('+k3s', '.') | regex_replace('^v', '') | split('.') | map('int') | list }}"
    k3s_upgrade_target_parts: "{{ k3s_release_version | replace('+k3s', '.') | regex_replace('^v', '') | split('.') | map('int') | list }}"

- name: Reject downgrades and skipped minor releases
  ansible.builtin.assert:
    that:
      - k3s_upgrade_target_parts >= k3s_upgrade_current_parts
      - k3s_upgrade_target_parts[0] == k3s_upgrade_current_parts[0]
      - k3s_upgrade_target_parts[1] | int <= (k3s_upgrade_current_parts[1] | int) + 1
    fail_msg: "Unsupported upgrade from {{ k3s_upgrade_current }} to {{ k3s_release_version }}."
