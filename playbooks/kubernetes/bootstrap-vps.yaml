---
- name: Bootstrap the standalone VPS k3s server
  hosts: "{{ ansible_limit | default('none') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require one explicitly selected VPS control plane
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - cluster_name == 'vps'
          - k3s_control_node | bool
          - k3s_release_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
        fail_msg: Select exactly one VPS host and a pinned k3s release.

    - name: Install host networking and API client prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - conntrack
          - iptables
          - nftables
          - python3-kubernetes
          - python3-jsonpatch
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the firewall configuration directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Require explicit public listener allowlists
      ansible.builtin.assert:
        that:
          - vps_public_tcp_ports | default([]) | length > 0
          - vps_public_udp_ports | default([]) | length > 0
          - vps_public_tcp_ports | map('string') | select('match', '^[0-9]+(-[0-9]+)?$') | list | length == vps_public_tcp_ports | length
          - vps_public_udp_ports | map('string') | select('match', '^[0-9]+(-[0-9]+)?$') | list | length == vps_public_udp_ports | length
        fail_msg: Define reviewed public TCP and UDP port allowlists in host inventory.

    - name: Configure the public interface firewall guard
      ansible.builtin.template:
        src: templates/vps-guard.nft.j2
        dest: /etc/nftables.d/vps-guard.nft
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/nft --check --file %s
      notify: Reload VPS firewall guard

    - name: Configure the firewall guard service
      ansible.builtin.template:
        src: templates/vps-guard.service.j2
        dest: /etc/systemd/system/vps-guard.service
        owner: root
        group: root
        mode: "0644"

    - name: Start the firewall guard before installing k3s
      ansible.builtin.systemd_service:
        name: vps-guard.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Apply changed firewall rules before any API startup
      ansible.builtin.meta: flush_handlers

    - name: Enable Kubernetes forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_set: true
        reload: true

    - name: Inspect whether Tailscale is already installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: vps_tailnet_binary
      when: vps_manage_tailscale | default(true) | bool

    - name: Inspect existing host enrollment privately
      ansible.builtin.command:
        argv:
          - tailscale
          - status
          - --json
      changed_when: false
      failed_when: false
      register: vps_existing_tailnet
      when:
        - vps_manage_tailscale | default(true) | bool
        - vps_tailnet_binary.stat.exists
      no_log: true

    - name: Enroll host Tailscale with the inventory credential
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
        apply:
          no_log: true
      vars:
        tailscale_authkey: "{{ vps_tailscale_authkey_lookup }}"
        state: present
        verbose: false
        tailscale_oauth_ephemeral: false
        tailscale_oauth_preauthorized: true
        tailscale_up_skip: >-
          {{ ((vps_existing_tailnet.stdout | default('{}', true) | from_json).get('BackendState', '') == 'Running') }}
      when: vps_manage_tailscale | default(true) | bool
      no_log: true

  roles:
    - role: xanmanning.k3s

  tasks:
    - name: Create the kubelet configuration directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Configure pod swap behavior and bounded container logs
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-vps.conf
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          failSwapOn: false
          memorySwap:
            swapBehavior: NoSwap
          containerLogMaxSize: 10Mi
          containerLogMaxFiles: 3
          imageGCHighThresholdPercent: 75
          imageGCLowThresholdPercent: 65
        owner: root
        group: root
        mode: "0600"
      notify: Restart VPS k3s

    - name: Create the journal configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bound host journal storage
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/vps-limits.conf
        content: |
          [Journal]
          SystemMaxUse=100M
          RuntimeMaxUse=32M
          SystemKeepFree=256M
          MaxRetentionSec=14day
        owner: root
        group: root
        mode: "0644"
      notify: Restart VPS journal

    - name: Apply changed service configuration
      ansible.builtin.meta: flush_handlers

    - name: Wait for the local Kubernetes API
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - --raw=/readyz
      changed_when: false
      register: vps_api_ready
      until: vps_api_ready.rc == 0
      retries: 30
      delay: 5

    - name: Confirm the server node becomes ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=120s
      changed_when: false

  handlers:
    - name: Restart VPS journal
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Reload VPS firewall guard
      ansible.builtin.systemd_service:
        name: vps-guard.service
        state: reloaded

    - name: Restart VPS k3s
      ansible.builtin.systemd_service:
        name: k3s.service
        state: restarted
