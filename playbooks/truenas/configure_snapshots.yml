---
# Configure periodic ZFS snapshot tasks + intra-box replication on TrueNAS
# (igou-inventory#125):
#
#   * periodic snapshot tasks — arensb.truenas.pool_snapshot_task
#     (matched by dataset + name_format)
#   * replication tasks       — midclt replication.* (no arensb module),
#     phase 1: LOCAL transport, ssd → cold, linked to the periodic snapshot
#     tasks so each new snapshot replicates automatically. Matched by name.
#
# Off-box replication (phase 2, igounas rsync) is deliberately NOT here —
# target/tooling decision is still open on the issue.
#
# Variables (igou-inventory group_vars/truenas.yml):
#   truenas_snapshot_parent_datasets — datasets to ensure exist (replication
#                                      target parents), arensb.truenas.filesystem
#   truenas_snapshot_tasks           — list of pool_snapshot_task params
#   truenas_replication_tasks        — list of {name, source_datasets,
#                                      target_dataset, snapshot_name_formats,
#                                      lifetime_value, lifetime_unit, ...}
- name: Configure TrueNAS periodic snapshots and replication
  hosts: truenas
  gather_facts: false
  become: false
  vars:
    # Name-addressed protection: entries in truenas_k8s_protected_volumes
    # ({cluster, namespace, pvc}) are resolved to datasets at run time via
    # the k8s:* ZFS user properties democratic-csi stamps on every volume,
    # so pvc-UUID churn self-heals on the next converge.
    truenas_k8s_name_format: auto-daily-%Y-%m-%d_%H-%M
  tasks:

    - name: Ensure replication target parent datasets exist
      arensb.truenas.filesystem:
        name: "{{ item }}"
        state: present
        type: FILESYSTEM
      loop: "{{ truenas_snapshot_parent_datasets | default([]) }}"

    - name: Resolve k8s-protected volumes by stamped identity
      when: truenas_k8s_protected_volumes | default([]) | length > 0
      block:

        - name: Query stamped cluster property
          ansible.builtin.command: >-
            zfs get -H -r -s local -o name,value k8s:cluster
            {{ truenas_k8s_volume_parents | join(' ') }}
          register: truenas_k8s_cluster_query
          changed_when: false
          check_mode: false

        - name: Query stamped namespace property
          ansible.builtin.command: >-
            zfs get -H -r -s local -o name,value k8s:pvc_namespace
            {{ truenas_k8s_volume_parents | join(' ') }}
          register: truenas_k8s_namespace_query
          changed_when: false
          check_mode: false

        - name: Query stamped pvc-name property
          ansible.builtin.command: >-
            zfs get -H -r -s local -o name,value k8s:pvc_name
            {{ truenas_k8s_volume_parents | join(' ') }}
          register: truenas_k8s_pvcname_query
          changed_when: false
          check_mode: false

        - name: Resolve each protected volume to exactly one dataset
          vars:
            truenas_k8s_cluster_map: "{{ dict(truenas_k8s_cluster_query.stdout_lines | map('split', '\t')) }}"
            truenas_k8s_namespace_map: "{{ dict(truenas_k8s_namespace_query.stdout_lines | map('split', '\t')) }}"
            truenas_k8s_pvcname_map: "{{ dict(truenas_k8s_pvcname_query.stdout_lines | map('split', '\t')) }}"
          ansible.builtin.set_fact:
            truenas_k8s_resolved: >-
              {%- set out = [] -%}
              {%- for v in truenas_k8s_protected_volumes -%}
              {%-   set matches = truenas_k8s_cluster_map | dict2items
                      | selectattr('value', 'equalto', v.cluster)
                      | map(attribute='key')
                      | select('in', truenas_k8s_namespace_map | dict2items
                          | selectattr('value', 'equalto', v.namespace)
                          | map(attribute='key') | list)
                      | select('in', truenas_k8s_pvcname_map | dict2items
                          | selectattr('value', 'equalto', v.pvc)
                          | map(attribute='key') | list)
                      | list -%}
              {%-   set _ = out.append({'volume': v, 'datasets': matches}) -%}
              {%- endfor -%}
              {{ out }}

        - name: Assert every protected volume resolved to exactly one dataset
          vars:
            truenas_k8s_unresolved: >-
              {%- set out = [] -%}
              {%- for r in truenas_k8s_resolved -%}
              {%-   if r.datasets | length != 1 -%}
              {%-     set _ = out.append(r.volume) -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ out }}
          ansible.builtin.assert:
            that:
              - truenas_k8s_unresolved | length == 0
            fail_msg: >-
              Unresolved or ambiguous protected volumes:
              {{ truenas_k8s_unresolved }}.
              Check the k8s:* properties on TrueNAS (recreated PVCs are
              stamped automatically at provision time; a vanished name means
              the PVC no longer exists on that cluster) and update
              truenas_k8s_protected_volumes in igou-inventory.

        - name: Append per-volume snapshot tasks and the replication task
          ansible.builtin.set_fact:
            truenas_snapshot_tasks: >-
              {{ (truenas_snapshot_tasks | default([])) +
                 (truenas_k8s_resolved | map(attribute='datasets') | map('first')
                  | map('community.general.dict_kv', 'dataset')
                  | map('combine', {
                      'name_format': truenas_k8s_name_format,
                      'lifetime_value': truenas_k8s_snapshot_lifetime_value | default(7),
                      'lifetime_unit': 'DAYS',
                      'recursive': false,
                      'minute': '20', 'hour': '0'
                    }) | list) }}
            truenas_replication_tasks: >-
              {{ (truenas_replication_tasks | default([])) + [ {
                   'name': 'k8s-valuable-to-cold',
                   'source_datasets': truenas_k8s_resolved | map(attribute='datasets') | map('first') | sort | list,
                   'target_dataset': truenas_k8s_replication_target,
                   'snapshot_name_formats': [truenas_k8s_name_format],
                   'lifetime_value': truenas_k8s_replication_lifetime_value | default(30),
                   'lifetime_unit': 'DAY',
                   'recursive': false,
                   'properties': true
                 } ] }}

    - name: Configure periodic snapshot tasks
      arensb.truenas.pool_snapshot_task:
        match:
          dataset: "{{ item.dataset }}"
          name_format: "{{ item.name_format }}"
        state: "{{ item.state | default('present') }}"
        dataset: "{{ item.dataset }}"
        recursive: "{{ item.recursive | default(true) }}"
        lifetime_value: "{{ item.lifetime_value }}"
        lifetime_unit: "{{ item.lifetime_unit }}"
        name_format: "{{ item.name_format }}"
        exclude: "{{ item.exclude | default(omit) }}"
        allow_empty: "{{ item.allow_empty | default(omit) }}"
        enabled: "{{ item.enabled | default(true) }}"
        minute: "{{ item.minute | default(omit) }}"
        hour: "{{ item.hour | default(omit) }}"
        day: "{{ item.day | default(omit) }}"
        month: "{{ item.month | default(omit) }}"
        weekday: "{{ item.weekday | default(omit) }}"
      loop: "{{ truenas_snapshot_tasks | default([]) }}"
      loop_control:
        label: "{{ item.dataset }} ({{ item.name_format }})"

    - name: Manage replication tasks
      when: truenas_replication_tasks | default([]) | length > 0
      block:

        - name: Query periodic snapshot tasks (for replication linkage)
          ansible.builtin.command: midclt call pool.snapshottask.query
          register: truenas_snapshottask_query
          changed_when: false
          check_mode: false

        - name: Query existing replication tasks
          ansible.builtin.command: midclt call replication.query
          register: truenas_replication_query
          changed_when: false
          check_mode: false

        - name: Configure replication tasks
          ansible.builtin.include_tasks: tasks/truenas_replication_task.yml
          loop: "{{ truenas_replication_tasks }}"
          loop_control:
            loop_var: repl
            label: "{{ repl.name }}"
