---
- name: Require the capacity lease being released
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an explicit casval lease identifier
      ansible.builtin.assert:
        that:
          - casval_lease_id | default('') | length > 0
        fail_msg: Supply casval_lease_id from the casval start job or existing durable lease workflow.

    - name: Read the current capacity owner before stopping its desktop
      kubernetes.core.k8s_info:
        api_version: cluster.x-k8s.io/v1beta2
        kind: MachineSet
        name: casval-worker
        namespace: openshift-cluster-api
      register: codex_desktop_casval_capacity

    - name: Refuse a stale capacity owner's desktop stop
      ansible.builtin.assert:
        that:
          - codex_desktop_casval_capacity.resources | length == 1
          - >-
            (codex_desktop_casval_capacity.resources[0].metadata.annotations | default({}))
            .get('automation.igou.systems/casval-lease-id', '') == casval_lease_id
        fail_msg: This capacity lease was superseded; leave the newer owner's desktop running.

- name: Stop the desktop and wait for disk detachment
  ansible.builtin.import_playbook: stop.yaml

- name: Release capacity only if this lease still owns it
  ansible.builtin.import_playbook: ../openshift/casval_scale.yaml
  vars:
    casval_state: down
