---
- name: Require an exact Tailscale device identifier
  ansible.builtin.assert:
    that:
      - codex_desktop_cleanup_device_id | default('') is match('^[A-Za-z0-9]+$')
    fail_msg: Tailnet cleanup requires the recorded device ID; refusing name-based or invalid deletion targets.

- name: Mint a device-management OAuth token
  ansible.builtin.uri:
    url: "{{ codex_desktop_tailscale_api_url | default('https://api.tailscale.com/api/v2') }}/oauth/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ codex_desktop_tailscale_credentials.client_id_lookup }}"
      client_secret: "{{ codex_desktop_tailscale_credentials.client_secret_lookup }}"
      scope: devices:core
      tags: tag:codex
    status_code: 200
  register: codex_desktop_cleanup_oauth
  no_log: true

- name: Read the exact recorded tailnet device
  ansible.builtin.uri:
    url: "{{ codex_desktop_tailscale_api_url | default('https://api.tailscale.com/api/v2') }}/device/{{ codex_desktop_cleanup_device_id }}?fields=all"
    headers:
      Authorization: "Bearer {{ codex_desktop_cleanup_oauth.json.access_token }}"
    status_code:
      - 200
      - 404
  register: codex_desktop_cleanup_device
  no_log: true

- name: Require the expected desktop identity and tag before deletion
  ansible.builtin.assert:
    that:
      - >-
        codex_desktop_cleanup_device_id == (codex_desktop_cleanup_device.json.nodeId | default(''))
        or codex_desktop_cleanup_device_id == (codex_desktop_cleanup_device.json.id | default(''))
      - codex_desktop_cleanup_device.json.hostname | default('') == codex_desktop_name
      - "'tag:codex' in (codex_desktop_cleanup_device.json.tags | default([]))"
    fail_msg: Refusing deletion because the recorded device does not match the desktop hostname, device ID, and tag:codex.
  when: codex_desktop_cleanup_device.status == 200

- name: Delete the validated desktop device
  ansible.builtin.uri:
    url: "{{ codex_desktop_tailscale_api_url | default('https://api.tailscale.com/api/v2') }}/device/{{ codex_desktop_cleanup_device_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ codex_desktop_cleanup_oauth.json.access_token }}"
    status_code:
      - 200
      - 204
      - 404
  register: codex_desktop_cleanup_delete
  changed_when: codex_desktop_cleanup_delete.status != 404
  when: codex_desktop_cleanup_device.status == 200
  no_log: true

- name: Verify that the device is absent from the tailnet
  ansible.builtin.uri:
    url: "{{ codex_desktop_tailscale_api_url | default('https://api.tailscale.com/api/v2') }}/device/{{ codex_desktop_cleanup_device_id }}"
    headers:
      Authorization: "Bearer {{ codex_desktop_cleanup_oauth.json.access_token }}"
    status_code:
      - 200
      - 404
  register: codex_desktop_cleanup_verified
  until: codex_desktop_cleanup_verified.status == 404
  retries: 5
  delay: 2
  when: codex_desktop_cleanup_device.status == 200
  no_log: true
