---
- name: Release only this job's desktop operation lease
  kubernetes.core.k8s_json_patch:
    api_version: coordination.k8s.io/v1
    kind: Lease
    name: "{{ codex_desktop_name }}-operation"
    namespace: "{{ codex_desktop_namespace }}"
    patch:
      - op: test
        path: /spec/holderIdentity
        value: "{{ codex_desktop_operation_id }}"
      - op: remove
        path: /spec/holderIdentity
  when: codex_desktop_operation_owned | default(false)

- name: Clear local lease ownership
  ansible.builtin.set_fact:
    codex_desktop_operation_owned: false
