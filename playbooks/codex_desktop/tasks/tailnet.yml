---
- name: Read the retained tailnet enrollment state
  ansible.builtin.command: tailscale status --json
  register: codex_desktop_tailnet_status
  changed_when: false
  # An unenrolled daemon returns a nonzero exit code but still reports JSON.
  failed_when: codex_desktop_tailnet_status.rc not in [0, 1]

- name: Read retained enrollment bookkeeping
  kubernetes.core.k8s_info:
    kind: PersistentVolumeClaim
    name: "{{ codex_desktop_state_name }}"
    namespace: "{{ codex_desktop_namespace }}"
  delegate_to: localhost
  become: false
  register: codex_desktop_tailnet_state

- name: Reset enrollment after a previous permanent deprovision
  ansible.builtin.include_tasks: reset_tailnet.yml
  vars:
    codex_desktop_retired_device_id: >-
      {{ (codex_desktop_tailnet_state.resources[0].metadata.annotations | default({}))
         .get('codex-desktop.igou.io/tailscale-device-id', '') }}
  when: >-
    (codex_desktop_tailnet_state.resources[0].metadata.annotations | default({}))
    .get('codex-desktop.igou.io/tailscale-retired', '') == 'true'

- name: Enroll only a guest that needs authentication
  when: (codex_desktop_tailnet_status.stdout | from_json).BackendState == 'NeedsLogin'
  block:
    - name: Mint an OAuth access token on the controller
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/oauth/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ codex_desktop_tailscale_credentials.client_id_lookup }}"
          client_secret: "{{ codex_desktop_tailscale_credentials.client_secret_lookup }}"
          scope: auth_keys
      delegate_to: localhost
      become: false
      register: codex_desktop_oauth_response
      no_log: true

    - name: Create a single-use short-lived tagged join key
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/keys
        method: POST
        status_code: 200
        headers:
          Authorization: "Bearer {{ codex_desktop_oauth_response.json.access_token }}"
        body_format: json
        body:
          expirySeconds: 3600
          description: codex-desktop rollout
          capabilities:
            devices:
              create:
                reusable: false
                ephemeral: false
                preauthorized: true
                tags:
                  - tag:codex
      delegate_to: localhost
      become: false
      register: codex_desktop_join_response
      no_log: true

    - name: Pass only the join key into the guest role
      ansible.builtin.include_role:
        name: fedora_desktop
        tasks_from: tailscale_join
      vars:
        fedora_desktop_tailscale_authkey: "{{ codex_desktop_join_response.json.key }}"
      no_log: true

- name: Read the authenticated device identity
  ansible.builtin.command: tailscale status --json
  register: codex_desktop_enrolled_status
  changed_when: false

- name: Require a usable identity before recording enrollment
  vars:
    codex_desktop_enrolled_device: "{{ codex_desktop_enrolled_status.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - codex_desktop_enrolled_device.BackendState == 'Running'
      - codex_desktop_enrolled_device.Self.ID is match('^[A-Za-z0-9]+$')

- name: Record the non-secret device ID on the retained state disk
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ codex_desktop_state_name }}"
        namespace: "{{ codex_desktop_namespace }}"
        annotations:
          codex-desktop.igou.io/tailscale-device-id: "{{ (codex_desktop_enrolled_status.stdout | from_json).Self.ID }}"
          codex-desktop.igou.io/tailscale-retired: null
  delegate_to: localhost
  become: false

- name: Expose T3 through the existing Tailscale Serve role
  ansible.builtin.include_role:
    name: tailscale_serve
  vars:
    tailscale_serve_port: "{{ fedora_desktop_t3_port | default(3773) }}"
