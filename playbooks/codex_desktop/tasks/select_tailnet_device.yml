---
- name: Read the recorded Tailscale device identity
  ansible.builtin.set_fact:
    codex_desktop_recorded_device_id: >-
      {{ (codex_desktop_state_pvc.resources[0].metadata.annotations | default({}))
         .get('codex-desktop.igou.io/tailscale-device-id', '') }}

- name: Resolve the requested device identity
  ansible.builtin.set_fact:
    codex_desktop_cleanup_device_id: >-
      {{ codex_desktop_tailscale_device_id | default(codex_desktop_recorded_device_id, true) }}

- name: Require a recorded device before stopping the desktop
  ansible.builtin.assert:
    that:
      - codex_desktop_cleanup_device_id is match('^[A-Za-z0-9]+$')
      - codex_desktop_recorded_device_id | length == 0 or codex_desktop_cleanup_device_id == codex_desktop_recorded_device_id
    fail_msg: Run desktop setup once to record enrollment, or supply its exact codex_desktop_tailscale_device_id for an unrecorded installation. An override must match any recorded ID; names never select deletion targets.
