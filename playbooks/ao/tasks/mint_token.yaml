---
# Mint a short-lived AO (automation-orchestrator) bearer token using the
# OAuth 2.0 client-credentials grant (RFC 6749 §4.4), and publish it as
# `ao_token` for the including play.
#
# 1Password contract (item `ao-approvals-bridge`, vault `lab_aap`):
#   field `username` -> OAuth client_id
#   field `password` -> OAuth client_secret
# The item belongs to the `approvals-bridge` service account, which holds
# project-admin on the default AO project.
#
# Tokens live ~15 minutes, which comfortably covers a digest or a single
# decision, so nothing here refreshes. Every task that touches the secret or
# the minted token is no_log; failures are re-surfaced through an explicit
# fail task that prints only the HTTP status and the transport message.
- name: Resolve the approvals-bridge client credentials from 1Password
  ansible.builtin.set_fact:
    _ao_client_id: "{{ lookup('community.general.onepassword', ao_op_item, field='username', vault=ao_op_vault) }}"
    _ao_client_secret: "{{ lookup('community.general.onepassword', ao_op_item, field='password', vault=ao_op_vault) }}"
  no_log: true

- name: Assert both credential fields resolved
  ansible.builtin.assert:
    that:
      - _ao_client_id | default('') | length > 0
      - _ao_client_secret | default('') | length > 0
    fail_msg: >-
      1Password item '{{ ao_op_item }}' in vault '{{ ao_op_vault }}' did not
      yield both a `username` (client_id) and a `password` (client_secret).
    success_msg: "Client credentials resolved from op://{{ ao_op_vault }}/{{ ao_op_item }}"

- name: Exchange the client credentials for an access token
  ansible.builtin.uri:
    url: "{{ ao_api_url }}/api/v1/auth/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ _ao_client_id }}"
      client_secret: "{{ _ao_client_secret }}"
    return_content: true
    status_code: [200]
  register: _ao_token_result
  failed_when: false
  no_log: true

- name: Fail with the HTTP status when the token mint is rejected
  ansible.builtin.fail:
    msg: >-
      AO token mint failed against {{ ao_api_url }}/api/v1/auth/token —
      HTTP {{ _ao_token_result.status | default('no response') }}
      ({{ _ao_token_result.msg | default('no transport message') }}).
      Verify op://{{ ao_op_vault }}/{{ ao_op_item }} still matches the
      approvals-bridge service account's client credentials.
  when: _ao_token_result.status | default(0) | int != 200

- name: Publish the bearer token for the remaining API calls
  ansible.builtin.set_fact:
    ao_token: "{{ _ao_token_result.json.access_token }}"
  no_log: true
