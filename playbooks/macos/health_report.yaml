---
# Weekly health report and security audit for the Macs (AAP template:
# macos_health_report, schedule macos_health_report_weekly). Read-only: the
# settings baseline runs in check mode, so drift is reported, not fixed (run
# configure.yaml to fix it).
#
# A Mac that is asleep or off the network is reported as unreachable instead
# of failing the job.
#
# Each run also records a full snapshot of every Mac (tasks/snapshot.yaml:
# all processes, resources, disk, persistence, software, exposure, usability)
# to s3://macos-reports/<host>/<YYYY-MM-DD>.json, compares it with the
# previous one (tasks/snapshot_diff.yaml), and publishes the latest report as
# a web page (macos_report_web). Settings: igou-inventory
# group_vars/all/macos_report.yml.
#
# Requires the onepassword-connect-token credential on the job template: the
# become password, the S3 keys and the Slack token resolve through 1Password
# Connect. Publishing the page uses the template's SSH key on TrueNAS.
#
# Variables (inventory or extra_vars):
#   ansible_limit               host or group, default macos
#   macos_report_slack          post the summary to Slack, default true
#   macos_report_store          store the snapshot and publish the web page,
#                               default true (false for a local dry run)
#   slack_channel               default #igoucloud-aap-logs
#   macos_disk_used_warn_pct    default 85
#   macos_uptime_warn_days      default 30
#   macos_battery_cycles_warn   default 800
#   macos_backup_age_warn_days  default 7, checked only when Time Machine has a backup
#   macos_screen_lock_max_delay seconds; checks the SSH user's screen lock
#                               delay, so set it only where that user is the
#                               one at the keyboard
- name: Collect macOS health and security state
  hosts: "{{ ansible_limit | default('macos') }}"
  gather_facts: false
  vars:
    # Mask secret values in process arguments before the snapshot is stored.
    macos_snapshot_redactions:
      - pattern: '(?i)(--?[a-z0-9_-]*(token|passw(or)?d|secret|api[-_]?key|access[-_]?key|auth|credential|cookie|session)[a-z0-9_-]*[= ])\S+'
        replace: '\1<redacted>'
      - pattern: '(?i)([?&;][a-z0-9_-]*(token|key|secret|sig|signature|auth|password|code)[a-z0-9_-]*=)[^&\s]+'
        replace: '\1<redacted>'
      - pattern: '(?i)(authorization:?\s*(bearer|basic|token)?\s*)\S+'
        replace: '\1<redacted>'
      - pattern: '\b(xox[a-z]-|gh[opsu]_|github_pat_|glpat-|sk-|AKIA|ASIA)[A-Za-z0-9._/+=-]{8,}'
        replace: '<redacted>'
      # JWTs only: Apple services pass base64 JSON (also eyJ...) with -X.
      - pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+'
        replace: '<redacted>'
    macos_snapshot_args_max: 2048
    macos_snapshot_system_folders:
      - /Applications
      - /Library
      - /private/var
      - /Users/Shared
    macos_snapshot_boot_history: 50
    macos_snapshot_growth_warn_kb: 5242880
    macos_snapshot_growth_warn_pct: 20
    macos_swap_warn_mb: 2048
    macos_memory_free_warn_pct: 20
    macos_crash_warn_count: 5
  tasks:
    - name: Check whether the Mac is awake
      ansible.builtin.ping:
      register: macos_ping
      ignore_unreachable: true

    - name: Skip a Mac that is asleep or off the network
      ansible.builtin.meta: end_host
      when: macos_ping.unreachable | default(false)

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset:
          - min
          - hardware

    - name: Read hardware and battery details
      ansible.builtin.command:
        argv:
          - system_profiler
          - -json
          - SPHardwareDataType
          - SPPowerDataType
      register: macos_profiler
      changed_when: false

    - name: Read data volume usage
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - /System/Volumes/Data
      register: macos_df
      changed_when: false

    - name: Read internal disk SMART status
      ansible.builtin.command:
        argv:
          - diskutil
          - info
          - disk0
      register: macos_diskutil
      changed_when: false

    - name: Read the latest Time Machine backup
      ansible.builtin.command:
        argv:
          - tmutil
          - latestbackup
      become: true
      register: macos_tmutil
      changed_when: false
      failed_when: false

    - name: Read the security settings
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop:
        - name: FileVault
          argv:
            - fdesetup
            - status
          expect: FileVault is On
        - name: SIP
          argv:
            - csrutil
            - status
          expect: "status: enabled"
        - name: Gatekeeper
          argv:
            - spctl
            - --status
          expect: assessments enabled
      loop_control:
        label: "{{ item.name }}"
      register: macos_security
      changed_when: false
      failed_when: false

    - name: Check the Command Line Tools
      ansible.builtin.command:
        argv:
          - xcrun
          - --find
          - clang
      register: macos_clt
      changed_when: false
      failed_when: false

    - name: Read the packet capture group
      ansible.builtin.command:
        argv:
          - dscl
          - .
          - -read
          - /Groups/access_bpf
          - GroupMembership
      register: macos_bpf
      changed_when: false
      failed_when: false

    - name: Find an AirPlay Receiver listener
      ansible.builtin.command:
        argv:
          - lsof
          - -nP
          - -iTCP:7000
          - -sTCP:LISTEN
      become: true
      register: macos_airplay
      changed_when: false
      failed_when: false

    - name: Read the screen lock delay
      ansible.builtin.command:
        argv:
          - sysadminctl
          - -screenLock
          - status
      register: macos_screen_lock
      changed_when: false
      failed_when: false
      when: macos_screen_lock_max_delay is defined

    - name: Check the settings baseline for drift
      ansible.builtin.import_tasks: tasks/baseline.yaml
      check_mode: true

    - name: List pending updates
      ansible.builtin.import_tasks: tasks/pending_updates.yaml


    - name: Parse the collected state
      vars:
        macos_profile: "{{ macos_profiler.stdout | from_json }}"
      ansible.builtin.set_fact:
        macos_hardware: "{{ macos_profile.SPHardwareDataType | first }}"
        macos_battery: >-
          {{ macos_profile.SPPowerDataType
             | selectattr('sppower_battery_health_info', 'defined')
             | map(attribute='sppower_battery_health_info') | first | default({}) }}
        macos_disk_used_pct: "{{ macos_df.stdout_lines[-1].split()[4] | replace('%', '') | int }}"
        macos_smart_status: "{{ macos_diskutil.stdout | regex_search('SMART Status:\\s*(.+)', '\\1') | default(['unknown'], true) | first | trim }}"
        macos_uptime_days: "{{ ((ansible_facts['uptime_seconds'] | default(0)) / 86400) | int }}"
        macos_backup_date: "{{ macos_tmutil.stdout | regex_search('\\d{4}-\\d{2}-\\d{2}') | default('', true) }}"
        macos_bpf_members: "{{ macos_bpf.stdout | regex_replace('^GroupMembership:', '') | trim if macos_bpf.rc == 0 else '' }}"
        macos_screen_lock_delay: >-
          {{ ((macos_screen_lock.stdout | default('')) ~ (macos_screen_lock.stderr | default('')))
             | regex_findall('delay is ([0-9]+) seconds') | default(['0'], true) | first }}
        macos_critical: []
        macos_warnings: []

    - name: Collect the weekly snapshot
      ansible.builtin.import_tasks: tasks/snapshot.yaml

    - name: Fetch the previous snapshot
      ansible.builtin.include_tasks: tasks/snapshot_history.yaml
      vars:
        macos_snapshot_history_action: fetch
      when: macos_report_store | default(true) | bool

    - name: Default to no previous snapshot
      ansible.builtin.set_fact:
        macos_snapshot_previous: "{{ macos_snapshot_previous | default({}) }}"
      no_log: true

    - name: Compare with the previous snapshot
      ansible.builtin.import_tasks: tasks/snapshot_diff.yaml

    - name: Record failed security checks
      ansible.builtin.set_fact:
        macos_critical: "{{ macos_critical + [item.item.name ~ ': ' ~ (item.stdout ~ item.stderr) | trim] }}"
      loop: "{{ macos_security.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.expect not in (item.stdout ~ item.stderr)

    - name: Record other findings
      ansible.builtin.set_fact:
        macos_critical: "{{ macos_critical + ([item.message] if item.level == 'critical' else []) }}"
        macos_warnings: "{{ macos_warnings + ([item.message] if item.level == 'warn' else []) }}"
      loop:
        - level: critical
          message: "SMART status {{ macos_smart_status }}"
          found: "{{ macos_smart_status != 'Verified' }}"
        - level: warn
          message: "battery {{ macos_battery.sppower_battery_health | default('unknown') }}"
          found: "{{ macos_battery | length > 0 and macos_battery.sppower_battery_health not in ['Good', 'Normal'] }}"
        - level: warn
          message: "battery at {{ macos_battery.sppower_battery_cycle_count | default(0) }} cycles"
          found: "{{ macos_battery.sppower_battery_cycle_count | default(0) | int >= macos_battery_cycles_warn | default(800) | int }}"
        - level: warn
          message: "disk {{ macos_disk_used_pct }}% used"
          found: "{{ macos_disk_used_pct | int >= macos_disk_used_warn_pct | default(85) | int }}"
        - level: warn
          message: Command Line Tools broken (xcrun cannot find clang)
          found: "{{ macos_clt.rc != 0 }}"
        - level: warn
          message: "access_bpf lets {{ macos_bpf_members }} capture packets without sudo (Wireshark ChmodBPF)"
          found: "{{ macos_bpf_members | length > 0 }}"
        - level: warn
          message: AirPlay Receiver listening on tcp/7000
          found: "{{ macos_airplay.stdout | trim | length > 0 }}"
        - level: warn
          message: "screen locks {{ macos_screen_lock_delay }}s after sleep or screen saver"
          found: "{{ macos_screen_lock_delay | int > macos_screen_lock_max_delay | default(0) | int }}"
        - level: warn
          message: "swap at {{ macos_snapshot.resources.memory.swap_used_mb | int }} MB"
          found: "{{ macos_snapshot.resources.memory.swap_used_mb | float >= macos_swap_warn_mb | float }}"
        - level: warn
          message: "only {{ macos_snapshot.resources.memory.free_pct }}% memory free"
          found: >-
            {{ macos_snapshot.resources.memory.free_pct | int >= 0
               and macos_snapshot.resources.memory.free_pct | int < macos_memory_free_warn_pct | int }}
        - level: critical
          message: "kernel panic this week: {{ macos_snapshot.usability.diagnostics | selectattr('kind', 'equalto', 'panic') | map(attribute='file') | join(', ') }}"
          found: "{{ macos_snapshot.usability.diagnostics | selectattr('kind', 'equalto', 'panic') | list | length > 0 }}"
        - level: warn
          message: "{{ macos_snapshot.usability.diagnostics | selectattr('kind', 'equalto', 'jetsam') | list | length }} low-memory kills (Jetsam) this week"
          found: "{{ macos_snapshot.usability.diagnostics | selectattr('kind', 'equalto', 'jetsam') | list | length > 0 }}"
        - level: warn
          message: "up {{ macos_uptime_days }} days, restart to finish updates"
          found: "{{ macos_uptime_days | int >= macos_uptime_warn_days | default(30) | int }}"
        - level: warn
          message: "last Time Machine backup {{ macos_backup_date }}"
          found: >-
            {{ macos_backup_date | length > 0
               and (now() - (macos_backup_date | to_datetime('%Y-%m-%d'))).days
                   >= macos_backup_age_warn_days | default(7) | int }}
        - level: warn
          message: >-
            settings drift: {{ (macos_baseline_system_defaults.results + macos_baseline_user_defaults.results)
            | selectattr('changed') | map(attribute='item.key')
            | union(macos_baseline_drift | map(attribute='name')) | join(', ') }}
          found: >-
            {{ (macos_baseline_system_defaults.results + macos_baseline_user_defaults.results)
               | selectattr('changed') | list | length > 0 or macos_baseline_drift | length > 0 }}
      loop_control:
        label: "{{ item.message }}"
      when: item.found | bool

    - name: Record frequent crash and hang reports
      ansible.builtin.set_fact:
        macos_warnings: "{{ macos_warnings + [item.key ~ ': ' ~ item.value ~ ' crash or resource reports this week'] }}"
      loop: >-
        {{ macos_snapshot.usability.diagnostics | rejectattr('kind', 'in', ['panic', 'jetsam'])
           | map(attribute='process') | community.general.counter | dict2items
           | selectattr('value', 'gt', macos_crash_warn_count | int) | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Record this week's warning and critical changes
      ansible.builtin.set_fact:
        macos_critical: "{{ macos_critical + (macos_changes | selectattr('level', 'equalto', 'critical') | map(attribute='text') | list) }}"
        macos_warnings: >-
          {{ macos_warnings + (macos_changes | selectattr('level', 'equalto', 'warn') | map(attribute='text') | list)
             + (macos_snapshot_history_errors | default([])) }}

    - name: Summarize the Mac
      ansible.builtin.set_fact:
        macos_health:
          status: "{{ 'critical' if macos_critical else ('warn' if macos_warnings else 'ok') }}"
          findings: "{{ macos_critical + macos_warnings }}"
          summary: >-
            macOS {{ ansible_facts['distribution_version'] }} on
            {{ macos_hardware.machine_name }} ({{ macos_hardware.chip_type | default(macos_hardware.cpu_type | default('')) }}),
            serial {{ macos_hardware.serial_number }}, up {{ macos_uptime_days }}d,
            disk {{ macos_disk_used_pct }}%, battery
            {{ macos_battery.sppower_battery_health | default('n/a') }}
            {{ macos_battery.sppower_battery_cycle_count | default('?') }} cycles
            {{ macos_battery.sppower_battery_health_maximum_capacity | default('') }},
            {{ macos_pending_updates | length }} updates pending
            ({{ macos_restart_updates | length }} need a restart),
            last backup {{ macos_backup_date | default('unknown', true) }}
          changes: "{{ macos_changes | selectattr('level', 'equalto', 'info') | map(attribute='text') | list }}"
          previous: "{{ macos_snapshot_previous.collected_at | default('') }}"

    - name: Add the findings to the snapshot
      ansible.builtin.set_fact:
        macos_snapshot: "{{ macos_snapshot | combine({'health': macos_health, 'changes': macos_changes}) }}"
      no_log: true

    - name: Store the snapshot
      ansible.builtin.include_tasks: tasks/snapshot_history.yaml
      vars:
        macos_snapshot_history_action: store
      when: macos_report_store | default(true) | bool

- name: Report macOS health
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    macos_report_hosts: "{{ query('inventory_hostnames', ansible_limit | default('macos')) }}"
    macos_report_changes_max: 10
    macos_report_history_errors: >-
      {{ macos_report_hosts | map('extract', hostvars, 'macos_snapshot_history_errors') | select('defined') | flatten }}
    macos_report_emoji:
      ok: ":large_green_circle:"
      warn: ":large_yellow_circle:"
      critical: ":red_circle:"
      unreachable: ":white_circle:"
  tasks:
    - name: Build the report
      ansible.builtin.set_fact:
        macos_report: |-
          *macOS health report*
          {% for host in macos_report_hosts %}
          {% set r = hostvars[host].macos_health | default({'status': 'unreachable', 'summary': 'asleep or off the network', 'findings': []}) %}
          {{ macos_report_emoji[r.status] }} *{{ host }}*: {{ r.summary }}
          {% for finding in r.findings %}
              • {{ finding }}
          {% endfor %}
          {% if r.status != 'unreachable' %}
          {% if r.previous %}
          {% if r.changes %}
              _{{ r.changes | length }} other changes since {{ r.previous[:10] }}:_
          {% for change in r.changes[:macos_report_changes_max] %}
              ◦ {{ change }}
          {% endfor %}
          {% if r.changes | length > macos_report_changes_max %}
              ◦ … and {{ r.changes | length - macos_report_changes_max }} more
          {% endif %}
          {% endif %}
          {% else %}
              _first snapshot recorded; changes are reported from next week_
          {% endif %}
          {% endif %}
          {% endfor %}
          {% if macos_report_store | default(true) | bool %}
          <{{ macos_report_web.url }}|Full report>
          {% endif %}

    - name: Show the report
      ansible.builtin.debug:
        msg: "{{ macos_report.split('\n') }}"

    - name: Post the report to Slack
      community.general.slack:
        token: "{{ slack_notification_token }}"
        channel: "{{ slack_channel | default('#igoucloud-aap-logs') }}"
        msg: "{{ macos_report }}"
      no_log: true
      when: macos_report_slack | default(true) | bool

    - name: Publish the report page
      ansible.builtin.template:
        src: templates/macos_report.html.j2
        dest: "{{ macos_report_web.dir }}/index.html"
        owner: "{{ macos_report_web.owner }}"
        group: "{{ macos_report_web.group }}"
        mode: "0644"
      delegate_to: "{{ macos_report_web.host }}"
      connection: ssh
      become: true
      when: macos_report_store | default(true) | bool
      no_log: true

    - name: Fail when the snapshot history could not be used
      ansible.builtin.fail:
        msg: "{{ macos_report_history_errors | join('; ') }}"
      when: macos_report_history_errors | length > 0
