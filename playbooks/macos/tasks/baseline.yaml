---
# Settings baseline shared by configure.yaml, which applies it, and
# health_report.yaml, which imports it with check_mode: true to report drift.
# Reads run even in check mode; changes are queued in macos_baseline_drift
# and applied by the final task, which check mode skips.
#
# Inputs (inventory):
#   macos_system_defaults  list of {domain, key, type, value, host} written as
#                          root; host is optional (currentHost for ByHost prefs)
#   macos_user_defaults    same shape, written as the SSH user
#   macos_pmset            map of pmset setting -> value, applied with -a
#   macos_pmset_ac         same, applied with -c (on the charger only)
#   macos_sshd_allow_from  addresses the SSH user may log in from, rendered to
#                          AllowUsers in /etc/ssh/sshd_config.d/100-igou.conf
#                          (validated with sshd -t before it is written)
#   macos_maintenance_window
#                          {weekday (launchd numbering, 0 = Sunday), start
#                          "HH:MM", minutes, state (present|absent)}: a
#                          repeating pmset wake at start plus a launchd job
#                          that holds the Mac awake on the charger for
#                          `minutes` (caffeinate -s), so scheduled jobs reach
#                          a Mac with its lid closed. On battery the Mac
#                          wakes briefly and sleeps again.
# The application firewall and its stealth mode are always turned on.
- name: Set system preferences
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    host: "{{ item.host | default(omit) }}"
    state: present
  become: true
  loop: "{{ macos_system_defaults | default([]) }}"
  loop_control:
    label: "{{ item.domain | basename }} {{ item.key }}"
  register: macos_baseline_system_defaults

- name: Set user preferences
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    host: "{{ item.host | default(omit) }}"
    state: present
  loop: "{{ macos_user_defaults | default([]) }}"
  loop_control:
    label: "{{ item.domain | basename }} {{ item.key }}"
  register: macos_baseline_user_defaults

- name: Read the application firewall state
  ansible.builtin.command:
    argv:
      - /usr/libexec/ApplicationFirewall/socketfilterfw
      - "{{ item.query }}"
  loop:
    - name: firewall
      query: --getglobalstate
      enable: --setglobalstate
    - name: firewall stealth mode
      query: --getstealthmode
      enable: --setstealthmode
  loop_control:
    label: "{{ item.name }}"
  register: macos_baseline_firewall
  changed_when: false
  check_mode: false

- name: Read the power settings
  ansible.builtin.command:
    argv:
      - pmset
      - -g
      - custom
  register: macos_baseline_pmset
  changed_when: false
  check_mode: false
  when: (macos_pmset | default({}) | combine(macos_pmset_ac | default({}))) | length > 0

- name: Reset the queued changes
  ansible.builtin.set_fact:
    macos_baseline_drift: []

- name: Queue firewall changes
  ansible.builtin.set_fact:
    macos_baseline_drift: >-
      {{ macos_baseline_drift + [{
           'name': item.item.name ~ ' on',
           'argv': ['/usr/libexec/ApplicationFirewall/socketfilterfw', item.item.enable, 'on']}] }}
  loop: "{{ macos_baseline_firewall.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout is not search('enabled|is on')

- name: Queue power setting changes
  ansible.builtin.set_fact:
    macos_baseline_drift: >-
      {{ macos_baseline_drift + [{
           'name': 'pmset ' ~ item.key ~ ' ' ~ item.value,
           'argv': ['pmset', '-a', item.key, item.value | string]}] }}
  loop: "{{ macos_pmset | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    macos_baseline_pmset.stdout
    | regex_findall('(?m)^\s*' ~ item.key ~ '\s+(\S+)')
    | difference([item.value | string])
    | length > 0

- name: Queue charger power setting changes
  ansible.builtin.set_fact:
    macos_baseline_drift: >-
      {{ macos_baseline_drift + [{
           'name': 'pmset -c ' ~ item.key ~ ' ' ~ item.value,
           'argv': ['pmset', '-c', item.key, item.value | string]}] }}
  loop: "{{ macos_pmset_ac | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    macos_baseline_pmset.stdout.split('AC Power:') | last
    | regex_findall('(?m)^\s*' ~ item.key ~ '\s+(\S+)')
    | difference([item.value | string])
    | length > 0

- name: Read the scheduled power events
  ansible.builtin.command:
    argv:
      - pmset
      - -g
      - sched
  register: macos_baseline_sched
  changed_when: false
  check_mode: false
  when: macos_maintenance_window is defined

- name: Queue the maintenance window wake
  vars:
    __macos_window: "{{ macos_maintenance_window }}"
    __macos_hour: "{{ __macos_window.start.split(':')[0] | int }}"
    __macos_minute: "{{ __macos_window.start.split(':')[1] }}"
    __macos_day: "{{ 'UMTWRFSU'[__macos_window.weekday | int] }}"
    __macos_day_name: >-
      {{ ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][__macos_window.weekday | int] }}
    __macos_listed: >-
      wakepoweron at {{ (__macos_hour | int - 1) % 12 + 1 }}:{{ __macos_minute }}{{ 'PM' if __macos_hour | int >= 12 else 'AM' }} {{ __macos_day_name }}
  ansible.builtin.set_fact:
    macos_baseline_drift: >-
      {{ macos_baseline_drift + [{
           'name': 'pmset repeat wakeorpoweron ' ~ __macos_day ~ ' ' ~ __macos_window.start ~ ':00',
           'argv': ['pmset', 'repeat', 'wakeorpoweron', __macos_day, __macos_window.start ~ ':00']}] }}
  when:
    - macos_maintenance_window is defined
    - macos_maintenance_window.state | default('present') == 'present'
    - __macos_listed not in macos_baseline_sched.stdout

- name: Queue removal of the maintenance window wake
  ansible.builtin.set_fact:
    macos_baseline_drift: >-
      {{ macos_baseline_drift + [{'name': 'pmset repeat cancel', 'argv': ['pmset', 'repeat', 'cancel']}] }}
  when:
    - macos_maintenance_window is defined
    - macos_maintenance_window.state | default('present') == 'absent'
    - "'Repeating power events' in macos_baseline_sched.stdout"

- name: Apply the queued changes
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  become: true
  loop: "{{ macos_baseline_drift }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Configure SSH access
  ansible.builtin.template:
    src: templates/sshd_igou.conf.j2
    dest: /etc/ssh/sshd_config.d/100-igou.conf
    owner: root
    group: wheel
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s -h /etc/ssh/ssh_host_ed25519_key
  become: true
  register: macos_baseline_sshd
  when: macos_sshd_allow_from is defined

- name: Install the maintenance window job
  ansible.builtin.template:
    src: templates/maintenance_window.plist.j2
    dest: /Library/LaunchDaemons/systems.igou.maintenance-window.plist
    owner: root
    group: wheel
    mode: "0644"
    validate: /usr/bin/plutil -lint %s
  become: true
  register: macos_baseline_window_plist
  when:
    - macos_maintenance_window is defined
    - macos_maintenance_window.state | default('present') == 'present'

- name: Check whether the maintenance window job is loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - print
      - system/systems.igou.maintenance-window
  become: true
  register: macos_baseline_window_loaded
  changed_when: false
  failed_when: false
  check_mode: false
  when: macos_maintenance_window is defined

- name: Unload the maintenance window job
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - system/systems.igou.maintenance-window
  become: true
  changed_when: true
  when:
    - macos_maintenance_window is defined
    - macos_baseline_window_loaded.rc == 0
    - >-
      macos_baseline_window_plist is changed
      or macos_maintenance_window.state | default('present') == 'absent'

- name: Remove the maintenance window job
  ansible.builtin.file:
    path: /Library/LaunchDaemons/systems.igou.maintenance-window.plist
    state: absent
  become: true
  when:
    - macos_maintenance_window is defined
    - macos_maintenance_window.state | default('present') == 'absent'

- name: Load the maintenance window job
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - system
      - /Library/LaunchDaemons/systems.igou.maintenance-window.plist
  become: true
  changed_when: true
  when:
    - macos_maintenance_window is defined
    - macos_maintenance_window.state | default('present') == 'present'
    - macos_baseline_window_plist is changed or macos_baseline_window_loaded.rc != 0

- name: Record the changed baseline files
  ansible.builtin.set_fact:
    macos_baseline_changed_files: >-
      {{ (['sshd AllowUsers'] if macos_baseline_sshd is changed else [])
         + (['maintenance window job'] if macos_maintenance_window is defined
              and macos_maintenance_window.state | default('present') == 'present'
              and (macos_baseline_window_plist is changed or macos_baseline_window_loaded.rc != 0) else []) }}
