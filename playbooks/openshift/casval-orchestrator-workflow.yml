---
name: casval-lease
edges:
  - from: start
    to: scale_up
  - from: scale_up
    to: lease_acquired
  - from: lease_acquired
    from_port: 'true'
    to: tier
  - from: lease_acquired
    from_port: 'true'
    to: notify_start
  - to: hold_2h
    from: tier
    from_port: h2
  - to: hold_4h
    from: tier
    from_port: h4
  - to: hold_8h
    from: tier
    from_port: h8
  - to: hold_12h
    from: tier
    from_port: h12
  - to: hold_24h
    from: tier
    from_port: h24
  - to: hold_fb
    from: tier
    from_port: fallback
  - from: hold_2h
    to: grace
  - from: hold_2h
    to: check_owner
  - from: hold_4h
    to: grace
  - from: hold_4h
    to: check_owner
  - from: hold_8h
    to: grace
  - from: hold_8h
    to: check_owner
  - from: hold_12h
    to: grace
  - from: hold_12h
    to: check_owner
  - from: hold_24h
    to: grace
  - from: hold_24h
    to: check_owner
  - from: hold_fb
    to: grace
  - from: hold_fb
    to: check_owner
  - from: check_owner
    to: owner_check_ok
  - from: still_owner
    from_port: 'true'
    to: notify_warn
  - from: grace
    to: scale_down
  - from: scale_down
    to: released
  - from: released
    from_port: 'true'
    to: notify_done
  - from: owner_check_ok
    from_port: 'true'
    to: still_owner
nodes:
  - id: scale_up
    name: Lease casval and wait for Ready
    type: aap_job_template
    position:
      x: 250
      y: 300
    parameters:
      extra_vars:
        casval_state: up
        casval_lease_id: ${workflow_context.execution.id}
        casval_lease: ${trigger.lease}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: casval_scale
      organization_name: igou
  - id: notify_start
    name: Notify (notify_start)
    type: aap_job_template
    position:
      x: 500
      y: 300
    settings:
      continue_on_failure: true
      timeout: 60
      retry_policy:
        max_retries: 0
    parameters:
      extra_vars:
        notify_title: 'casval lease: started'
        notify_status: ok
        notify_message: casval is Ready (${scale_up.artifacts.casval_node}). Lease ${trigger.lease}; expires approximately ${scale_up.artifacts.casval_expires_at}. A shorter renewal preserves the existing lease.
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: tier
    name: Lease tier
    type: switch
    position:
      x: 750
      y: 300
    parameters:
      cases:
        - port: h2
          label: 2h
          condition: ${trigger.lease} == '2h'
        - port: h4
          label: 4h
          condition: ${trigger.lease} == '4h'
        - port: h8
          label: 8h
          condition: ${trigger.lease} == '8h'
        - port: h12
          label: 12h
          condition: ${trigger.lease} == '12h'
        - port: h24
          label: 24h
          condition: ${trigger.lease} == '24h'
      default_port: fallback
  - id: hold_2h
    name: Hold 2h
    type: wait
    position:
      x: 1000
      y: 100
    parameters:
      duration: 6600
  - id: hold_4h
    name: Hold 4h
    type: wait
    position:
      x: 1000
      y: 240
    parameters:
      duration: 13800
  - id: hold_8h
    name: Hold 8h
    type: wait
    position:
      x: 1000
      y: 380
    parameters:
      duration: 28200
  - id: hold_12h
    name: Hold 12h
    type: wait
    position:
      x: 1000
      y: 520
    parameters:
      duration: 42600
  - id: hold_24h
    name: Hold 24h
    type: wait
    position:
      x: 1000
      y: 660
    parameters:
      duration: 85800
  - id: hold_fb
    name: Hold fallback 4h
    type: wait
    position:
      x: 1000
      y: 800
    parameters:
      duration: 13800
  - id: notify_warn
    name: Notify (notify_warn)
    type: aap_job_template
    position:
      x: 1250
      y: 300
    settings:
      continue_on_failure: true
      timeout: 60
      retry_policy:
        max_retries: 0
    parameters:
      extra_vars:
        notify_title: 'casval lease: ending in 10m'
        notify_status: warn
        notify_message: casval lease expires approximately ${check_owner.artifacts.casval_expires_at}. Re-run casval-lease to extend; shorter requests preserve the current lease.
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: grace
    name: Grace 10m
    type: wait
    position:
      x: 1500
      y: 300
    parameters:
      duration: 600
  - id: scale_down
    name: Release casval if lease owner
    type: aap_job_template
    position:
      x: 1750
      y: 300
    parameters:
      extra_vars:
        casval_state: down
        casval_lease_id: ${workflow_context.execution.id}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: casval_scale
      organization_name: igou
  - id: notify_done
    name: Notify (notify_done)
    type: aap_job_template
    position:
      x: 2000
      y: 300
    settings:
      continue_on_failure: true
      timeout: 60
      retry_policy:
        max_retries: 0
    parameters:
      extra_vars:
        notify_title: 'casval lease: ended'
        notify_status: ok
        notify_message: 'casval released: Machine deleted and BareMetalHost verified powered off and available.'
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: lease_acquired
    name: New lease acquired?
    type: condition
    position:
      x: 500
      y: 300
    parameters:
      condition: ${scale_up.artifacts.casval_label} == 'up'
  - id: still_owner
    name: Lease still active?
    type: condition
    position:
      x: 1250
      y: 50
    parameters:
      condition: ${check_owner.artifacts.casval_label} == 'active'
  - id: released
    name: Host released?
    type: condition
    position:
      x: 1900
      y: 300
    parameters:
      condition: ${scale_down.artifacts.casval_label} == 'down'
  - id: check_owner
    name: Check lease before warning
    type: aap_job_template
    position:
      x: 1100
      y: 50
    parameters:
      extra_vars:
        casval_state: status
        casval_lease_id: ${workflow_context.execution.id}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: casval_scale
      organization_name: igou
    settings:
      timeout: 60
      retry_policy:
        max_retries: 0
      continue_on_failure: true
  - id: owner_check_ok
    name: Ownership check succeeded?
    type: condition
    position:
      x: 1180
      y: 50
    parameters:
      condition: ${check_owner.status} == 'completed'
triggers:
  - id: start
    name: Start lease
    type: manual_trigger
    position:
      x: 0
      y: 300
    parameters:
      input_schema:
        type: object
        required:
          - lease
        properties:
          lease:
            enum:
              - 2h
              - 4h
              - 8h
              - 12h
              - 24h
            type: string
            title: Lease length
            default: 4h
description: On-demand casval lease with renewal that cannot shorten an active lease. The selected duration includes the ten-minute warning window. Notifications run on separate bounded branches; superseded notices are suppressed and release verifies physical power-off.
schema_version: 2.0.0
