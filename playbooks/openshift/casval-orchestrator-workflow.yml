---
name: casval-lease
edges:
  - to: scale_up
    from: start
  - to: notify_start
    from: scale_up
  - to: tier
    from: notify_start
  - to: hold_2h
    from: tier
    from_port: h2
  - to: hold_4h
    from: tier
    from_port: h4
  - to: hold_8h
    from: tier
    from_port: h8
  - to: hold_12h
    from: tier
    from_port: h12
  - to: hold_24h
    from: tier
    from_port: h24
  - to: hold_fb
    from: tier
    from_port: fallback
  - to: notify_warn
    from: hold_2h
  - to: notify_warn
    from: hold_4h
  - to: notify_warn
    from: hold_8h
  - to: notify_warn
    from: hold_12h
  - to: notify_warn
    from: hold_24h
  - to: notify_warn
    from: hold_fb
  - to: grace
    from: notify_warn
  - to: scale_down
    from: grace
  - to: notify_done
    from: scale_down
nodes:
  - id: scale_up
    name: Lease casval and wait for Ready
    type: aap_job_template
    position:
      x: 250.0
      y: 300.0
    parameters:
      extra_vars:
        casval_state: up
        casval_lease_id: ${workflow_context.execution.id}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: casval_scale
      organization_name: igou
  - id: notify_start
    name: Notify (notify_start)
    type: aap_job_template
    position:
      x: 500.0
      y: 300.0
    settings:
      continue_on_failure: true
    parameters:
      extra_vars:
        notify_title: 'casval lease: started'
        notify_status: ok
        notify_message: casval is Ready (label ${scale_up.artifacts.casval_label}, node ${scale_up.artifacts.casval_node}). Lease ${trigger.lease}; re-run to extend safely.
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: tier
    name: Lease tier
    type: switch
    position:
      x: 750.0
      y: 300.0
    parameters:
      cases:
        - port: h2
          label: 2h
          condition: ${trigger.lease} == '2h'
        - port: h4
          label: 4h
          condition: ${trigger.lease} == '4h'
        - port: h8
          label: 8h
          condition: ${trigger.lease} == '8h'
        - port: h12
          label: 12h
          condition: ${trigger.lease} == '12h'
        - port: h24
          label: 24h
          condition: ${trigger.lease} == '24h'
      default_port: fallback
  - id: hold_2h
    name: Hold 2h
    type: wait
    position:
      x: 1000.0
      y: 100.0
    parameters:
      duration: 7200
  - id: hold_4h
    name: Hold 4h
    type: wait
    position:
      x: 1000.0
      y: 240.0
    parameters:
      duration: 14400
  - id: hold_8h
    name: Hold 8h
    type: wait
    position:
      x: 1000.0
      y: 380.0
    parameters:
      duration: 28800
  - id: hold_12h
    name: Hold 12h
    type: wait
    position:
      x: 1000.0
      y: 520.0
    parameters:
      duration: 43200
  - id: hold_24h
    name: Hold 24h
    type: wait
    position:
      x: 1000.0
      y: 660.0
    parameters:
      duration: 86400
  - id: hold_fb
    name: Hold fallback 4h
    type: wait
    position:
      x: 1000.0
      y: 800.0
    parameters:
      duration: 14400
  - id: notify_warn
    name: Notify (notify_warn)
    type: aap_job_template
    position:
      x: 1250.0
      y: 300.0
    settings:
      continue_on_failure: true
    parameters:
      extra_vars:
        notify_title: 'casval lease: ending in 10m'
        notify_status: warn
        notify_message: Lease expires in 10 minutes. To extend, run casval-lease again (idempotent scale-up + fresh timer).
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: grace
    name: Grace 10m
    type: wait
    position:
      x: 1500.0
      y: 300.0
    parameters:
      duration: 600
  - id: scale_down
    name: Release casval if lease owner
    type: aap_job_template
    position:
      x: 1750.0
      y: 300.0
    parameters:
      extra_vars:
        casval_state: down
        casval_lease_id: ${workflow_context.execution.id}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: casval_scale
      organization_name: igou
  - id: notify_done
    name: Notify (notify_done)
    type: aap_job_template
    position:
      x: 2000.0
      y: 300.0
    settings:
      continue_on_failure: true
    parameters:
      extra_vars:
        notify_title: 'casval lease: ended'
        notify_status: ok
        notify_message: casval lease release finished (label ${scale_down.artifacts.casval_label}, node ${scale_down.artifacts.casval_node}).
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
triggers:
  - id: start
    name: Start lease
    type: manual_trigger
    position:
      x: 0
      y: 300
    parameters:
      input_schema:
        type: object
        required:
          - lease
        properties:
          lease:
            enum:
              - 2h
              - 4h
              - 8h
              - 12h
              - 24h
            type: string
            title: Lease length
            default: 4h
description: 'Time-boxed on-demand GPU burst-worker lease: scale casval up, wait for Ready, hold a durable timer, warn, grace, then release. Overlapping runs are lease-fenced; re-run to extend safely.'
schema_version: 2.0.0
