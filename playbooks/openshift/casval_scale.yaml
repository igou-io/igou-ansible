---
# Lease (scale up) or release (scale down) the `casval` on-demand bare-metal
# GPU burst worker on the `ocp` cluster.
#
# Discovered scale mechanism (verified live 2026-08-20):
#   object : MachineSet cluster.x-k8s.io/v1beta2 `casval-worker`
#   ns     : openshift-cluster-api
#   field  : .spec.replicas (0 at rest, max 1)
# There is NO MachineDeployment in this cluster — the MachineSet *is* the
# CAPI node group, so it is the object this play scales. Chain:
# replicas 0->1 -> CAPM3 claims BareMetalHost `casval`,
# powers it on over Redfish virtual-media, installs RHCOS, the node joins
# as `casval.igou.systems` with label node-role.kubernetes.io/burst and
# taint workload=burst:NoSchedule.
#
# Replica ownership:
#   * The cluster-api autoscaler is not installed. This playbook is the only
#     supported writer of casval-worker .spec.replicas.
#   * The ArgoCD `cluster-api` app declares ignoreDifferences for MachineSet
#     /spec/replicas, so an active lease is not reverted by self-heal.
#   * A workflow run may pass casval_lease_id. Scale-up writes it to the
#     MachineSet; scale-down only proceeds if it still owns the lease. This
#     fences an older workflow timer from shutting down a newer lease.
#
# Safety: the target object name/namespace are FIXED in vars and asserted
# against a live fingerprint (name, namespace, infrastructureRef template,
# replica bound, burst label) before anything is patched. There is no var
# that lets a caller point this play at a different MachineSet.
#
# Auth: KUBECONFIG injected by the `ocp-kubeconfig` AAP credential
# (credential type "Kubeconfig File"), same as the openshift_vm_worker_*
# templates. kubernetes.core reads KUBECONFIG from the environment.
#
# Usage:
#   export KUBECONFIG=<ocp kubeconfig>
#   ansible-playbook playbooks/openshift/casval_scale.yaml \
#     -i igou-inventory/inventory.yaml -e casval_state=up
#
# Publishes set_stats (per_host: false) for downstream workflow nodes:
#   casval_label  up | down | superseded | timeout
#   casval_node   node name, or '' when there is no node
#   casval_detail short human-readable outcome

- name: Scale the casval bare-metal GPU burst worker
  hosts: "{{ target_cluster | default('ocp') }}"
  connection: local
  gather_facts: false
  vars:
    # FIXED target — do not parameterise. Asserted against the live object.
    casval_machineset_name: casval-worker
    casval_machineset_namespace: openshift-cluster-api
    casval_machineset_api_version: cluster.x-k8s.io/v1beta2
    casval_infra_template_name: casval-worker-template
    casval_set_selector: cluster.x-k8s.io/set-name=casval-worker
    casval_node_selector: node-role.kubernetes.io/burst
    casval_lease_annotation: automation.igou.systems/casval-lease-id
    # A cold Redfish virtual-media provision can take 20-25 minutes. Allow
    # 30 minutes, then roll replicas back to 0 and fail the job closed.
    casval_wait_retries: 60
    casval_wait_delay: 30
    casval_replica_map:
      up: 1
      down: 0
  tasks:

    - name: Assert casval_state is up or down
      ansible.builtin.assert:
        that: casval_state | default('', true) in ['up', 'down']
        fail_msg: >-
          casval_state must be 'up' or 'down'
          (got '{{ casval_state | default('<undefined>') }}').

    - name: Assert the optional lease identifier is safe
      ansible.builtin.assert:
        that:
          - casval_lease_id | default('') | length <= 128
          - casval_lease_id | default('') is match('^[A-Za-z0-9._-]*$')
        fail_msg: >-
          casval_lease_id is optional but must contain no more than 128
          alphanumeric, dot, underscore, or hyphen characters.

    - name: Read the casval-worker MachineSet
      kubernetes.core.k8s_info:
        api_version: "{{ casval_machineset_api_version }}"
        kind: MachineSet
        name: "{{ casval_machineset_name }}"
        namespace: "{{ casval_machineset_namespace }}"
      register: casval_machineset

    # Hard safety gate. Every field below is part of the casval burst node
    # group's identity; if any one of them fails to match, this is not the
    # object this playbook is allowed to scale.
    - name: Assert the MachineSet is the casval burst node group
      vars:
        casval_ms: "{{ (casval_machineset.resources | first) | default({}, true) }}"
      ansible.builtin.assert:
        that:
          - casval_machineset.resources | length == 1
          - casval_ms.metadata.name == casval_machineset_name
          - casval_ms.metadata.namespace == casval_machineset_namespace
          - casval_ms.spec.template.spec.infrastructureRef.name == casval_infra_template_name
          - casval_ms.spec.replicas | int in [0, 1]
          - "'node-role.kubernetes.io/burst' in casval_ms.spec.template.metadata.labels"
        fail_msg: >-
          {{ casval_machineset_namespace }}/{{ casval_machineset_name }} does not
          match the casval burst node group fingerprint — refusing to scale.

    - name: Resolve lease ownership
      vars:
        casval_ms: "{{ casval_machineset.resources | first }}"
      ansible.builtin.set_fact:
        casval_lease_owner_before: >-
          {{ (casval_ms.metadata.annotations | default({}))[casval_lease_annotation]
             | default('', true) }}
        casval_lease_owner: >-
          {{ casval_lease_id | default('manual', true) }}
        casval_scale_allowed: >-
          {{ casval_state == 'up'
             or (casval_lease_id | default('') | length == 0)
             or ((casval_ms.metadata.annotations | default({}))[casval_lease_annotation]
                 | default('', true)) == (casval_lease_id | default('')) }}

    - name: Find the current burst node
      kubernetes.core.k8s_info:
        kind: Node
        label_selectors:
          - "{{ casval_node_selector }}"
      register: casval_nodes_before

    # Informational only (release path): surface what is still running on
    # the burst node so an operator can see what a release will evict. The
    # CAPI pre-terminate hook plus the capi-node-cleanup CronJob cordon and
    # drain the node, so this check never blocks the release — hence
    # best-effort, not an assert.
    - name: Read pods still running on the burst node
      kubernetes.core.k8s_info:
        kind: Pod
        field_selectors:
          - "spec.nodeName={{ (casval_nodes_before.resources | first).metadata.name }}"
          - status.phase=Running
      when:
        - casval_state == 'down'
        - casval_nodes_before.resources | length > 0
      register: casval_pinned_pods

    - name: Show workload a release will evict (informational)
      vars:
        casval_evictable: >-
          {{ (casval_pinned_pods.resources | default([], true)
              | rejectattr('metadata.ownerReferences', 'defined') | list)
             + (casval_pinned_pods.resources | default([], true)
                | selectattr('metadata.ownerReferences', 'defined')
                | rejectattr('metadata.ownerReferences.0.kind', 'equalto', 'DaemonSet')
                | list) }}
      ansible.builtin.debug:
        msg: >-
          Non-DaemonSet pods still on the burst node
          ({{ casval_evictable | length }}):
          {{ casval_evictable | map(attribute='metadata.name') | list }}
      when:
        - casval_state == 'down'
        - casval_pinned_pods.resources is defined

    - name: Record the casval lease owner
      kubernetes.core.k8s:
        state: patched
        api_version: "{{ casval_machineset_api_version }}"
        kind: MachineSet
        name: "{{ casval_machineset_name }}"
        namespace: "{{ casval_machineset_namespace }}"
        definition:
          metadata:
            annotations:
              "{{ casval_lease_annotation }}": "{{ casval_lease_owner }}"
      when: casval_state == 'up'

    - name: Scale the casval-worker MachineSet
      kubernetes.core.k8s:
        state: patched
        api_version: "{{ casval_machineset_api_version }}"
        kind: MachineSet
        name: "{{ casval_machineset_name }}"
        namespace: "{{ casval_machineset_namespace }}"
        definition:
          spec:
            replicas: "{{ casval_replica_map[casval_state] | int }}"
      when: casval_scale_allowed

    - name: Wait for the burst node to go Ready
      kubernetes.core.k8s_info:
        kind: Node
        label_selectors:
          - "{{ casval_node_selector }}"
      register: casval_up_wait
      retries: "{{ casval_wait_retries }}"
      delay: "{{ casval_wait_delay }}"
      until: >-
        casval_up_wait.resources | default([], true)
        | map(attribute='status.conditions') | flatten
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0
      failed_when: false
      when: casval_state == 'up'

    - name: Wait for the casval Machine to be deleted
      kubernetes.core.k8s_info:
        api_version: "{{ casval_machineset_api_version }}"
        kind: Machine
        namespace: "{{ casval_machineset_namespace }}"
        label_selectors:
          - "{{ casval_set_selector }}"
      register: casval_down_wait
      retries: "{{ casval_wait_retries }}"
      delay: "{{ casval_wait_delay }}"
      until: casval_down_wait.resources | default([], true) | length == 0
      when:
        - casval_state == 'down'
        - casval_scale_allowed

    - name: Read the resulting Machine state
      kubernetes.core.k8s_info:
        api_version: "{{ casval_machineset_api_version }}"
        kind: Machine
        namespace: "{{ casval_machineset_namespace }}"
        label_selectors:
          - "{{ casval_set_selector }}"
      register: casval_machines_after

    - name: Resolve scale-up readiness
      ansible.builtin.set_fact:
        casval_up_ready: >-
          {{ casval_up_wait.resources | default([], true)
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True') | list | length > 0 }}

    - name: Resolve the outcome
      ansible.builtin.set_fact:
        # up   -> the burst node that came Ready
        # down -> '' once the Machine is gone; a superseded release reports
        #         the still-active node so the artifact names what it preserved.
        casval_node_name: >-
          {{ ((casval_up_wait.resources | default([], true)
               | map(attribute='metadata.name') | list | first) | default('', true))
             if casval_state == 'up'
             else ((casval_nodes_before.resources | default([], true)
                    | map(attribute='metadata.name') | list | first) | default('', true))
             if not casval_scale_allowed
             else ((casval_machines_after.resources | default([], true)
                    | map(attribute='status.nodeRef.name') | select('defined')
                    | list | first) | default('', true)) }}
        casval_outcome: >-
          {{ 'superseded' if not casval_scale_allowed
             else 'timeout' if casval_state == 'up' and not casval_up_ready
             else casval_state }}

    - name: Publish the outcome for downstream workflow nodes
      ansible.builtin.set_stats:
        per_host: false
        data:
          casval_label: "{{ casval_outcome }}"
          casval_node: "{{ casval_node_name }}"
          casval_detail: >-
            {{ ('casval leased: node ' ~ casval_node_name ~ ' Ready (MachineSet '
                ~ casval_machineset_name ~ ' replicas=1).')
               if casval_outcome == 'up'
               else ('casval released: MachineSet ' ~ casval_machineset_name
                     ~ ' replicas=0, Machine deleted, host powered down.')
               if casval_outcome == 'down'
               else ('casval release skipped: lease ' ~ casval_lease_id
                     ~ ' was superseded by ' ~ casval_lease_owner_before ~ '.')
               if casval_outcome == 'superseded'
               else ('casval did not become Ready within '
                     ~ (casval_wait_retries | int * casval_wait_delay | int)
                     ~ 's; rollback to replicas=0 requested. Check BareMetalHost '
                     ~ 'casval and CAPM3 logs in ' ~ casval_machineset_namespace
                     ~ '.') }}

    - name: Roll back a timed-out scale-up
      kubernetes.core.k8s:
        state: patched
        api_version: "{{ casval_machineset_api_version }}"
        kind: MachineSet
        name: "{{ casval_machineset_name }}"
        namespace: "{{ casval_machineset_namespace }}"
        definition:
          spec:
            replicas: 0
      when: casval_outcome == 'timeout'

    - name: Fail a timed-out scale-up
      ansible.builtin.fail:
        msg: "{{ casval_detail }}"
      vars:
        casval_detail: >-
          casval did not become Ready within
          {{ casval_wait_retries | int * casval_wait_delay | int }}s;
          rollback to replicas=0 was requested.
      when: casval_outcome == 'timeout'

    - name: Report the outcome
      ansible.builtin.debug:
        msg: "casval_label={{ casval_outcome }} casval_node={{ casval_node_name }}"
