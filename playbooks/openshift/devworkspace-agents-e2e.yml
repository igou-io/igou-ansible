---
# Headless e2e of the golden-path workspace contract, bypassing only the
# Che dashboard UI (cookie-auth, browser-only): applies a real DevWorkspace
# in a persona's namespace and lets the DevWorkspace operator do everything
# the dashboard flow would — project clone init container, postStart agent
# installs (scripts/install-agents.sh from the scaffolded repo), and the
# auto-mount of the aap-mcp-token secret. Then verifies from INSIDE the
# workspace pod:
#   1. AAP_MCP_TOKEN env is mounted (presence only — value never printed)
#   2. claude/codex/cursor-agent/opencode are installed by postStart
#   3. the project cloned and carries .mcp.json
#   4. the persona's MCP/AAP RBAC boundary holds (job template count)
#
# Auth: KUBECONFIG injected by the ocp-kubeconfig AAP credential.
# Cleanup: rerun with dw_state=absent.
- name: DevWorkspace agents + MCP e2e
  hosts: "{{ host | default('localhost') }}"
  connection: local
  gather_facts: false
  vars:
    dw_namespace: dev1-devspaces
    dw_name: mcp-e2e-wf
    dw_repo: https://forgejo.apps.ocp.igou.systems/sandbox/mcp_e2e_wf.git
    dw_image: ghcr.io/ansible/community-ansible-dev-tools:latest
    dw_state: present
    mcp_url: https://aap-mcp-ansible-automation-platform.apps.ocp.igou.systems/mcp
    aap_api: https://automation.apps.ocp.igou.systems
    # what the persona is allowed to see; dev1 = the two sandbox templates
    expected_job_template_count: 2
    dw_definition:
      apiVersion: workspace.devfile.io/v1alpha2
      kind: DevWorkspace
      metadata:
        name: "{{ dw_name }}"
        namespace: "{{ dw_namespace }}"
      spec:
        started: true
        routingClass: basic
        template:
          projects:
            - name: collection
              git:
                remotes:
                  origin: "{{ dw_repo }}"
                checkoutFrom:
                  revision: main
          components:
            - name: tools
              container:
                image: "{{ dw_image }}"
                memoryLimit: 2Gi
                memoryRequest: 512Mi
                cpuRequest: 250m
                mountSources: true
                command:
                  - tail
                args:
                  - -f
                  - /dev/null
          commands:
            - id: install-agents
              exec:
                component: tools
                commandLine: bash scripts/install-agents.sh
                workingDir: /projects/collection
          events:
            postStart:
              - install-agents
  tasks:
    # e2e-learned: DWO creates the per-user common PVC lazily and treats the
    # transient FailedScheduling (pod racing an Immediate-binding PVC) as
    # unrecoverable for raw DevWorkspaces (the ignore list lives in the
    # Che-managed DWOC, which only dashboard workspaces reference). And DWO
    # garbage-collects the PVC with the last workspace, so every fresh run
    # would race again. Pre-create it Bound before the workspace.
    - name: Pre-create the per-user workspace PVC (avoids first-start race)
      when: dw_state == 'present'
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: claim-devworkspace
            namespace: "{{ dw_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
    - name: Wait for the PVC to bind (Immediate binding, external provisioner)
      when: dw_state == 'present'
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ dw_namespace }}"
        name: claim-devworkspace
      register: dw_pvc
      until: >-
        dw_pvc.resources | length > 0 and
        dw_pvc.resources[0].status.phase | default('') == 'Bound'
      retries: 24
      delay: 5

    - name: Apply / remove the DevWorkspace
      kubernetes.core.k8s:
        state: "{{ dw_state }}"
        definition: "{{ dw_definition }}"
        wait: false

    - name: Verify the workspace contract
      when: dw_state == 'present'
      block:
        - name: Wait for the workspace pod to be Ready (postStart gates readiness)
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ dw_namespace }}"
            label_selectors:
              - "controller.devfile.io/devworkspace_name={{ dw_name }}"
          register: dw_pods
          until: >-
            dw_pods.resources | length > 0 and
            (dw_pods.resources[0].status.containerStatuses | default([])
             | selectattr('ready') | list | length) > 0
          retries: 60
          delay: 10

        - name: Set pod name
          ansible.builtin.set_fact:
            dw_pod: "{{ dw_pods.resources[0].metadata.name }}"

        - name: Run in-pod verification
          kubernetes.core.k8s_exec:
            namespace: "{{ dw_namespace }}"
            pod: "{{ dw_pod }}"
            container: tools
            command: >-
              bash -c 'export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH";
              echo "token_mounted=$([ -n "$AAP_MCP_TOKEN" ] && echo yes || echo no)";
              for b in claude codex cursor-agent opencode; do
              echo "$b=$(command -v $b >/dev/null && echo ok || echo missing)"; done;
              echo "clone=$([ -d /projects/collection/.git ] && echo ok || echo missing)";
              echo "mcpjson=$([ -f /projects/collection/.mcp.json ] && echo ok || echo missing)";
              echo "mcp_http=$(curl -sk -o /dev/null -w "%{http_code}" -X POST
              -H "Authorization: Bearer $AAP_MCP_TOKEN" -H "Content-Type: application/json"
              -H "Accept: application/json, text/event-stream"
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"e2e\",\"version\":\"0\"}}}"
              {{ mcp_url }})";
              echo "jt_count=$(curl -sk -H "Authorization: Bearer $AAP_MCP_TOKEN"
              "{{ aap_api }}/api/controller/v2/job_templates/?page_size=1"
              | grep -o "\"count\":[0-9]*" | head -1 | cut -d: -f2)"'
          register: dw_check

        - name: Show verification output
          ansible.builtin.debug:
            msg: "{{ dw_check.stdout_lines }}"

        - name: Assert the workspace contract holds
          ansible.builtin.assert:
            that:
              - "'token_mounted=yes' in dw_check.stdout"
              - "'claude=ok' in dw_check.stdout"
              - "'codex=ok' in dw_check.stdout"
              - "'cursor-agent=ok' in dw_check.stdout"
              - "'opencode=ok' in dw_check.stdout"
              - "'clone=ok' in dw_check.stdout"
              - "'mcpjson=ok' in dw_check.stdout"
              - "'mcp_http=200' in dw_check.stdout"
              - "'jt_count=' ~ expected_job_template_count in dw_check.stdout"
            success_msg: workspace contract verified end-to-end
