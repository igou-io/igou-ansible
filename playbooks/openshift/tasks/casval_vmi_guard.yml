---
- name: Require stopped virtual machines before releasing casval
  ansible.builtin.assert:
    that:
      - >-
        casval_virtualmachine_instances.resources
        | selectattr('status.nodeName', 'defined')
        | selectattr('status.nodeName', 'in', casval_nodes_before.resources | map(attribute='metadata.name') | list)
        | list | length == 0
    fail_msg: Casval still hosts a VirtualMachineInstance. Stop the VM and wait for disk detachment before releasing its lease.
