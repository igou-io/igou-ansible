---
- name: Read the GitOps-managed Casval cache definition
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: casval-image-cache
    namespace: "{{ casval_cache_namespace }}"
  register: casval_cache_config

# GPU-only leases still work before the optional Molecule component is deployed.
- name: Prepare the deployed local image cache
  when: casval_cache_config.resources | length > 0
  block:
    - name: Load the seed definitions
      ansible.builtin.set_fact:
        casval_cache_definitions: "{{ casval_cache_config.resources[0].data['seeds.yml'] | from_yaml }}"

    - name: Require exactly the expected Casval image seeds
      ansible.builtin.assert:
        that:
          - casval_cache_definitions | map(attribute='name') | sort == casval_cache_seeds | sort
          - casval_cache_definitions | map(attribute='source') | sort == ['centos-stream10', 'win11', 'win2k25']
        fail_msg: Casval cache acquisition only manages the three declared local image seeds.

    - name: Retire the legacy scheduled image feeds without deleting seeds
      ansible.builtin.include_tasks: casval_cache_migrate.yml

    - name: Wait for the Casval volume group
      kubernetes.core.k8s_info:
        api_version: lvm.topolvm.io/v1alpha1
        kind: LVMCluster
        name: lvmcluster
        namespace: openshift-storage
      register: casval_cache_lvm
      retries: 60
      delay: 10
      until: >-
        casval_cache_lvm.resources | map(attribute='status.deviceClassStatuses') | flatten
        | map(attribute='nodeStatus') | flatten
        | selectattr('node', 'equalto', casval_cache_node)
        | selectattr('status', 'equalto', 'Ready') | list | length > 0

    - name: Read the current Casval installation identity
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ casval_cache_node }}"
      register: casval_cache_current_node

    - name: Determine whether this installation needs cache recovery
      ansible.builtin.set_fact:
        casval_cache_node_uid: "{{ casval_cache_current_node.resources[0].metadata.uid }}"
        casval_cache_node_created: "{{ casval_cache_current_node.resources[0].metadata.creationTimestamp }}"
        casval_cache_reset: >-
          {{ (casval_cache_current_node.resources[0].metadata.annotations | default({})).get(casval_cache_annotation, '')
             != casval_cache_current_node.resources[0].metadata.uid }}

    - name: Refresh the seeds for this acquisition
      block:
        - name: Recover each stale seed and wait for usable data
          ansible.builtin.include_tasks: casval_image_seed.yml
          loop: "{{ casval_cache_definitions }}"
          loop_control:
            loop_var: casval_cache_definition
      rescue:
        - name: Remove unfinished imports before a failed acquisition can release Casval
          ansible.builtin.include_tasks: casval_cache_cleanup.yml

        - name: Report the failed cache refresh
          ansible.builtin.fail:
            msg: Casval cache refresh failed; completed seeds were preserved and unfinished imports were removed.

    - name: Mark this installation's cache ready after all imports succeed
      kubernetes.core.k8s:
        state: patched
        kind: Node
        name: "{{ casval_cache_node }}"
        definition:
          metadata:
            uid: "{{ casval_cache_node_uid }}"
            annotations:
              molecule.igou.systems/cache-node-uid: "{{ casval_cache_node_uid }}"

    - name: Report the cache lifecycle result
      ansible.builtin.debug:
        msg: "Casval image cache ready for node UID {{ casval_cache_node_uid }}; recovered={{ casval_cache_reset }}."
