---
name: restore-drill
edges:
  - to: backup
    from: start
  - to: gate
    from: backup
  - to: notify_gate
    from: gate
    from_port: 'true'
  - to: notify_bad
    from: gate
    from_port: 'false'
  - to: approve
    from: notify_gate
  - to: restore
    from: approve
    from_port: approved
  - to: bootstrap
    from: restore
  - to: writeup
    from: bootstrap
  - to: notify_done
    from: writeup
nodes:
  - id: backup
    name: Backup devenv state
    type: aap_job_template
    position:
      x: 250
      y: 300
    parameters:
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: devenv_backup
      organization_name: igou
  - id: gate
    name: Backup ok?
    type: condition
    position:
      x: 500
      y: 300
    parameters:
      condition: ${backup.artifacts.backup_label} == 'ok'
  - id: notify_bad
    name: Notify (notify_bad)
    type: aap_job_template
    position:
      x: 750
      y: 500
    settings:
      continue_on_failure: true
    parameters:
      extra_vars:
        notify_title: 'restore-drill: backup FAILED'
        notify_status: critical
        notify_message: Monthly drill aborted - devenv_backup did not publish backup_label=ok (job ${backup.job_url}).
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: notify_gate
    name: Notify (notify_gate)
    type: aap_job_template
    position:
      x: 750
      y: 150
    settings:
      continue_on_failure: false
      timeout: 60
      retry_policy:
        max_retries: 0
    parameters:
      extra_vars:
        notify_title: 'restore-drill: approval pending'
        notify_status: warn
        notify_message: 'Backup ok. Approve within 24h to restore onto ${trigger.restore_target}; timeout = reject = failed run (v1 semantics). Review and decide in AO: https://orchestrator.apps.ocp.igou.systems/executions/${workflow_context.execution.id}. Decision window: 24 hours from the approval gate; timeout rejects.'
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
  - id: approve
    name: Approve restore
    type: approval
    position:
      x: 1000
      y: 150
    parameters:
      prompt: 'Restore drill. Restore devenv agent state onto ${trigger.restore_target}? Backup job: ${backup.job_url}'
      approver_users: []
      approver_groups:
        - admins
      decision_window: 86400
      fallback_decision: reject
  - id: restore
    name: Restore selected host
    type: aap_job_template
    position:
      x: 1250
      y: 150
    parameters:
      extra_vars:
        ansible_limit: ${trigger.restore_target}
        devenv_restore_confirm: true
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: devenv_restore
      organization_name: igou
  - id: bootstrap
    name: Bootstrap restored host
    type: aap_job_template
    position:
      x: 1500
      y: 150
    parameters:
      extra_vars:
        ansible_limit: ${trigger.restore_target}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: devenv_bootstrap
      organization_name: igou
  - id: writeup
    name: Drill write-up (qwen3.8-27b)
    type: agentic
    position:
      x: 1750
      y: 150
    settings:
      continue_on_failure: true
    parameters:
      prompt: 'Write a <=90-word restore-drill record for an ops log. Backup job: ${backup.job_url} (status ${backup.job_status}). Restore job: ${restore.job_url} (status ${restore.job_status}, started ${restore.started}, finished ${restore.finished}). Bootstrap: ${bootstrap.job_status}. State the measured restore duration from the timestamps, the selected target ${trigger.restore_target}, and one observation. Plain text, no markdown.'
      llm_model_id: 0b4ae1c2-ac1a-4de3-8977-6bd42ca1940c
      credential_id: bb280dc9-bf75-491b-9820-3f5b6bf11a6d
      response_schema:
        type: object
        required:
          - summary
        properties:
          summary:
            type: string
  - id: notify_done
    name: Notify (notify_done)
    type: aap_job_template
    position:
      x: 2000
      y: 150
    settings:
      continue_on_failure: true
    parameters:
      extra_vars:
        notify_title: 'restore-drill: complete'
        notify_status: ok
        notify_message: ${writeup.result.content.summary}
      credential_id: f95708b4-c5f6-4e77-a37e-3cada9757c16
      integration_id: d20b53cf-8511-4f2f-a268-2f47d2186b09
      job_template_name: notify_slack
      organization_name: igou
triggers:
  - id: start
    name: Select a restore target
    type: manual_trigger
    position:
      x: 0
      y: 300
    parameters:
      input_schema:
        type: object
        required:
          - restore_target
        properties:
          restore_target:
            type: string
            title: Restore target
            description: Existing inventory host to restore and bootstrap; select deliberately before approval.
            minLength: 1
            pattern: '\S'
description: 'Manual devenv restore drill with an explicit target: backup -> gate -> approval -> restore -> bootstrap -> agentic write-up -> Slack. Build item #2.'
schema_version: 2.0.0
