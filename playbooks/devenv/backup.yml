---
# Devenv agent-state backup to S3 (default) or a controller file.
#
# Tars agent/tooling state (Claude/Codex/opencode config + sessions, tmux,
# scratch workspace) from the target host with numeric ownership, then saves
# the archive to a private controller file or the inventory-selected S3 key.
# Production defaults to the versioned devenv-backups bucket on rustfs-cold;
# its ILM policy expires superseded versions after 30 days.
#
# Target is the vscode.igou.systems devhost - the physical machine that runs
# the devcontainer. (A deliberately selected test rebuild host can be
# targeted explicitly via `-e ansible_limit=<host>`; its
# devcontainer layout maps the same way.)
#
# Container<->host path mapping: the devcontainer binds host ~/.claude-container
# -> container ~/.claude, and host ~/workspace -> container /workspace. This
# play SSHes to the HOST, so it archives the HOST-side bind sources (e.g.
# .claude-container, workspace/scratch), NOT the in-container paths.
#
# HOT backup by design: nothing is quiesced. The state is dotfiles and
# session scratch, so a crash-consistent snapshot is fine and the agents
# keep running while it is taken. The consequence is that GNU tar routinely
# exits rc=1 ("file changed as we read it") when a live session rewrites a
# file mid-read; that is expected and accepted, see the archive task.
#
# Everything here is igou-owned - there is no become anywhere in this play,
# and the fetch reads the archive as the ssh login user directly.
#
# S3 settings and the complete 1Password credential lookups come from
# inventory. Set devenv_backup_destination=file and an absolute
# devenv_archive_file path to write a private archive on the controller
# without an object store or 1Password credential.
#
# Restore through playbooks/devenv/restore.yml with an explicit target and
# confirmation; select file or s3 as the restore source.
- name: Back up devenv agent state
  hosts: "{{ ansible_limit | default('vscode.igou.systems') }}"
  gather_facts: false
  vars:
    devenv_backup_home: /home/igou
    devenv_backup_paths: # host-side, relative to devenv_backup_home
      - .claude.json
      - .claude-container # host-side bind source of the container's ~/.claude (the primary agent state)
      - .claude # the host's own native claude state, if any
      - .tmux.conf
      - .codex
      - .opencode # host-native opencode dir if present (the container ~/.opencode is overlay-ephemeral)
      - .config/opencode
      - .local/share/opencode # durable opencode data (bind-mounted into the container)
      - workspace/scratch # host-side bind source of the devcontainer's /workspace/scratch
    devenv_backup_required_paths: # absent => wrong host/unprovisioned home => fail
      - .claude-container
    # Real agent state is tens of MB; an implausibly small tarball means the
    # home was empty or wrong - fail rather than upload garbage.
    devenv_backup_min_bytes: 10485760

  pre_tasks:
    - name: Validate the selected backup destination
      ansible.builtin.assert:
        that:
          - devenv_backup_destination | default('s3') in ['file', 's3']
          - devenv_backup_destination | default('s3') != 'file' or (devenv_archive_file | default('')) is match('^/')
        fail_msg: Select file or s3; file mode requires an absolute controller-side devenv_archive_file path.

    - name: Require inventory S3 settings for an object-store backup
      ansible.builtin.assert:
        that:
          - devenv_s3_endpoint is defined
          - devenv_s3_bucket is defined
          - devenv_s3_object is defined
          - devenv_s3_region is defined
          - devenv_s3_access_key_lookup is defined
          - devenv_s3_secret_key_lookup is defined
        fail_msg: Define the S3 endpoint, bucket, object, region, and complete credential lookups in inventory.
      when: devenv_backup_destination | default('s3') == 's3'
      no_log: true

    - name: Stage a control-node scratch path for the fetched archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: _local_archive
      delegate_to: localhost
      connection: local
      changed_when: false

  tasks:
    # Restore-drill groundwork: publish the outcome as an AAP job artifact so an
    # Automation Orchestrator workflow can branch on it (a drill only makes
    # sense against a backup that actually landed). Pessimistic default -
    # anything that fails below leaves 'failed' standing as the published label,
    # since a failed play never reaches the success task in post_tasks.
    # aggregate: false so that overwrite replaces rather than concatenates.
    - name: Default the backup label to failed until the upload is confirmed
      ansible.builtin.set_stats:
        data:
          backup_label: failed
        per_host: false
        aggregate: false

    - name: Stat each candidate backup path on the target
      ansible.builtin.stat:
        path: "{{ devenv_backup_home }}/{{ item }}"
      loop: "{{ devenv_backup_paths }}"
      register: _path_stat

    - name: Partition the candidate paths into present and missing
      ansible.builtin.set_fact:
        _existing: "{{ _path_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
        _missing: "{{ _path_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Refuse to back up a host that is not a provisioned devenv home
      ansible.builtin.assert:
        that:
          - devenv_backup_required_paths | difference(_existing) | length == 0
        fail_msg: >-
          Required path(s) {{ devenv_backup_required_paths | difference(_existing) }}
          are missing under {{ devenv_backup_home }} - this is the wrong host
          or an unprovisioned home. Refusing to archive garbage.

    - name: Note any optional paths that are absent and will be skipped
      ansible.builtin.debug:
        msg: "Skipping absent paths: {{ _missing }}"
      when: _missing | length > 0

    - name: Stage a guest scratch file for the archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: _remote_archive
      changed_when: false

    - name: Archive the existing devenv state paths
      # HOT backup: nothing is quiesced, so GNU tar (1.35, measured) exits
      # rc=1 "file changed as we read it" whenever a live agent session
      # rewrites a file mid-read - accepted. Live unix sockets under
      # ~/.claude and ~/.codex only draw a "socket ignored" warning and do
      # NOT change the rc (measured: socket-only run stays rc=0), so no
      # --warning override is needed. rc=2 is a real error and still fails.
      ansible.builtin.command:
        argv: >-
          {{ ['tar', 'czf', _remote_archive.path, '--numeric-owner', '-C', devenv_backup_home]
             + _existing }}
      register: _tar
      changed_when: true
      failed_when: _tar.rc not in [0, 1]

    - name: Fetch the archive to the control node
      ansible.builtin.fetch:
        src: "{{ _remote_archive.path }}"
        dest: "{{ _local_archive.path }}"
        flat: true

    - name: Remove the guest scratch file
      ansible.builtin.file:
        path: "{{ _remote_archive.path }}"
        state: absent
      changed_when: false

    - name: Stat the fetched archive
      ansible.builtin.stat:
        path: "{{ _local_archive.path }}"
      register: _archive_stat
      delegate_to: localhost
      connection: local

    - name: Refuse to upload an implausibly small archive
      ansible.builtin.assert:
        that:
          - _archive_stat.stat.size | int >= devenv_backup_min_bytes | int
        fail_msg: >-
          Archive is {{ _archive_stat.stat.size }} bytes (<
          {{ devenv_backup_min_bytes }}) - was {{ devenv_backup_home }}
          actually populated?
      delegate_to: localhost
      connection: local

    - name: Upload the archive as the new current version
      amazon.aws.s3_object:
        endpoint_url: "{{ devenv_s3_endpoint }}"
        access_key: "{{ devenv_s3_access_key_lookup }}"
        secret_key: "{{ devenv_s3_secret_key_lookup }}"
        region: "{{ devenv_s3_region }}"
        bucket: "{{ devenv_s3_bucket }}"
        object: "{{ devenv_s3_object }}"
        src: "{{ _local_archive.path }}"
        mode: put
        # No canned ACL: the devenv-backups policy grants no ACL verbs and
        # RustFS access control is IAM-policy based - the module's default
        # (permission: [private]) makes a separate PutObjectAcl call after
        # a multipart upload, which 403s.
        permission: []
      # RustFS 1.0.0-beta.8 miscomputes CRC32 on UploadPart, so the default
      # integrity checksums boto3 >= 1.36 sends (2025-01 behavior change)
      # fail every multipart part with "Io error: checksum mismatch: CRC32".
      # when_required is the documented escape hatch for third-party stores.
      environment:
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      delegate_to: localhost
      connection: local
      no_log: true
      when: devenv_backup_destination | default('s3') == 's3'

    - name: Save the archive to the controller file
      ansible.builtin.copy:
        src: "{{ _local_archive.path }}"
        dest: "{{ devenv_archive_file }}"
        remote_src: true
        mode: '0600'
      delegate_to: localhost
      connection: local
      no_log: true
      when: devenv_backup_destination | default('s3') == 'file'

    - name: Read back the uploaded object's metadata
      amazon.aws.s3_object_info:
        endpoint_url: "{{ devenv_s3_endpoint }}"
        access_key: "{{ devenv_s3_access_key_lookup }}"
        secret_key: "{{ devenv_s3_secret_key_lookup }}"
        region: "{{ devenv_s3_region }}"
        bucket_name: "{{ devenv_s3_bucket }}"
        object_name: "{{ devenv_s3_object }}"
      register: _uploaded
      delegate_to: localhost
      connection: local
      no_log: true
      when: devenv_backup_destination | default('s3') == 's3'

    - name: Record the backup outcome
      ansible.builtin.debug:
        msg: >-
          Uploaded {{ _archive_stat.stat.size }} bytes to
          s3://{{ devenv_s3_bucket }}/{{ devenv_s3_object }}
          (version {{ _uploaded.object_info[0].object_data.version_id
                      | default('n/a') }})
      when: devenv_backup_destination | default('s3') == 's3'

    - name: Report the file backup outcome
      ansible.builtin.debug:
        msg: "Saved {{ _archive_stat.stat.size }} bytes to {{ devenv_archive_file }}"
      when: devenv_backup_destination | default('s3') == 'file'

  post_tasks:
    - name: Publish the successful backup outcome for the orchestrator
      ansible.builtin.set_stats:
        data:
          backup_label: ok
          backup_bytes: "{{ _archive_stat.stat.size | int }}"
        per_host: false
        aggregate: false

    - name: Remove the control-node scratch file
      ansible.builtin.file:
        path: "{{ _local_archive.path }}"
        state: absent
      delegate_to: localhost
      connection: local
      changed_when: false
