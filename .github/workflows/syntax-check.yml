---
name: Playbook syntax check

"on":
  push:
    branches:
      - main
      - prerelease
  pull_request:
    branches:
      - main
      - prerelease

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install ansible-core
        run: |
          pip install "$(awk '/package_pip: ansible-core==/ {print $2}' execution-environments/igou-awx-ee/execution-environment.yml)"

      - name: Install dependencies
        env:
          # Install-only exception for prometheus.prometheus's Core 2.21 cap.
          ANSIBLE_COLLECTIONS_ON_ANSIBLE_VERSION_MISMATCH: ignore
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy role install -r requirements.yml

      - name: Syntax check all playbooks
        env:
          # Files under playbooks/ that ansible-playbook --syntax-check cannot parse:
          #  - ansible-navigator.yml: navigator config, not a playbook (top-level dict)
          #  - rhsm-system-register: subscription-only collections
          SKIP_PLAYBOOKS: |
            playbooks/aap/ansible-navigator.yml
            playbooks/rhel/rhsm-system-register.yml
        run: |
          # Exclude non-playbook YAML: task-include sidecars (_*.yml), any
          # tasks/ and vars/ subdirectories, transport/ task-include
          # sidecars (e.g. playbooks/armbian/transport/*), and files/ data dirs
          # (e.g. cloud-init user-data shipped via ansible.builtin.copy).
          failed=0
          for playbook in $(find playbooks \
              \( -path '*/tasks/*' -o -path '*/vars/*' -o -path '*/transport/*' -o -path '*/files/*' -o -name '_*' \) -prune \
              -o \( -name '*.yml' -o -name '*.yaml' \) -print | sort); do
            if echo "${SKIP_PLAYBOOKS}" | grep -qx "${playbook}" ||
                [[ "${playbook}" == */orchestrator-workflow.yml ||
                   "${playbook}" == *-orchestrator-workflow.yml ]]; then
              echo "Skipping ${playbook} (not a syntax-checkable playbook)"
              continue
            fi
            echo "Checking ${playbook}..."
            extra_args=()
            # Restore requires explicit targeting, including for syntax-only checks.
            if [[ "${playbook}" == playbooks/devenv/restore.yml ]]; then
              extra_args=(-e ansible_limit=localhost)
            fi
            if ! ansible-playbook --syntax-check "${playbook}" "${extra_args[@]}"; then
              failed=1
            fi
          done
          exit "${failed}"
