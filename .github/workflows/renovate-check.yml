---
name: Renovate coverage

"on":
  pull_request:
    branches:
      - main
      - devel
    paths:
      - renovate.json
      - requirements.yml
      - execution-environments/**/execution-environment.yml
      - ansible-navigator.yml
      - playbooks/**
      - roles/fedora_desktop/defaults/main.yml
      - molecule/**/inventory/**
      - tests/test-renovate.mjs
      - .github/workflows/ee-build.yml
      - .github/workflows/renovate-check.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: docker.io/renovate/renovate:44.184.0@sha256:94cffc10fabc766716a4f37cd8ab2a75481da9d9b5a36dabe91630bd7b971b9a
      options: --user 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Renovate configuration
        env:
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: renovate-config-validator renovate.json
      - name: Verify extraction, rendered updates and review policies
        run: node tests/test-renovate.mjs
