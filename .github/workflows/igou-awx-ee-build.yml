---
# Workflow name
name: igou-awx-ee build

# Controls when the workflow will run
on:
  pull_request:
    branches:
      - main
      - prerelease
    paths:
      - 'execution-environments/igou-awx-ee/**'
      - 'requirements.yml'
      - '.github/workflows/ee-build.yml'
      - '.github/workflows/igou-awx-ee-build.yml'
  # Build changed EE definitions on both publication branches
  push:
    branches:
      - main
      - prerelease
    paths:
      - 'execution-environments/igou-awx-ee/**'
      - 'requirements.yml'
      - '.github/workflows/ee-build.yml'

  # Schedule workflow run at 00:00 on Sunday
  schedule:
    - cron: '0 0 * * 0'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: awx-ee-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call-deploy-workflow:
    # The reusable workflow's SBOM/attestation steps can't exceed the
    # caller's token grants, so they must be granted here too.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses:  ./.github/workflows/ee-build.yml
    with:
      PUBLISH: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/prerelease"]'), github.ref) && github.event_name != 'pull_request' }}
      EE_FOLDER_NAME: 'igou-awx-ee'
      EE_IMAGE_TAG: ${{ github.ref == 'refs/heads/prerelease' && 'prerelease' || 'latest' }}
      QUAY_USER: 'igou'
    secrets:
      AH_TOKEN: ${{ secrets.AH_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
