bugfixes:
  - devenv backup - exclude regenerable bulk (node_modules, virtualenvs, ISO and qcow2 images) from the archive and refuse to fetch an archive larger than ``devenv_backup_max_bytes`` (8 GiB), so an oversized backup can no longer exhaust the AAP job pod's node memory (https://github.com/igou-io/igou-ansible/pull/686).
