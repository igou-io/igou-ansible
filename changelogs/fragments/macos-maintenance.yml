---
minor_changes:
  - macos - Add ``playbooks/macos/`` for the hosts in the ``macos`` inventory group. ``health_report.yaml`` runs a read-only health report and security audit and posts it to Slack. ``update.yaml`` upgrades Homebrew and App Store apps and installs Apple updates that need no restart. ``configure.yaml`` applies the settings baseline that the report audits. ``cleanup.yaml`` frees disk space.
