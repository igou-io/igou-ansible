---
removed_features:
  - Removed nine unused VM experiment playbooks, the devenv VLAN 9 provisioner, five standalone examples, and three legacy root-level bootstrap/example plays.
  - Removed the exclusively used VM-management experiment role, libguestfs collection, and WireGuard role dependencies and stale VM lint exclusions.
breaking_changes:
  - devenv restore required an explicit nonempty ansible_limit target instead of defaulting to the retired devenv-vlan9 VM; confirmation remained required.
  - The restore-drill workflow replaced its monthly trigger with manual target selection and passed the approved target to both restore and bootstrap.
